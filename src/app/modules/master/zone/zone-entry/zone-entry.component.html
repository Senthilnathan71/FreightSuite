  <div class="col-12">
    <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
      <div class="col-md-4 pb-2">
        <h4 class="page-title mb-0">Add Zone</h4>
      </div>
      <div class="col-md-8 pb-2">
        <div
          class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
          <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" (click)="goBack()">
            <i class="fas fa-chevron-left me-1"></i>
            Back
          </button>
          <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
            <i class="fas fa-sync-alt me-1"></i>
            Reset
          </button>
          <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="saveZone()">
            <i class="fas fa-save me-1"></i>
            Save
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card h-100">
      <div class="card-body">
        <div class="row">
          <aside class="col-md-12">
            <div class="custom-form-group">
              <input type="text" id="text-input" class="custom-input-field sm" placeholder=" "
                formControlName="ZoneName" />
              <label for="text-input" class="input-label">Name</label>
            </div>
          </aside>
          <aside class="col-md-6">
            <div class="custom-form-group">
              <input type="text" id="text-input" class="custom-input-field sm" placeholder=" "
                formControlName="ZoneCode" />
              <label for="text-input" class="input-label">Code</label>
            </div>
          </aside>
          <!-- <aside class="col-md-6">
                        <div class="custom-form-group">

                            <label for="text-input" class="input-label">country</label>
                        </div>
                    </aside> -->
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-6 mt-md-0 mt-3">
    <div class="card h-100">
      <div class="card-body">
        <div class="row">
          <!-- <aside class="col-md-9">

          <aside class="col-md-3">
            <div class="custom-form-group">
              <input type="text" id="text-input" class="custom-input-field sm" placeholder=" "
                formControlName="status" />
              <label for="text-input" class="input-label">Status</label>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </div>
</div>
