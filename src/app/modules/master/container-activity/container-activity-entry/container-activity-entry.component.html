<div class="row">
    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
            <div class="col-md-4 pb-2">
                <h4 class="page-title mb-0">Container Activity</h4>
            </div>
            <div class="col-md-8 pb-2">
                <div
                    class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                        (click)="navigateToBack()">
                        <i class="fas fa-chevron-left me-1"></i>
                        Back
                    </button>
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-sync-alt me-1"></i>
                        Reset
                    </button>
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-save me-1"></i>
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-12">
        <div class="card h-100 mb-0">
            <div class="card-body">
                <div class="row">

                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Activity Code <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Activity Name <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="" [items]="modeOfContainerMoveStatus" bindLabel="name"
                                bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">Container Move Status <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="" [items]="modeOfMoveType" bindLabel="name" bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">Move Type <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4 d-flex align-items-center">
                        <div class="form-check form-check-inline p-0">
                            <div class="form-check d-flex align-items-center">
                                <input type="checkbox" formControlName="DamageMove" id="DamageMove"
                                    class="form-check-input sm">
                                <label for="DamageMove" class="form-check-label sm">Damage Move <span
                                        class="text-danger"></span></label>
                            </div>
                        </div>
                    </aside>

                    <!-- <aside class="col-md-4 d-flex align-items-center">
                        <div class="form-check form-check-inline p-0">
                            <div class="form-check d-flex align-items-center">
                                <input type="checkbox" formControlName="ActivityMapping" id="ActivityMapping"
                                    class="form-check-input sm">
                                <label for="ActivityMapping" class="form-check-label sm">Activity Mapping <span
                                        class="text-danger"></span></label>
                            </div>
                        </div>
                    </aside> -->
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <textarea id="Remarks" class="custom-input-field sm" placeholder="" rows="1"
                                formControlName="Remarks" maxlength="500"></textarea>
                            <label for="Remarks" class="input-label">Remarks</label>

                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="Status" [items]="modeOfStatus" bindLabel="name"
                                bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">Status <span class="text-danger"></span></label>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-12 mt-3">
        <div class="card shadow-sm border-0">
            <div class="card-header  bg-info text-white">
                <h6 class="mb-0 fw-bold"> Activity Mapping</h6>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="text-uppercase text-dark fw-bold" style="width: 33%;">Available Activity
                                </th>
                                <th class="text-center" style="width: 33%;"></th>
                                <th class="text-uppercase text-dark fw-bold text-end" style="width: 33%;">Next
                                    Activity</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><span class="badge bg-secondary p-2">SNTS</span></td>
                                <td class="fs-4 text-center text-success">
                                    <i class="fas fa-arrow-right"></i>
                                </td>
                                <td class="text-end"><span class="badge bg-success p-2">SNTS</span></td>
                            </tr>
                            <tr>
                                <td><span class="badge bg-secondary p-2">GTIN</span></td>
                                <td class="fs-4 text-center text-danger">
                                    <i class="fas fa-arrow-left"></i>
                                </td>
                                <td class="text-end"><span class="text-muted">---</span></td>
                            </tr>
                            <tr>
                                <td><span class="badge bg-secondary p-2">SNTS</span></td>
                                <td class="fs-4 text-center text-success">
                                    <i class="fas fa-arrow-right"></i>
                                </td>
                                <td class="text-end"><span class="badge bg-success p-2">SNTS</span></td>
                            </tr>
                            <tr>
                                <td><span class="badge bg-secondary p-2">GTIN</span></td>
                                <td class="fs-4 text-center text-danger">
                                    <i class="fas fa-arrow-left"></i>
                                </td>
                                <td class="text-end"><span class="text-muted">---</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>


</div>
