     <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm">
            <div class="col-md-4 pb-2">
                <h4 class="page-title mb-0">Organization</h4>
            </div>
            <div class="col-md-8 pb-2">
                <div class="" data-bs-theme="light">
                    <form
                        class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                        <!-- <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"  (click)="search()">
                            <i class="fas fa-search me-1"></i>
                            Search
                        </button> -->
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                            (click)="navigateToCreateOrganization()">
                            <i class="fas fa-plus me-1"></i> Create
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                            <i class="fas fa-file-alt me-1"></i>
                            Report
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="reset()">
                            <i class="fas fa-sync-alt me-1"></i>
                            Reset
                        </button>
                    </form>
                </div>
            </div>
            <div class="col-md-12  border-top">
                <div class="row mx-0 py-2">
                    <div class="col-md-8 mx-auto px-0">
                        <form
                            class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0">
                            <div class="form-outline col-12 col-md px-0">
                                <select [(ngModel)]="searchType" name="searchType" class="form-select">
                                <option value="CustomerName">Customer Name</option>
                                <option value="CustomerShortCode">Customer Code</option>
                                <option value="CustomerAliasName">Customer Full Name</option>
                                <option value="Website">Website</option>
                                <option value="LocalLanguage">Language</option>
                                <option value="status">Status</option>
                            </select>
                            </div>
                            <!-- <div class="form-outline col-12 col-md px-0">
                                <input name="filterValue" type="text" class="form-control"
                                    placeholder="Enter filter value"
                                    [(ngModel)]="filterValue">
                                <i
                                    class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                            </div> -->
                            
              <div class="d-flex d-md-flex gap-2 col-12 col-md px-0 align-items-center">
                <div class="form-outline flex-grow-1">
                  <input [(ngModel)]="filterValue" name="filterValue" type="text" class="form-control"
                    placeholder="Enter filter value">
                  <i class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                </div>

                <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="search()">
                  <i class="fas fa-search me-1"></i>
                  Search
                </button>
              </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalLengthOfCollection > 0">
         <div class="col-12 p-0" >
        <div class="table-responsive">
            <table class="table table-hover align-middle no-wrap table-bordered">
                <thead>
                    <tr class="bg-info">
                        <th class="bg-transparent text-light" scope="col">Action</th>
                        <th class="bg-transparent text-light" scope="col">Customer Name</th>
                        <!-- <th class="bg-transparent text-light" scope="col">Code</th>
                        <th class="bg-transparent text-light" scope="col">Full Name</th>
                        <th class="bg-transparent text-light" scope="col">Website</th>
                        <th class="bg-transparent text-light" scope="col">Language</th> -->
                         <th class="bg-transparent text-light" scope="col">Type</th>
                          <th class="bg-transparent text-light" scope="col">Short Name</th>
                           <th class="bg-transparent text-light" scope="col">PAN/Vat</th>
                            <th class="bg-transparent text-light" scope="col">Country</th>
                        <th class="bg-transparent text-light" scope="col">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of organizationList; let i = index; trackBy: trackByIndex">
                         <td>
                            <div class="d-flex align-items-center">
                                <a class="text-info mx-2" class="link mx-2 ps-3 "
                                    [routerLink]="['/master/organization/entry/', item.CustomerMasterSid]">
                                    <i-feather class="feather-sm" name="eye"></i-feather>
                                </a>
                                <a class="text-danger mx-2 ps-3 border-start"
                                    (click)="deleteOrganization(item.CustomerMasterSid)">
                                    <i-feather name="trash-2" class="feather-sm"></i-feather>
                                </a>
                            </div>
                        </td>
                       
                        <td>
                            <div class="text-truncate">{{item.CustomerName}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.CustomerShortCode}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.CustomerAliasName}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.Website}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.LocalLanguage}}</div>
                        </td>
                        <td>
                            @if(item.status === "A"){
                            <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                Active
                            </div>
                            } @else {
                            <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                Invalid
                            </div>
                            }
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
        <div>
            <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
            </ngb-pagination>
        </div>
    </div>
    </div>
   

    <!-- No records found -->
    <div class="col-12" *ngIf="totalLengthOfCollection === 0">
        <div>No records found</div>
    </div>
</div>
