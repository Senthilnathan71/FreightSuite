<div class="row">
  <div class="col-12">
      <div class="rounded-3 p-2 bg-body-tertiary shadow mb-2">
          <div class="col-12">
              <div class="rounded-3 p-2 bg-body-tertiary shadow mb-2" data-bs-theme="light"><!-- Search Form -->
                <form class="d-flex align-items-center gap-2" (ngSubmit)="search(); $event.preventDefault()">
                  <div class="form-outline col">
                    <select [(ngModel)]="searchType" name="searchType" class="form-select">
                      <option value="commodityName">Commodity Name</option>
                      <option value="commodityCode">Commodity Code</option>
                      <option value="commodityType">Commodity Type</option>
                      <option value="hsCode">HS Code</option>
                      <option value="status">Status</option>
                    </select>
                  </div>
                  <div class="form-outline col">
                    <input [(ngModel)]="filterValue" name="filterValue" type="text" class="form-control"
                           placeholder="Enter filter value">
                  </div>
                  
                  <button type="submit" class="btn btn-info btn-sm" [disabled]="loading">
                    <i class="fas fa-search"></i>
                    <span *ngIf="!loading">Search</span>
                    <span *ngIf="loading">Searching...</span>
                  </button>
                  
                  <button type="button" class="btn btn-info btn-sm" (click)="navigateToCreateCommodity()" [disabled]="loading">
                    <i class="mdi mdi-plus"></i> Create
                  </button>
                  
                  <button type="button" class="btn btn-secondary btn-sm d-flex align-items-center gap-1" [disabled]="loading">
                    <i-feather name="arrow-down-right" class="feather-sm"></i-feather>
                    Report
                  </button>
                  
                  <button type="button" class="btn btn-secondary btn-sm" (click)="resetSearch()" [disabled]="loading">
                    Reset
                  </button>
                </form>
              </div>
          </div>
      </div>
  </div>
  <div class="col-12" *ngIf="totalLengthOfCollection > 0 && !loading">
      <div class="table-responsive">
          <table class="table table-hover align-middle no-wrap table-bordered">
              <thead>
                  <tr class="bg-info">
                      <th class="bg-transparent text-light" scope="col">Name</th>
                      <th class="bg-transparent text-light" scope="col">Code</th>
                      <th class="bg-transparent text-light" scope="col">Type</th>
                      <th class="bg-transparent text-light" scope="col">HS Code</th>
                      <th class="bg-transparent text-light" scope="col">Status</th>
                      <th class="bg-transparent text-light" scope="col">Action</th>
                  </tr>
              </thead>
              <tbody>
                  <tr *ngFor="let item of commodityList; let i = index; trackBy: trackByIndex">
                      <td>
                          <div class="text-truncate">{{item.CommodityName}}</div>
                      </td>
                      <td>
                          <div class="text-truncate">{{item.CommodityCode}}</div>
                      </td>
                      <td>
                          <div class="text-truncate">{{item.CommodityType}}</div>
                      </td>
                      <td>
                          <div class="text-truncate">{{item.HSSACCode}}</div>
                      </td>
                      <td>
                          <span class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                              <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                              {{ getStatusText(item.status) }}
                          </span>
                      </td>
                      <td>
                          <div class="d-flex align-items-center">
                              <a class="text-primary mx-2" 
                                 [routerLink]="['/master/commodity/entry/', item.commodityMasterSid]"
                                 title="Edit">
                                 <i-feather name="edit-3" class="feather-sm"></i-feather>
                              </a>
                              <a class="text-danger mx-2 ps-3 border-start"
                                 (click)="deleteCommodity(item.commodityMasterSid)"
                                 title="Delete">
                                 <i-feather name="trash-2" class="feather-sm"></i-feather>
                              </a>
                          </div>
                      </td>
                  </tr>
              </tbody>
          </table>
      </div>
      <div>
          <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
              [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
          </ngb-pagination>
      </div>
  </div>

  <!-- Loading indicator -->
  <div class="col-12" *ngIf="loading">
      <div class="text-center py-4">
          <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Loading data...</p>
      </div>
  </div>

  <!-- No records found -->
  <div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed && !loading">
      <div class="alert alert-info">No records found matching your search criteria</div>
  </div>
</div>
