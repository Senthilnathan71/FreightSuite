<div class="row">

    <div class="col-12">
        <div class="rounded-3 p-2 bg-body-tertiary shadow mb-2">
            <div class="col-8 mx-auto">
                <div class="rounded-3 p-2 bg-body-tertiary  mb-2" data-bs-theme="light">
                    <form class="d-flex align-items-center gap-2">
                        <div class="form-outline col">
                            <select name="searchType" class="form-select" [(ngModel)]="searchType">
                                <option value="departmentName">Department Name</option>
                                <option value="departmentCode">Department Code</option>
                                <option value="departmentType">Department Type</option>
                                <option value="ExportImport">Export/Import</option>
                                <option value="FCLLCL">FCLLCL</option>
                                <option value="status">Status</option>
                            </select>
                        </div>
                        <div class="form-outline col">
                            <input [(ngModel)]="filterValue" name="filterValue" type="text" class="form-control"
                                placeholder="Enter filter value">
                            <i
                                class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                        </div>

                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80" (click)="search()">
                            <i class="fas fa-search"></i>
                            Search
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80">
                            <i class="mdi mdi-plus"></i> Create
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80">
                            Report
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80">
                            Reset
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12">
        <div class="table-responsive">
            <table class="table table-hover align-middle no-wrap table-bordered">
                <thead>
                    <tr class="bg-info">
                        <th class="bg-transparent text-light" scope="col">Action</th>
                        <th class="bg-transparent text-light" scope="col">Company Name</th>
                        <th class="bg-transparent text-light" scope="col">Company Code</th>
                        <th class="bg-transparent text-light" scope="col">Country</th>
                        <th class="bg-transparent text-light" scope="col">Country Year</th>
                        <th class="bg-transparent text-light" scope="col">Remarks</th>
                        <th class="bg-transparent text-light" scope="col">Status</th>
                    </tr>
                </thead>
                <tbody>

                    <tr>
                        <td>
                            <i-feather name="edit-3" class="feather-sm ms-2"></i-feather>
                        </td>
                        <td>
                            <div class="text-truncate">OMS</div>
                        </td>
                        <td>
                            <div class="text-truncate">RO</div>
                        </td>
                        <td>
                            <div class="text-truncate">Rial</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <span class="bg-light-success px-2  rounded-pill d-inline-flex align-items-center gap-1">
                                <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                Active</span>
                        </td>

                    </tr>

                </tbody>
            </table>
        </div>
