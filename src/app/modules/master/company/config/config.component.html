<nav class="navbar navbar-light bg-light border-bottom px-2">
    <div class="container-fluid d-flex justify-content-between">
        <div class="d-flex align-items-center flex-wrap gap-5">
            <h5 class="mb-0 pe-5 border-end text-info">Configurations</h5>
            <div class="pe-5 d-flex gap-2">
                <strong>Company :</strong> <span class="badge text-bg-secondary">{{ companyName || 'N/A' }}</span>
            </div>
        </div>
        <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" 
                (click)="goBackToCompany()">
            <i class="fas fa-chevron-left me-1"></i>
            Back
        </button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 bg-light border-end" style="height: 83vh">
            <ul class="nav flex-column pt-3">
                <li class="nav-item" *ngFor="let section of ['master', 'crm', 'settings', 'accounts']">
                    <a href="#"
                        class="nav-link d-flex justify-content-between align-items-center px-3 py-1 my-2 rounded"
                        [ngStyle]="{
                            backgroundColor:
                                activeSection === section
                                ? '#05608d'
                                : hovered === section
                                ? '#6c757d'
                                : 'transparent',
                            color:
                                activeSection === section || hovered === section
                                ? 'white'
                                : '#212529'
                        }" 
                        (mouseover)="hovered = section" 
                        (mouseout)="hovered = ''"
                        (click)="setSection(section); $event.preventDefault()">
                        {{ section | titlecase }}
                        <i class="fas fa-angle-right" [ngStyle]="{
                            color:
                                activeSection === section || hovered === section
                                ? 'white'
                                : '#6c757d'
                        }"></i>
                    </a>
                </li>
            </ul>
        </div>
 
        <!-- Main Content --> 
        <div class="col-md-10 p-2">
            <h5 class="mb-3 border-bottom p-2 text-capitalize">{{ activeSection }}</h5>

            <ng-container [ngSwitch]="activeSection">
                <!-- Master Section -->
                <div *ngSwitchCase="'master'">
                    <div ngbAccordion [closeOthers]="true">
                        <div ngbAccordionItem *ngFor="let master of getMasterKeys()" [id]="master">
                            <h2 ngbAccordionHeader>
                                <button ngbAccordionButton>
                                    <strong>{{ master | titlecase }}</strong>
                                </button>
                            </h2>
                            <div ngbAccordionCollapse>
                                <div class="card">
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-6 mb-3" *ngFor="let field of getMasterFieldKeys(master)">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" [id]="master + '_' + field"
                                                           [checked]="getConfigValue('masters', master, field)"
                                                           (change)="toggleField('masters', master, field)">
                                                    <label class="form-check-label" [for]="master + '_' + field">
                                                        {{ getLabel('masters', master, field) }}
                                                    </label>
                                                </div>
                                                <input *ngIf="master !== 'basic'" class="form-control form-control-sm mt-1"
                                                       [(ngModel)]="config.masters[master].fields[field].label"
                                                       [placeholder]="'Label for ' + field">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CRM Section -->
                <div *ngSwitchCase="'crm'">
                    <div ngbAccordion [closeOthers]="true">
                        <div ngbAccordionItem *ngFor="let subsection of getCrmSubsections()" [id]="subsection">
                            <h2 ngbAccordionHeader>
                                <button ngbAccordionButton>
                                    <strong>{{ subsection | titlecase }}</strong>
                                </button>
                            </h2>
                            <div ngbAccordionCollapse>
                                <div class="card">
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-6 mb-3" *ngFor="let field of getCrmFieldKeys(subsection)">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" 
                                                           [id]="'crm_' + subsection + '_' + field"
                                                           [checked]="getConfigValue('crm', subsection, field)"
                                                           (change)="toggleField('crm', subsection, field)">
                                                    <label class="form-check-label" [for]="'crm_' + subsection + '_' + field">
                                                        {{ getLabel('crm', subsection, field) }}
                                                    </label>
                                                </div>
                                                <input *ngIf="subsection !== 'basic'" class="form-control form-control-sm mt-1"
                                                       [(ngModel)]="config.crm[subsection].fields[field].label"
                                                       [placeholder]="'Label for ' + field">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Settings Section -->
<div *ngSwitchCase="'settings'">
  <div ngbAccordion [closeOthers]="true">
    <div ngbAccordionItem *ngFor="let subsection of getSettingsSubsections()" [id]="subsection">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton>
          <strong>{{ subsection | titlecase }}</strong>
        </button>
      </h2>
      <div ngbAccordionCollapse>
        <div class="card">
          <div class="card-body">
            <div class="row">
              <div class="col-md-6 mb-3" *ngFor="let field of getSettingsFieldKeys(subsection)">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" 
                         [id]="'settings_' + subsection + '_' + field"
                         [checked]="getConfigValue('settings', subsection, field)"
                         (change)="toggleField('settings', subsection, field)">
                  <label class="form-check-label" [for]="'settings_' + subsection + '_' + field">
                    {{ field | titlecase }}
                  </label>
                </div>
                <input *ngIf="subsection !== 'basic'" class="form-control form-control-sm mt-1"
                       [(ngModel)]="config.settings[subsection].fields[field].label"
                       [placeholder]="'Label for ' + field">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

                <!-- Accounts Section -->
                <div *ngSwitchCase="'accounts'">
                    <div ngbAccordion [closeOthers]="true">
                        <div ngbAccordionItem *ngFor="let subsection of getAccountsSubsections()" [id]="subsection">
                            <h2 ngbAccordionHeader>
                                <button ngbAccordionButton>
                                    <strong>{{ subsection | titlecase }}</strong>
                                </button>
                            </h2>
                            <div ngbAccordionCollapse>
                                <div class="card">
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-6 mb-3" *ngFor="let field of getAccountsFieldKeys(subsection)">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" 
                                                           [id]="'accounts_' + subsection + '_' + field"
                                                           [checked]="getConfigValue('accounts', subsection, field)"
                                                           (change)="toggleField('accounts', subsection, field)">
                                                    <label class="form-check-label" [for]="'accounts_' + subsection + '_' + field">
                                                        {{ getLabel('accounts', subsection, field) }}
                                                    </label>
                                                </div>
                                                <input *ngIf="subsection !== 'basic'" class="form-control form-control-sm mt-1"
                                                       [(ngModel)]="config.accounts[subsection].fields[field].label"
                                                       [placeholder]="'Label for ' + field">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </ng-container>

            <div class="d-flex justify-content-between align-items-center border-top pt-3 mt-5">
                <div class="d-flex align-items-center gap-2 pt-2">
                    <button type="button" 
                            class="btn btn-light-secondary btn-sm dofi-min-w-100 dofi-max-w-80"
                            [disabled]="isPreviousDisabled()"
                            (click)="goToPreviousSection()">
                        <i class="fas fa-chevron-left me-1"></i> Previous
                    </button>
                    <button type="button" 
                            class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                            [disabled]="isNextDisabled()"
                            (click)="goToNextSection()">
                        Next <i class="fas fa-chevron-right ms-1"></i>
                    </button>
                </div>
                <div class="text-end pt-2">
                    <button type="button" class="btn btn-info btn-sm" (click)="saveConfig()">
                        <i class="fas fa-save me-1"></i> Save
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
