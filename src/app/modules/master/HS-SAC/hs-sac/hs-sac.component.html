    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm">
            <div class="col-md-4 pb-2">
                <h4 class="page-title mb-0">HS and SAC</h4>
            </div>
            <div class="col-md-8 pb-2">
                <div class="" data-bs-theme="light">
                    <form
                        class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                        <!-- <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                            <i class="fas fa-search me-1"></i>
                            Search
                        </button> -->
                        <button class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" type="button" (click)="openModal(content)"> <i
                                class="fas fa-plus me-1"></i> Create </button>

                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                            <i class="fas fa-file-alt me-1"></i>
                            Report
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                            <i class="fas fa-sync-alt me-1"></i>
                            Reset
                        </button>
                    </form>
                </div>
            </div>
            <div class="col-md-12  border-top">
                <div class="row mx-0 py-2">
                    <div class="col-md-8 mx-auto px-0">
                        <form
                            class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0">

                                    <option value="ExportImport">Export/Import</option>
                                    <option value="FCLLCL">FCLLCL</option>
                                    <option value="status">Status</option>
                                </select>
                            </div>
                            <!-- <div class="form-outline col-12 col-md px-0">

                                    placeholder="Enter filter value">

                             <div class="d-flex d-md-flex gap-2 col-12 col-md px-0 align-items-center">
                <div class="form-outline flex-grow-1">

                    placeholder="Enter filter value">
                  <i class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                </div>

                <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" >

            </div>
        </div>
    </div>
    <ng-template #content let-modal>
        <div class="modal-header">
            <h4 class="modal-title">HS-SAC</h4>
            <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
        </div>
        <div class="modal-body">
            <form>
                <div class="col-md-12">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="row">
                                <aside class="col-md-6">
                                    <div class="custom-form-group">
                                        <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                            formControlName="HS/SACCode">
                                        <label for="text-input" class="input-label">HS/SAC Code <span
                                                class="text-danger">*</span></label>
                                    </div>
                                </aside>
                                <aside class="col-md-6">
                                    <div class="custom-form-group">
                                        <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                            formControlName="ServiceName">
                                        <label for="text-input" class="input-label">Service Name <span
                                                class="text-danger">*</span></label>
                                    </div>
                                </aside>
                                <aside class="col-md-6">
                                    <div class="custom-form-group">
                                        <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                            formControlName="TaxRate">
                                        <label for="text-input" class="input-label">Tax Rate <span
                                                class="text-danger">*</span></label>
                                    </div>
                                </aside>
                                <aside class="col-md-6">
                                <div class="custom-form-group custom-form-group-select">
                                    <ng-select formControlName="status" [items]="modeOfTaxType" bindLabel="name"
                                        bindValue="name">

                                    </ng-select>
                                    <label for="" class="input-label">Tax Type <span class="text-danger">*</span></label>
                                </div>
                            </aside>
                                <aside class="col-md-6">
                                    <div class="custom-form-group">
                                        <input type="date" id="text-input" placeholder="" class="custom-input-field sm"
                                            formControlName="TaxRate">
                                        <label for="text-input" class="input-label">Effective Form <span
                                                class="text-danger">*</span></label>
                                    </div>
                                </aside>
                                <aside class="col-md-6">
                                    <div class="custom-form-group">
                                        <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                            formControlName="Remarks">
                                        <label for="text-input" class="input-label">Remarks <span
                                                class="text-danger">*</span></label>
                                    </div>
                                </aside>

                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
        </div>
    </ng-template>

    <div class="row bg-white py-2 rounded shadow-sm mx-auto">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered">
                    <thead>
                        <tr class="bg-info">
                            <!-- <th class="bg-transparent text-light" scope="col">Action</th> -->
                            <th class="bg-transparent text-light" scope="col">HS/SAC Code</th>
                            <th class="bg-transparent text-light" scope="col">Service Name</th>
                            <th class="bg-transparent text-light" scope="col">Tax</th>
                            <th class="bg-transparent text-light" scope="col">Tax Type</th>
                            <th class="bg-transparent text-light" scope="col">Effective Form</th>
                            <th class="bg-transparent text-light" scope="col">Remarks</th>
                            <th class="bg-transparent text-light" scope="col">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (item of [0,1,2,3,4,5,6,7,8]; track $index) {

                        </td> -->

                            </td>
                            <td>

                            </td>
                            <td>
                                <div class="text-truncate">RO</div>
                            </td>
                            <td>
                                <div class="text-truncate">RO</div>
                            </td>
                            <td>
                                <div class="text-truncate">RO</div>
                            </td>
                            <td>
                                <div class="text-truncate">RO</div>
                            </td>
                            <td>
                                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Active
                                </div>
                            </td>

                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
