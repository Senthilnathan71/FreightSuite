<div class="container-fluid">
  <!-- Form -->
  <form [formGroup]="countryForm">
    <div class="row">
      <!-- Top buttons -->
      <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
          <div class="col-md-4 pb-2">
            <h4 class="page-title mb-0"> Country</h4>
          </div>
          <div class="col-md-8 pb-2">
            <div
              class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
              <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                (click)="goBack()">
                <i class="fas fa-chevron-left me-1"></i>
                Back
              </button>
              <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                (click)="resetForm()">
                <i class="fas fa-sync-alt me-1"></i>
                Reset
              </button>
              <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="onSubmit()"
                [disabled]="btnDisable || countryForm.invalid">
                <i class="fas fa-save me-1"></i>
                {{ isEditMode ? 'Update' : 'Create' }}
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Left card section -->
      <div class="col-md-12">
        <div class="card h-100">
          <div class="card-body">
            <div class="row">

              <!-- Country Name -->
              <aside class="col-md-12">
                <div class="custom-form-group">
                  <input type="text" id="countryName" formControlName="countryName" class="custom-input-field sm"
                    [class.is-invalid]="countryForm.get('countryName')?.invalid && countryForm.get('countryName')?.touched" />
                  <label for="countryName" class="input-label">Country Name <span class="text-danger">*</span></label>
                  <div *ngIf="countryForm.get('countryName')?.touched && countryForm.get('countryName')?.errors"
                    class="invalid-feedback d-block">
                    <span *ngIf="countryForm.get('countryName')?.hasError('required')">Country name is required</span>
                    <span *ngIf="countryForm.get('countryName')?.hasError('maxlength')">
                      Maximum 100 characters allowed
                    </span>
                  </div>
                </div>
              </aside>

              <aside class="col-md-6">  
  <div class="custom-form-group">
    <input type="text" id="countryCode" formControlName="countryCode" class="custom-input-field sm"
      [class.is-invalid]="countryForm.get('countryCode')?.invalid && countryForm.get('countryCode')?.touched"
      maxlength="2" />
    <label for="countryCode" class="input-label">Country Code <span class="text-danger">*</span></label>
    <div *ngIf="countryForm.get('countryCode')?.touched && countryForm.get('countryCode')?.errors"
      class="invalid-feedback">
      <span *ngIf="countryForm.get('countryCode')?.hasError('required')">Code is required</span>
      <span *ngIf="countryForm.get('countryCode')?.hasError('minlength') || 
                   countryForm.get('countryCode')?.hasError('maxlength')">
        Country code must be exactly 2 characters
      </span>
      <span *ngIf="countryForm.get('countryCode')?.hasError('invalidCountryCode')">
        Only alphabetic characters (A-Z) are allowed
      </span>
    </div>
  </div>
</aside>

              <!-- Zone -->
              <aside class="col-md-6">
                <div class="custom-form-group custom-form-group-select">
                  <ng-select [items]="zones" bindLabel="ZoneName" bindValue="ZoneMasterSid"
                    formControlName="ZoneMasterSid"
                    [class.is-invalid]="countryForm.get('ZoneMasterSid')?.invalid && countryForm.get('ZoneMasterSid')?.touched"
                    placeholder="Select Zone">
                  </ng-select>
                  <label class="input-label">Zone <span class="text-danger">*</span></label>
                  <div *ngIf="countryForm.get('ZoneMasterSid')?.invalid && countryForm.get('ZoneMasterSid')?.touched"
                    class="invalid-feedback">
                    Zone is required
                  </div>
                </div>
              </aside>

              <!-- Currency -->
              <!-- Currency Dropdown -->
<aside class="col-md-6">
  <div class="custom-form-group custom-form-group-select">
    <ng-select 
      [items]="currencies" 
      bindLabel="currencyName" 
      bindValue="CurrencyMasterSid"
      formControlName="CurrencyMasterSid"
      [class.is-invalid]="countryForm.get('CurrencyMasterSid')?.invalid && countryForm.get('CurrencyMasterSid')?.touched"
      placeholder="Select Currency">
      <ng-template ng-label-tmp let-item="item">
        {{ item.currencyName || item.CurrencyName }}
      </ng-template>
    </ng-select>
    <label class="input-label">Currency <span class="text-danger">*</span></label>
    <div *ngIf="countryForm.get('CurrencyMasterSid')?.invalid && countryForm.get('CurrencyMasterSid')?.touched"
      class="invalid-feedback">
      Currency is required
    </div>
  </div>
</aside>

              <!-- Status -->
              <aside class="col-md-6">
                <div *ngIf="!isEditMode" class="custom-form-group">
                  <input type="text" class="custom-input-field sm" value="Active" readonly>
                  <label class="input-label">Status <span class="text-danger">*</span></label>
                </div>

                <div *ngIf="isEditMode" class="custom-form-group custom-form-group-select">
                  <ng-select [items]="statusOptions" bindLabel="name" bindValue="id"
                    formControlName="status"></ng-select>
                  <label class="input-label">Status</label>
                </div>
              </aside>

            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
