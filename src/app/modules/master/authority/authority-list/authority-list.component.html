<!-- authority-list.component.html -->
<div class="row">
    <app-listpage
  [title]="'Authority'"
  [searchOptions]="[
    { value: 'departmentName', label: 'Department Name' },
    { value: 'ScreenMenuName', label: 'Screen/Menu Name' },
    { value: 'BranchName', label: 'Branch' },
    { value: 'status', label: 'Status' }
  ]"
  [searchPerformed]="searchPerformed"
  [defaultSearchType]="'status'"
  (onCreateClick)="navigateToCreateAuthority()"
  (onReportClick)="report()"
  (onResetClick)="resetPage()"
  (onSearchClick)="onSearch($event)">
    </app-listpage>
    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalLengthOfCollection > 0">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered">
                    <thead>
                        <tr class="bg-info">
                            <th class="bg-transparent text-light" scope="col" width="10%">Action</th>
                            <th class="bg-transparent text-light" scope="col">Department</th>
                            <th class="bg-transparent text-light" scope="col">Screen / Menu Name</th>
                            <th class="bg-transparent text-light" scope="col">Branch</th>
                            <th class="bg-transparent text-light" scope="col" width="10%">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of authorityList; let i = index; trackBy: trackByAuthorityId">
                            <td>
                                <div class="d-flex align-items-center justify-content-center">
                                    <a class="mx-2 ps-3" 
                                       [routerLink]="['/master/authority/entry', item.AuthorityMasterSid]" 
                                       title="Edit">
                                       <i-feather name="eye" class="feather-sm"></i-feather>
                                    </a>
                                    <a class="text-danger mx-2 ps-3 border-start" (click)="softDelete(item.AuthorityMasterSid)"
                                        title="Delete">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>
                            <td>
      <div class="text-truncate">{{ item.departmentName || '-' }}</div>
    </td>
                            <td>
  <div class="text-truncate">{{ item.menuMaster.MenuName || '-' }}</div>
</td>

                            <td>
      <div class="text-truncate">{{ item.branchName || '-' }}</div>
    </td>
                            <td>
                                @if(item.status === "A"){
                                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Active
                                </div>
                                } @else {
                                <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                    Suspended
                                </div>
                                }
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div>
                <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                    [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
                </ngb-pagination>
            </div>
        </div>
    </div>
    <div class="col-12" *ngIf="searchPerformed && totalLengthOfCollection === 0">
        <div>No records found</div>
    </div>
</div>
