<div class="row">
    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm justify-content-between">
            <div class="col pb-2">
                <h4 class="page-title mb-0">Authorization</h4>
            </div>

            <div class="col-md pb-2">
                <form class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0">
                    <div class="d-flex gap-2 col-12  px-0 align-items-stretch align-items-md-center">
                        <div class="form-outline flex-grow-1 position-relative">
                            <input name="filterValue" type="text" [(ngModel)]="filterValue" class="form-control pe-5"
                                placeholder="Search" aria-label="Search input">
                            <button *ngIf="filterValue"
                                class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-3 p-1 text-secondary"
                                tabindex="0" aria-label="Clear search" data-bs-toggle="tooltip" data-bs-placement="top"
                                data-bs-title="Clear search"
                                onfocus="this.classList.replace('text-secondary','text-danger')"
                                onblur="this.classList.replace('text-danger','text-secondary')"
                                (click)="clearFilterValue()">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="mt-md-0 mt-1">
                            <button type="submit" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                                (click)="searchAuthority()">
                                <i class="fas fa-search me-1"></i> Search
                            </button>
                        </div>

                    </div>
                </form>
            </div>

            <div class="col-md-auto pb-2">
                <form
                    class=" d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <app-favorite-star screenName="Authorization" class="mt-1 me-1"></app-favorite-star>
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                        (click)="navigateToCreateAuthority()">
                        <i class="fas fa-plus me-1"></i> Create
                    </button>

                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="report()"
                        [disabled]="!searchPerformed">
                        <i class="fas fa-file-alt me-1"></i> Report
                    </button>

                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="resetPage()"
                        [disabled]="!searchPerformed">
                        <i class="fas fa-sync-alt me-1"></i> Reset
                    </button>
                </form>
            </div>


        </div>
    </div>
    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalLengthOfCollection > 0">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered table-sm mb-1">
                    <thead>
                        <tr class="bg-info">
                            <th class="bg-transparent text-light" scope="col" width="10%">Action</th>
                            <th class="bg-transparent text-light" scope="col" (click)="sort('departmentName')">
                                Department
                                <i class="fas fa-sort ms-1" [ngClass]="{
                'fa-sort-up': sortDirection === 'asc' && sortColumn === 'departmentName', 
                'fa-sort-down': sortDirection === 'desc' && sortColumn === 'departmentName'
            }"></i>
                            </th>
                            <th class="bg-transparent text-light" scope="col" (click)="sort('MenuName')">
                                Screen / Menu Name
                                <i class="fas fa-sort ms-1" [ngClass]="{
                'fa-sort-up': sortDirection === 'asc' && sortColumn === 'MenuName', 
                'fa-sort-down': sortDirection === 'desc' && sortColumn === 'MenuName'
            }"></i>
                            </th>
                            <th class="bg-transparent text-light" scope="col" (click)="sort('branchName')">
                                Branch
                                <i class="fas fa-sort ms-1" [ngClass]="{
                'fa-sort-up': sortDirection === 'asc' && sortColumn === 'branchName', 
                'fa-sort-down': sortDirection === 'desc' && sortColumn === 'branchName'
            }"></i>
                            </th>
                            <th class="bg-transparent text-light" scope="col" width="10%">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of authorityList; let i = index; trackBy: trackByAuthorityId">
                            <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                <div class="d-flex align-items-center justify-content-center">
                                    <a class="mx-2 ps-3"
                                        [routerLink]="['/master/authorization/entry', item.AuthorityMasterSid]"
                                        title="Edit">
                                        <i-feather name="eye" class="feather-sm"></i-feather>
                                    </a>
                                    <a class="text-danger mx-2 ps-3 border-start"
                                        (click)="softDelete(item.AuthorityMasterSid)" title="Delete">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>
                            <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                <div class="text-truncate">{{ item.DepartmentMaster || '-' }}</div>
                            </td>
                            <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                <div class="text-truncate">{{ item.menuName || '-' }}</div>
                            </td>

                            <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                <div class="text-truncate">{{ item.branchName || '-' }}</div>
                            </td>
                            <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                @if(item.status === "Active"){
                                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Active
                                </div>
                                } @else {
                                <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                    Suspended
                                </div>
                                }
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div>
                <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                    [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginationData()" [maxSize]="10"
                    [rotate]="true" [ellipses]="false">
                </ngb-pagination>
            </div>
        </div>
    </div>
    <div class="col-12" *ngIf="totalLengthOfCollection === 0">
        <div class="alert alert-info text-center">No records found</div>
    </div>
</div>
