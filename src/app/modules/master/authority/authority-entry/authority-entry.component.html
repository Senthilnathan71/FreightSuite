<form [formGroup]="Authorityform">

    <div class="row py-3">
        <div class="col-12">
            <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
                <div class="col-md-4 pb-2">
                    <h4 class="page-title mb-0">Authority</h4>
                </div>
                <div class="col-md-8 pb-2">
                    <div
                        class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                        <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                            (click)="navigateBack()">
                            <i class="fas fa-chevron-left me-1"></i>
                            Back
                        </button>
                        <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
                            <i class="fas fa-sync-alt me-1"></i>
                            Reset
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                            <i class="fas fa-save me-1" (click)="onSubmit()"></i>
                            Save
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-12">
            <ng-container *ngTemplateOutlet="AuthorityForm"></ng-container>
        </div>



        <ng-template #AuthorityForm>
            <div class="card h-100">
                <div class="card-body">
                    <div class="row">

                        <aside class="col-md-4">
                            <div class="custom-form-group custom-form-group-select">
                                <ng-select formControlName="menuname" [items]="modeOfMenu" bindLabel="name"
                                    bindValue="name"></ng-select>
                                <label class="input-label">Menu / Screen Name <span class="text-danger">*</span></label>
                                <div class="error-message"
                                    *ngIf="Authorityform.get('menuname')?.touched && Authorityform.get('menuname')?.hasError('required')">
                                    <span>Menu name is required</span>
                                </div>
                            </div>
                        </aside>


                        <aside class="col-md-4">
                            <div class="custom-form-group custom-form-group-select">
                                <ng-select formControlName="location" [items]="modeOfLocation" bindLabel="name"
                                    bindValue="name" ></ng-select>
                                <label class="input-label">Location <span class="text-danger">*</span></label>
                                <div class="error-message"
                                    *ngIf="Authorityform.get('location')?.touched && Authorityform.get('location')?.hasError('required')">
                                    <span>Location is required</span>
                                </div>
                            </div>
                        </aside>
                        <aside class="col-md-4">
                            <div class="custom-form-group custom-form-group-select">
                                <ng-select formControlName="selectedDepartments" [items]="modeOfDept" bindLabel="name"
                                    bindValue="name" [multiple]="true" placeholder="Select Departments"
                                   ></ng-select>
                                <label class="input-label">Dept <span class="text-danger">*</span></label>
                                <div class="error-message"
                                    *ngIf="Authorityform.get('selectedDepartments')?.touched && Authorityform.get('selectedDepartments')?.hasError('required')">
                                    <span>Department is required</span>
                                </div>
                            </div>
                        </aside>


                    </div>
                </div>
            </div>
        </ng-template>
        <div class="row ms-1 my-2">
            <div class="col-12  bg-white py-2 rounded shadow-sm mx-auto">
                <div class="table-responsive">
                    <table class="table table-hover align-middle no-wrap table-bordered">
                        <thead>
                            <tr class="bg-info">
                                <th class="bg-transparent text-light" scope="col">Approval Level</th>
                                <th class="bg-transparent text-light" scope="col">Authorizer</th>
                                <th class="bg-transparent text-light" scope="col">Final Level</th>
                                <th class="bg-transparent text-light" scope="col" width="10%">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for (item of [0,1,2]; track $index) {
                            <tr>
                                <!-- <td>
                            <div class="d-flex align-items-center justify-content-center">
                                <a class="text-info mx-2"
                                   >
                                    <i-feather class="feather-sm" name="eye"></i-feather>
                                </a>
                                <a class="text-danger mx-2 ps-3 border-start">
                                    <i-feather name="trash-2" class="feather-sm"></i-feather>
                                </a>
                            </div>
                        </td> -->
                                <td>
                                    <div class="text-truncate">1</div>
                                </td>
                                <td>
                                    <div class="text-truncate">RO</div>
                                </td>
                                <td>
                                    <div class="text-truncate">RO</div>
                                </td>

                                <td>
                                    <div
                                        class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center  gap-1">
                                        <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                        Active
                                    </div>
                                </td>

                            </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</form>
