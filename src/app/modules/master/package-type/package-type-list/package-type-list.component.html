  <div class="col-12">
    <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm">
      <div class="col-md-4 pb-2">
        <h4 class="page-title mb-0">Package Type</h4>
      </div>
      <div class="col-md-8 pb-2">
        <div class="" data-bs-theme="light">
          <form
            class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
            <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
              <i class="fas fa-search me-1"></i>
              Search
            </button>
            <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="navigateToEntry()">
              <i class="fas fa-plus me-1"></i> Create
            </button>
            <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
              <i class="fas fa-file-alt me-1"></i>
              Report
            </button>
            <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
              <i class="fas fa-sync-alt me-1"></i>
              Reset
            </button>
          </form>
        </div>
      </div>
      <div class="col-md-12  border-top">
        <div class="row mx-0 py-2">
          <div class="col-md-8 mx-auto px-0">
            <form class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0">
              <div class="form-outline col-12 col-md px-0">
                <input type="search" class="form-control ps-5" [(ngModel)]="filterType" name="search" autocomplete="off"
                  placeholder="Search">
                <i class="fas fa-search ms-3"></i>
              </div>
              <div class="form-outline col-12 col-md px-0">
                <input name="filterValue" type="text" class="form-control" [(ngModel)]="filterText" (input)="onSearch()"
                  placeholder="Enter filter value">
                <i class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  <div class="row bg-white py-2 rounded shadow-sm mx-auto">
     <div class="col-12 p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle no-wrap table-bordered">
        <thead>
          <tr class="bg-info">
            <th class="bg-transparent text-light" scope="col">Name</th>
            <th class="bg-transparent text-light" scope="col">Code</th>
            <!-- <th class="bg-transparent text-light" scope="col">Remarks</th> -->
            <th class="bg-transparent text-light" scope="col">Status</th>
            <th class="bg-transparent text-light" scope="col">Action</th>
          </tr>
        </thead>
        <tbody>
          @for (package of filteredPackageTypes; track
          package.PackageTypeMasterSid) {
          <tr>
            <td>
              <div class="text-truncate">{{ package.PackageName }}</div>
            </td>
            <td>
              <div class="text-truncate">{{ package.PackageCode }}</div>
            </td>
            <td>
              <div class="text-truncate">{{ package.status }}</div>
            </td>
            <!-- <td>
              <div class="text-truncate">Rial</div>
            </td> -->
            <td>
              <a class="text-dark mx-2" [routerLink]="[
                  '/master/package-type/entry',
                  package.PackageTypeMasterSid
                ]">
                <i-feather name="edit-3" class="feather-sm"></i-feather>
              </a>
              <a class="text-danger mx-2 ps-3 border-start"
                (click)="deletePackageTypeById(package.PackageTypeMasterSid)">
                <i-feather name="trash-2" class="feather-sm"></i-feather>
              </a>
            </td>
          </tr>
          } @empty {
          <tr>
            No records found
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
  </div>
 
</div>
