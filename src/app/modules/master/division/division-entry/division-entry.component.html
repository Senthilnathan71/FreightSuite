  <div class="col-12">
    <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
      <div class="col-md-4 pb-2">
        <h4 class="page-title mb-0">Add Division</h4>
      </div>
      <div class="col-md-8 pb-2">
        <div
          class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
          <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" (click)="goBack()">
            <i class="fas fa-chevron-left me-1"></i>
            Back
          </button>
          <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" (click)="reset()">
            <i class="fas fa-sync-alt me-1"></i>
            Reset
          </button>
          <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="onSubmit()"
            [disabled]=" btnDisable">
            <i class="fas fa-save me-1"></i>
            Save
          </button>
        </div>
      </div>
    </div>
  </div>

  <form [formGroup]="divisionForm">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <div class="row">
            <aside class="col-md-4">
              <div class="custom-form-group">
                <input type="text" id="text-input" formControlName="divisionName" placeholder=""
                  class="custom-input-field sm">
                <label for="text-input" class="input-label">Division Name <span
                    class="text-danger fw-bold">*</span></label>
              </div>
            </aside>
            <aside class="col-md-4">
              <div class="custom-form-group">
                <input type="text" formControlName="divisionCode" id="text-input" placeholder=""
                  class="custom-input-field sm">
                <label for="text-input" class="input-label">Division Code <span
                    class="text-danger fw-bold">*</span></label>
              </div>
            </aside>
            <aside class="col-md-4">
              <div class="custom-form-group">
                <input type="textarea" formControlName="Address" id="text-input" placeholder=""
                  class="custom-input-field sm">
                <label for="text-input" class="input-label">Address <span class="text-danger fw-bold">*</span></label>
              </div>
            </aside>
            <aside class="col-md-4">
              <div class="custom-form-group">
                <input type="textarea" formControlName="Remarks" id="text-input" placeholder=""
                  class="custom-input-field sm">
                <label for="text-input" class="input-label">Remarks <span class="text-danger fw-bold">*</span></label>
              </div>
            </aside>
            <aside class="col-md-4">
              <div class="custom-form-group">
                <select formControlName="Status" class="form-select">
                  <option value="">Status</option>
                  <option *ngFor="let option of statusList" [value]="option">{{ option }}</option>
                </select>
                <label for="text-input" class="input-label">Status <span class="text-danger fw-bold">*</span></label>
              </div>
            </aside>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
