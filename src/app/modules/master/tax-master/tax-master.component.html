
<ngx-spinner bdColor="rgba(0,0,0,0.8)" size="medium" color="#fff" type="ball-scale-ripple" [fullScreen]="true">
  <p style="color: white;" class="m-0">Loading...</p>
</ngx-spinner>

<div class="row compact-form">
  <div class="col-12">
    <app-page-header [title]="'Tax Master'" [showFavorite]="true" [showSearch]="true" [searchPlaceholder]="'Search'"
      [searchButtonText]="'Search'" [(searchValue)]="filterValue" [actions]="headerActions"
      (searchTriggered)="onSearchTriggered($event)" (searchCleared)="onSearchCleared()"
      (actionTriggered)="onActionTriggered($event)">
    </app-page-header>
    
  </div>

  <!-- Reusable Table Component -->
  <div class="col-12">
    <app-reusable-table #taxGroupTable [config]="tableConfig" [data]="allTaxGroup" [loading]="tableLoading"
      [totalRecords]="totalLengthOfCollection" [paginationConfig]="paginationConfig"
      (actionClick)="onTableActionClick($event)" (rowClick)="onTableRowClick($event)"
      (sortChange)="onTableSortChange($event)" (filterChange)="onTableFilterChange($event)"
      (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-reusable-table>
  </div>




  
  <ng-template #content let-modal>
    <div class="modal-header p-2 bg-info">
      <h4 class="modal-title text-white">
        {{ isEditMode ? 'Edit' : 'Add' }} Tax Master
      </h4>
      
      <a *ngIf="isEditMode" class="text-white ps-2 cursor-pointer" (click)="showInfo()">
        <i class="fas fa-info-circle fs-6"></i>
      </a>

      <div class="ms-auto d-flex align-items-center">
        <div *ngIf="hasAnyDropdownPermission() && isEditMode" ngbDropdown class="d-inline-block me-2">
          <button type="button" class="btn btn-light-secondary btn-sm has-arrow" id="dropdownBasic1" ngbDropdownToggle>
            <i class="fas fa-ellipsis-v"></i>
          </button>
          <button  class="text-dark" ngbDropdownItem appPreventMultiClick
            (click)="openEDoc()"><i class="fas fa-file-alt me-1"></i> Edoc</button>
          <!-- <button  class="text-dark" ngbDropdownItem appPreventMultiClick
            (click)="openTandC()"><i class="fas fa-clipboard me-1"></i> Terms & Condition</button> -->
          <button class="text-dark" ngbDropdownItem appPreventMultiClick
            (click)="openAuthority()"><i class="fas fa-shield-alt me-1"></i> Authorize</button>
          <button  class="text-dark" ngbDropdownItem appPreventMultiClick
            (click)="openEmail()"><i class="fas fa-envelope me-1"></i> Email</button>
        </div>

        <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="modal.dismiss()"></button>
      </div>
    </div>
    <div class="modal-body">
      <form [formGroup]="taxGroupForm">
        <div class="row compact-form">
           <aside class="col-md-6">
          <div class="custom-form-group custom-form-group-select"
            [class.filled]="!!taxGroupForm.get('TaxGroupSid')?.value">
            <!-- <ng-select 
              formControlName="TaxGroupSid" 
              [items]="taxGroupResults" 
              bindLabel="TaxGroupName" 
              bindValue="TaxGroupSid"
              placeholder="Select Tax Group">
            </ng-select> -->
            <dofi-searchable-dropdown  [items]="taxGroupResults" formControlName="TaxGroupSid" [placeholder]="''"
                                            [displayFields]=" ['TaxGroup', 'TaxRate']" [displayLabels]="['TaxGroup', 'TaxRate']"
                                            [labelFields]="['TaxGroup', 'TaxRate']" [bindValue]="'TaxGroupSid'"  appendTo="body"></dofi-searchable-dropdown>
                                        
            <label class="input-label">Tax Group <span class="text-danger">*</span></label>
            <div class="error-message"
              *ngIf="taxGroupForm.get('TaxGroupSid')?.touched && taxGroupForm.get('TaxGroupSid')?.invalid">
              <span>Required</span>
            </div>
          </div>
        </aside>
          <!-- Tax Name -->
        <aside class="col-md-6">
          <div class="custom-form-group">
            <input type="text" formControlName="TaxName" class="custom-input-field sm" placeholder="" />
            <label class="input-label">Tax Name <span class="text-danger">*</span></label>
            <div class="error-message"
              *ngIf="taxGroupForm.get('TaxName')?.touched && taxGroupForm.get('TaxName')?.invalid">
              <span>Required</span>
            </div>
          </div>
        </aside>

           <!-- Tax Code -->
        <aside class="col-md-6">
          <div class="custom-form-group custom-form-group-select"
            [class.filled]="!!taxGroupForm.get('TaxCode')?.value">
            <ng-select 
      formControlName="TaxCode" 
      [items]="taxCodeOptions" 
      bindLabel="name"
      bindValue="name"
      placeholder="">
    </ng-select>
            <label class="input-label">Tax Code <span class="text-danger">*</span></label>
            <div class="error-message"
              *ngIf="taxGroupForm.get('TaxCode')?.touched && taxGroupForm.get('TaxCode')?.invalid">
              <span>Required</span>
            </div>
          </div>
        </aside>

           <!-- Tax Type Dropdown -->
        <aside class="col-md-6">
          <div class="custom-form-group custom-form-group-select"
            [class.filled]="!!taxGroupForm.get('TaxType')?.value">
            <ng-select 
              formControlName="TaxType" 
              [items]="modeofTaxType" 
              bindLabel="name"
              bindValue="name"
              placeholder="">
            </ng-select>
            <label class="input-label">Tax Type <span class="text-danger">*</span></label>
            <div class="error-message"
              *ngIf="taxGroupForm.get('TaxType')?.touched && taxGroupForm.get('TaxType')?.invalid">
              <span>Required</span>
            </div>
          </div>
        </aside>

          
           <!-- Effective Date -->
        <aside class="col-md-6">
          <div class="custom-form-group custom-form-group-select-date">
            <div class="input-group">
              <input class="form-control mb-0" placeholder="dd-mm-yyyy" name="dp" ngbDatepicker
                #effectiveDate="ngbDatepicker" (click)="effectiveDate.toggle()" formControlName="EffectiveFrom"
                [minDate]="minDate" readonly />

              <button class="btn bi bi-calendar3" (click)="effectiveDate.toggle()" type="button">
                <i-feather name="calendar" class="feather-sm"></i-feather>
              </button>
            </div>

            <label class="input-label">Effective From <span class="text-danger fw-bold">*</span></label>
            <div class="error-message pe-4 pb-2"
              *ngIf="taxGroupForm.get('EffectiveFrom')?.touched && taxGroupForm.get('EffectiveFrom')?.invalid">
              <span>Required</span>
            </div>
          </div>
        </aside>


          <!-- Tax Category Dropdown -->
        <aside class="col-md-6">
          <div class="custom-form-group custom-form-group-select"
            [class.filled]="!!taxGroupForm.get('TaxCategory')?.value">
            <ng-select 
              formControlName="TaxCategory" 
              [items]="taxCategoryOptions" 
              bindLabel="name"
              bindValue="name"
              placeholder="">
            </ng-select>
            <label class="input-label">Tax Category <span class="text-danger">*</span></label>
            <div class="error-message"
              *ngIf="taxGroupForm.get('TaxCategory')?.touched && taxGroupForm.get('TaxCategory')?.invalid">
              <span>Required</span>
            </div>
          </div>
        </aside>


           <!-- Tax Rate -->
        <aside class="col-md-6">
          <div class="custom-form-group">
            <input type="number" formControlName="TaxRate" class="custom-input-field sm" placeholder="" 
                   min="0" step="0.01" />
            <label class="input-label">Tax Rate <span class="text-danger">*</span></label>
            <div class="error-message"
              *ngIf="taxGroupForm.get('TaxRate')?.touched && taxGroupForm.get('TaxRate')?.invalid">
              <span>Required and must be a positive number</span>
            </div>
          </div>
        </aside>

         
        <!-- Is Exempt -->
        <aside class="col-md-4 d-flex align-items-center">
          <div class="form-check form-check-inline p-0">
            <div class="form-check d-flex align-items-center">
              <input type="checkbox" formControlName="TaxExempt" id="TaxExempt" class="form-check-input sm" />
              <label for="TaxExempt" class="form-check-label sm">Is Exempt</label>
            </div>
          </div>
        </aside>

          
           <!-- Country Dropdown -->
        <aside class="col-md-6">
          <div class="custom-form-group custom-form-group-select" [class.filled]="!!taxGroupForm.get('CountryMasterSid')?.value">
            <dofi-searchable-dropdown 
              [items]="countryResults" 
              formControlName="CountryMasterSid" 
              placeholder=""
              [displayFields]="countryLookupConfig.displayFields" 
              [displayLabels]="countryLookupConfig.displayLabels"
              [labelFields]="countryLookupConfig.labelFields" 
              bindLabel="countryName" 
              bindValue="CountryMasterSid">
            </dofi-searchable-dropdown>
            <label for="text-input" class="input-label">
              Country <span class="text-danger">*</span>
            </label>
            <div class="error-message"
              *ngIf="taxGroupForm.get('CountryMasterSid')?.touched && taxGroupForm.get('CountryMasterSid')?.invalid">
              <span>Required</span>
            </div>
          </div>
        </aside>

        <!-- Invoice Type -->
        <aside class="col-md-6">
          <div class="custom-form-group custom-form-group-select"
               [class.filled]="!!taxGroupForm.get('InvoiceType')?.value">
            <ng-select
              formControlName="InvoiceType"
              [items]="invoiceTypeOptions"
              bindValue="id"
              bindLabel="name"
              [clearable]="true"
              appendTo="body"
              placeholder="">
            </ng-select>
            <label class="input-label">Invoice Type</label>
          </div>
        </aside>
        </div>
          </form>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-secondary btn-sm" (click)="modal.dismiss()">Cancel</button>
    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" (click)="resetForm()">
      <i class="fas fa-sync-alt me-1"></i>
      Reset
    </button>
    <button type="button" class="btn btn-info btn-sm" (click)="onSubmit()" [disabled]="taxGroupForm.invalid">
      Save
    </button>
  </div>
</ng-template>


</div>
