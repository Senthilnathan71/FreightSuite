<div class="row">
    <div class="col-12">
        <div class="rounded-3 p-2 bg-body-tertiary shadow mb-2">
            <div class="col-8 mx-auto">
                <div class="rounded-3 p-2 bg-body-tertiary mb-2" data-bs-theme="light">
                    <form class="d-flex align-items-center gap-2">
                        <div class="form-outline col">
                            <select [(ngModel)]="searchType" name="searchType" class="form-select">
                                <option value="PortName">Port Name</option>
                                <option value="PortCode">Port Code</option>
                                <option value="PortType">Port Type</option>
                                <option value="TerminalCode">Terminal Code</option>
                                <option value="countryName">Country Name</option>
                                <option value="sectorName">Sector Name</option>
                                <option value="status">Status</option>
                            </select>
                        </div>
                        <div class="form-outline col">
                            <input [(ngModel)]="filterValue" name="filterValue" type="text" class="form-control"
                                placeholder="Enter filter value">
                            <i class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                        </div>

                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80" (click)="search()">
                            <i class="fas fa-search"></i> Search
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80" (click)="navigateToCreatePort()">
                            <i class="mdi mdi-plus"></i> Create
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80" (click)="resetPage()">
                            Reset
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="col-12" *ngIf="totalLengthOfCollection > 0">
    <div class="table-responsive">
        <table class="table table-hover align-middle no-wrap table-bordered">
            <thead>
                <tr class="bg-info">
                    <th class="bg-transparent text-light" scope="col">Port Name</th>
                    <th class="bg-transparent text-light" scope="col">Port Code</th>
                    <th class="bg-transparent text-light" scope="col">Country</th>
                    <th class="bg-transparent text-light" scope="col">Sector</th>
                    <th class="bg-transparent text-light" scope="col">Port Type</th>
                    <th class="bg-transparent text-light" scope="col">Terminal</th>
                    <th class="bg-transparent text-light" scope="col">Status</th>
                    <th class="bg-transparent text-light" scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of portList; let i = index; trackBy: trackByIndex">
                    <td>
                        <div class="text-truncate">{{item.PortName}}</div>
                    </td>
                    <td>
                        <div class="text-truncate">{{item.PortCode}}</div>
                    </td>
                    <td>
                        <div class="text-truncate">{{item.countryMaster?.countryName || ''}}</div>
                    </td>
                    <td>
                        <div class="text-truncate">{{item.sectorMaster?.sectorName || ''}}</div>
                    </td>
                    <td>
                        <div class="text-truncate">{{item.PortType}}</div>
                    </td>
                    <td>
                        <div class="text-truncate">{{item.TerminalCode}}</div>
                    </td>
                    <td>
                        <div class="text-truncate">{{getStatusText(item.status)}}</div>
                    </td>
                    <td>
                        <div class="d-flex align-items-center">
                            <a class="text-info mx-2" [routerLink]="['/master/port-master/view/', item.PortMasterSid]">
                                <i-feather class="feather-sm" name="eye"></i-feather>
                            </a>
                            <a class="text-danger mx-2 ps-3 border-start" (click)="deletePort(item.PortMasterSid)">
                                <i-feather name="trash-2" class="feather-sm"></i-feather>
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div>
        <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
            [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
        </ngb-pagination>
    </div>
</div>

<!-- No records found -->
<div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed">
    <div>No records found</div>
</div>
