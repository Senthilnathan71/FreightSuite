<div class="row">
    <app-listpage [title]="'User'" [searchOptions]="[
        { value: 'userName', label: 'User Name' },
        { value: 'userEmail', label: 'Email' },
        { value: 'isSalesperson', label: 'Is Salesman' },
        { value: 'status', label: 'Status' }
      ]" [searchPerformed]="searchPerformed" [defaultSearchType]="'userName'"
        (onCreateClick)="nagivateTocreateUser()" (onReportClick)="report()" (onResetClick)="reset()"
        (onSearchClick)="search($event)">
    </app-listpage>

    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalNumberOfCollection > 0">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered">
                    <thead>
                        <tr class="bg-info">
                            <th class="bg-transparent text-light" scope="col" width="10%">Action</th>
                            <!-- <th class="bg-transparent text-light" scope="col">User Name</th>
                            <th class="bg-transparent text-light" scope="col">Email</th>
                            <th class="bg-transparent text-light" scope="col">Is Salesman</th> -->
                            <th class="bg-transparent text-light" scope="col" (click)="sort('userName')">
                            User Name
                            <i class="fas fa-sort ms-1"
                                [ngClass]="{
                                'fa-sort-up': sortColumn === 'userName' && sortDirection === 'asc',
                                'fa-sort-down': sortColumn === 'userName' && sortDirection === 'desc'
                                }">
                            </i>
                            </th>

                            <th class="bg-transparent text-light" scope="col" (click)="sort('email')">
                            Email
                            <i class="fas fa-sort ms-1"
                                [ngClass]="{
                                'fa-sort-up': sortColumn === 'email' && sortDirection === 'asc',
                                'fa-sort-down': sortColumn === 'email' && sortDirection === 'desc'
                                }">
                            </i>
                            </th>

                            <th class="bg-transparent text-light" scope="col" (click)="sort('isSalesman')">
                            Is Salesman
                            <i class="fas fa-sort ms-1"
                                [ngClass]="{
                                'fa-sort-up': sortColumn === 'isSalesman' && sortDirection === 'asc',
                                'fa-sort-down': sortColumn === 'isSalesman' && sortDirection === 'desc'
                                }">
                            </i>
                            </th>


                            <th class="bg-transparent text-light" scope="col" width="10%">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (user of userList; track user) {
                        <tr>
                            <td>
                                <div class="d-flex align-items-center justify-content-center">
                                    <a class="text-info mx-2" [routerLink]="['/master/user/entry/',user.UserMasterSid]">
                                        <i-feather name="eye" class="feather-sm"></i-feather>
                                    </a>
                                    <a class="link mx-2 ps-3 border-start text-danger"
                                        (click)="deleteUser(user.UserMasterSid)">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>
                            <td>
                                <div class="text-truncate">{{user.userName}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{user.userEmail}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{user.isSalesperson === '1' ? 'Yes' : 'No'}}</div>
                            </td>

                            <td>
                                @if(user.status === "A"){
                                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Active
                                </div>
                                } @else {
                                <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                    Suspended
                                </div>
                                }
                            </td>

                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
        <div>
            <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalNumberOfCollection"
                [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginationData()" [rotate]="true"
                [ellipses]="false" [maxSize]="5">
            </ngb-pagination>
        </div>
    </div>
    <div class="col-12" *ngIf="totalNumberOfCollection === 0">
        <div>No records found</div>
    </div>
</div>
