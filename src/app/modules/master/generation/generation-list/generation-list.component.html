<div class="row">
    <app-listpage
      [title]="'HAWB Stock'"
      [searchOptions]="[
        { value: 'AirwayBillNumber', label: 'AWB Number' },
        { value: 'HAWBSerial', label: 'Serial No' },
        { value: 'Agent', label: 'Agent' },
        { value: 'StockStatus', label: 'Stock Status' }
      ]"
      [searchPerformed]="searchPerformed"
      [defaultSearchType]="'AirwayBillNumber'"
      (onCreateClick)="navigateToCreateGeneration()"
      (onResetClick)="resetPage()"
      (onSearchClick)="onSearch($event)">
    </app-listpage>

    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalLengthOfCollection > 0">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered">
                    <thead>
                        <tr class="bg-info">
                            <th class="bg-transparent text-light" scope="col" width="10%">Action</th>
                            <th class="bg-transparent text-light" scope="col">Received From</th>
                            <th class="bg-transparent text-light" scope="col">Serial No</th>
                            <th class="bg-transparent text-light" scope="col">No of AWB</th>
                            <th class="bg-transparent text-light" scope="col">Received Date</th>
                            
                            <th class="bg-transparent text-light" scope="col" width="10%">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of hawbList; let i = index; trackBy: trackByIndex">
                            <td>
                                <div class="d-flex align-items-center">
                                    <a class="text-info mx-2" [routerLink]="['/master/generation/entry/', item.HawbStockSid]">
                                        <i-feather class="feather-sm text-info" name="eye"></i-feather>
                                    </a>
                                    <a class="text-danger mx-2 ps-3 border-start" (click)="deleteHawbStock(item.HawbStockSid)">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>
                            <td>{{item.AirwayBillType}}</td>
                            <td>{{item.HAWBSerial}}</td>
                            <td>{{item.NumberofHAWB}}</td>
                            <td>{{item.ReceivedDate | formatDate}}</td>
                            <td>
                                @if(item.status === "A"){
                                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Active
                                </div>
                                } @else {
                                <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                    Inactive
                                </div>
                                }
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div>
                <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                    [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
                </ngb-pagination>
            </div>
        </div>
    </div>

    <!-- No records found -->
    <div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed">
        <div>No records found</div>
    </div>
</div>
