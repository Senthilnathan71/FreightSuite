<div class="d-flex justify-content-end mb-2">
  <i
    [ngClass]="isFavorite ? 'fas fa-star fs-5 text-danger' : 'far fa-star fs-5 text-secondary'"
    (click)="toggleFavorite()"
    data-toggle="tooltip"
    data-placement="bottom"
    title="Favorites"
    style="cursor: pointer;">
  </i>
</div>
<div class="row">
    <app-listpage
      [title]="'HAWB Stock'"
      [searchOptions]="[
        { value: 'AirwayBillType', label: 'Received From' },
        { value: 'HAWBSerial', label: 'Serial No' },
        { value: 'NumberofHAWB', label: 'No of AWB' },
        { value: 'ReceivedDate', label: 'Received Date' }
      ]"
      [searchPerformed]="searchPerformed"
      [defaultSearchType]="'AirwayBillType'"
      (onCreateClick)="navigateToCreateGeneration()"
      (onReportClick)="report()"
      (onResetClick)="resetPage()"
      (onSearchClick)="onSearch($event)">
    </app-listpage>

    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalLengthOfCollection > 0">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered">
                    <thead>
  <tr class="bg-info">
    <th class="bg-transparent text-light" scope="col" width="10%">Action</th>
    <th class="bg-transparent text-light" scope="col" (click)="sort('AirwayBillType')">
      Received From
      <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'AirwayBillType', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'AirwayBillType'}"></i>
    </th>
    <th class="bg-transparent text-light" scope="col" (click)="sort('HAWBSerial')">
      Serial No
      <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'HAWBSerial', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'HAWBSerial'}"></i>
    </th>
    <th class="bg-transparent text-light" scope="col" (click)="sort('NumberofHAWB')">
      No of AWB
      <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'NumberofHAWB', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'NumberofHAWB'}"></i>
    </th>
    <th class="bg-transparent text-light" scope="col" (click)="sort('ReceivedDate')">
      Received Date
      <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'ReceivedDate', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'ReceivedDate'}"></i>
    </th>
    <th class="bg-transparent text-light" scope="col">Status</th>
  </tr>
</thead>
                    <tbody>
                        <tr *ngFor="let item of hawbList; let i = index; trackBy: trackByIndex">
                            <td>
                                <div class="d-flex align-items-center">
                                    <a class="text-info mx-2" [routerLink]="['/master/generation/entry/', item.HawbStockSid]">
                                        <i-feather class="feather-sm text-info" name="eye"></i-feather>
                                    </a>
                                    <a class="text-danger mx-2 ps-3 border-start" (click)="deleteHawbStock(item.HawbStockSid)">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>
                            <td>{{item.AirwayBillType}}</td>
                            <td>{{item.HAWBSerial}}</td>
                            <td>{{item.NumberofHAWB}}</td>
                            <td>{{item.ReceivedDate | formatDate}}</td>
                            <td>
                                @if(item.status === "A"){
                                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Active
                                </div>
                                } @else {
                                <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                    Inactive
                                </div>
                                }
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div>
                <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                    [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
                </ngb-pagination>
            </div>
        </div>
    </div>

    <!-- No records found -->
    <div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed">
        <div>No records found</div>
    </div>
</div>
