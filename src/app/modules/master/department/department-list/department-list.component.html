<div class="row">
    <div class="col-12">
        <div class="rounded-3 p-2 bg-body-tertiary shadow mb-2">
            <div class="col-8 mx-auto">
                <div class="rounded-3 p-2 bg-body-tertiary  mb-2" data-bs-theme="light">
                    <form class="d-flex align-items-center gap-2">
                        <div class="form-outline col">
                            <select [(ngModel)]="searchType" name="searchType" class="form-select">
                                <option value="departmentName">Department Name</option>
                                <option value="departmentCode">Department Code</option>
                                <option value="departmentType">Department Type</option>
                                <option value="ExportImport">Export/Import</option>
                                <option value="FCLLCL">FCLLCL</option>
                                <option value="Status">Status</option>
                            </select>
                        </div>
                        <div class="form-outline col">
                            <input [(ngModel)]="filterValue" name="filterValue" type="text" class="form-control"
                                placeholder="Enter filter value">
                            <i
                                class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                        </div>

                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80" (click)="search()">
                            <i class="fas fa-search"></i>
                            Search
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80"
                            (click)="navigateToCreateDepartment()">
                            <i class="mdi mdi-plus"></i> Create
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80" (click)="report()">
                            <!-- <i class="mdi mdi-plus"></i> -->
                            Report
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80" (click)="resetPage()">
                            <!-- <i class="mdi mdi-plus"></i> -->
                            Reset
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12" *ngIf="totalLengthOfCollection > 0">
        <div class="table-responsive">
            <table class="table table-hover align-middle no-wrap table-bordered">
                <thead>
                    <tr class="bg-info">
                        <th class="bg-transparent text-light" scope="col">Action</th>
                        <th class="bg-transparent text-light" scope="col">Dept Code</th>
                        <th class="bg-transparent text-light" scope="col">Dept Name</th>
                        <th class="bg-transparent text-light" scope="col">Dept Type</th>
                        <th class="bg-transparent text-light" scope="col">Exp/Imp</th>
                        <th class="bg-transparent text-light" scope="col">FCL/LCL</th>
                        <th class="bg-transparent text-light" scope="col">Status</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of departmentList; let i = index; trackBy: trackByIndex">
                        <td>
                            <div class="d-flex align-items-center">
                                <a class="text-info mx-2" class="link mx-2 ps-3 "
                                    [routerLink]="['/master/department/entry/', item.DepartmentMasterSid]">
                                    <i-feather class="feather-sm" name="eye"></i-feather>
                                </a>
                                <a class="text-danger mx-2 ps-3 border-start"
                                    (click)="deleteDepartment(item.DepartmentMasterSid)">
                                    <i-feather name="trash-2" class="feather-sm"></i-feather>
                                </a>
                            </div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.departmentCode}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.departmentName}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.departmentType}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.ExportImport}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.FCLLCL}}</div>
                        </td>
                        <td>
                            @if(item.Status === "A"){
                            <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                Active
                            </div>
                            } @else {
                            <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                Invalid
                            </div>
                            }
                        </td>

                    </tr>
                </tbody>
            </table>
        </div>
        <div>
            <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
            </ngb-pagination>
        </div>
    </div>

    <!-- No records found -->
    <div class="col-12" *ngIf="totalLengthOfCollection === 0">
        <div>No records found</div>
    </div>
</div>
