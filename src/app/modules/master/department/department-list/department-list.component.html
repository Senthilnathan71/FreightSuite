    <div class="row">
    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm">
            <div class="col-md-4 pb-2">
                <h4 class="page-title mb-0">Department</h4>
            </div>

            <div class="col-md-8 pb-2">
                <form class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                        (click)="navigateToCreateDepartment()">
                        <i class="fas fa-plus me-1"></i> Create
                    </button>

                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="report()"
                        [disabled]="!searchPerformed">
                        <i class="fas fa-file-alt me-1"></i> Report
                    </button>

                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="resetPage()"
                        [disabled]="!searchPerformed">
                        <i class="fas fa-sync-alt me-1"></i> Reset
                    </button>
                </form>
            </div>

                            <div class="col-md-12 border-top">
            <div class="row mx-0 py-2">
                <div class="col-md-8 mx-auto px-0">
                    <form class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0">
                        <div class="d-flex gap-2 col-6 px-0 align-items-center">
                            <div class="form-outline flex-grow-1 position-relative">
                                <input name="filterValue" type="text" class="form-control pe-5" placeholder="Search" [(ngModel)]="filterValue"
                                    aria-label="Search input">
                                <button *ngIf="filterValue"
                                    class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-3 p-1 text-secondary"
                                    (click)="clearFilterValue()" tabindex="0" aria-label="Clear search" data-bs-toggle="tooltip"
                                    data-bs-placement="top" data-bs-title="Clear search"
                                    onfocus="this.classList.replace('text-secondary','text-danger')"
                                    onblur="this.classList.replace('text-danger','text-secondary')">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                            <button type="submit" (click)="loadDepartments()" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
  <i class="fas fa-search me-1"></i> Search
</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalLengthOfCollection > 0">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered">
                    <thead>
        <tr class="bg-info">
            <th class="bg-transparent text-light" scope="col" width="10%">Action</th>
            <th class="bg-transparent text-light" scope="col" (click)="sort('   ')">
                Dept Code
                <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'departmentCode', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'departmentCode'}"></i>
            </th>
           <th class="bg-transparent text-light" scope="col" (click)="sort('departmentName')">
    Dept Name
    <i class="fas fa-sort ms-1" 
       [ngClass]="{
         'fa-sort-up': sortDirection === 'asc' && sortColumn === 'departmentName', 
         'fa-sort-down': sortDirection === 'desc' && sortColumn === 'departmentName'
       }"></i>
</th>
            <th class="bg-transparent text-light" scope="col" (click)="sort('departmentType')">
                Dept Type
                <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'departmentType', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'departmentType'}"></i>
            </th>
            <th class="bg-transparent text-light" scope="col" (click)="sort('ExportImport')">
                Exp/Imp
                <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'ExportImport', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'ExportImport'}"></i>
            </th>
            <th class="bg-transparent text-light" scope="col" (click)="sort('FCLLCL')">
                FCL/LCL
                <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'FCLLCL', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'FCLLCL'}"></i>
            </th>
            <th class="bg-transparent text-light" scope="col" (click)="sort('Division')">
                Division
                <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'Division', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'Division'}"></i>
            </th>
            <th class="bg-transparent text-light" scope="col" width="10%">Status</th>
        </tr>
    </thead>
                    <tbody>
                        <tr *ngFor="let item of departmentList; let i = index; trackBy: trackByIndex">
                            <td>
                                <div class="d-flex align-items-center">
                                    <a class="text-info mx-2" class="link mx-2 ps-3 "
                                        [routerLink]="['/master/department/entry/', item.DepartmentMasterSid]">
                                        <i-feather class="feather-sm text-info" name="eye"></i-feather>
                                    </a>
                                    <a class="text-danger mx-2 ps-3 border-start"
                                        (click)="deleteDepartment(item.DepartmentMasterSid)">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.departmentCode}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.departmentName}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.departmentType}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.ExportImport}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.FCLLCL}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.Division}}</div>
                            </td>
                            <td>
                                @if(item.Status === "A"){
                                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Active
                                </div>
                                } @else {
                                <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                    Suspended
                                </div>
                                }
                            </td>

                        </tr>
                    </tbody>
                </table>
            </div>
            <div>
                <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                    [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
                </ngb-pagination>
            </div>
        </div>
    </div>


    <!-- No records found -->
    <div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed">
        <div>No records found</div>
    </div>
</div>
