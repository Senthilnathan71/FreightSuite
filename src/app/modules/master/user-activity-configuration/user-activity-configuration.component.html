<div class="user-activity-config-page">
  <!-- Header -->
  <header class="page-header d-flex justify-content-between align-items-center mb-1 p-2">
    <div>
      <h4 class="page-title mb-0">
        <i class="fas fa-user-cog me-2" aria-hidden="true"></i>
        Resource Allocation
      </h4>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button type="button" class="btn btn-sm btn-outline-light header-action" (click)="goBack()">
        <i class="fas fa-arrow-left me-1" aria-hidden="true"></i> Back
      </button>
    </div>
  </header>

  <!-- Branch Selector -->
  <section class="branch-selector mb-1">
    <div class="card mt-1"mb-1>
      <div class="card-body py-1">
        <div class="row align-items-center g-2">
          <div class="col-auto">
            <label for="branchSelect" class="form-label mb-0 fw-semibold">
              <i class="fas fa-code-branch me-1 text-primary"></i> Branch:
            </label>
          </div>
          <div class="col-md-4">
            <ng-select
              id="branchSelect"
              [items]="branches"
              bindLabel="branchName"
              bindValue="BranchMasterSid"
              [(ngModel)]="selectedBranchSid"
              (change)="onBranchChange()"
              placeholder="Select Branch"
              [clearable]="false">
            </ng-select>
          </div>
          <div class="col d-flex justify-content-end">
            <button
              type="button"
              class="btn btn-info"
              [disabled]="!hasDirtyRows || isSaving"
              (click)="saveConfig()">
              <ng-container *ngIf="!isSaving">
                <i class="fas fa-save me-1"></i> Save Configuration
              </ng-container>
              <ng-container *ngIf="isSaving">
                <i class="fas fa-spinner fa-spin me-1"></i> Saving...
              </ng-container>
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="text-center py-5">
    <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
    <p class="text-muted mt-2">Loading configuration...</p>
  </div>

  <!-- Config Table -->
  <section *ngIf="!isLoading && configRows.length > 0" class="config-table-section">
    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr class="table-header">
                <th class="col-code">Menu Code</th>
                <th class="col-name">Menu Name</th>
                <th class="col-user">Assigned User</th>
                <th class="col-status text-center">Status</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let row of configRows" [class.row-dirty]="row.dirty">
                <td class="col-code">
                  <span class="activity-code">
                    <i class="fas fa-circle me-2 activity-dot" aria-hidden="true"></i>
                    {{ row.MenuCode }}
                  </span>
                </td>
                <td class="col-name">
                  <span class="activity-name">{{ row.MenuName }}</span>
                </td>
                <td class="col-user">
                  <ng-select
                    [items]="users"
                    bindLabel="userName"
                    bindValue="UserMasterSid"
                    [(ngModel)]="row.UserMasterSid"
                    (change)="onUserChange(row, $event)"
                    placeholder="Select User"
                    [clearable]="true"
                    appendTo="body"
                    class="user-select-sm">
                  </ng-select>
                </td>
                <td class="col-status text-center">
                  <span *ngIf="row.dirty" class="status-pill status-modified">
                    <i class="fas fa-pencil-alt me-1"></i> Modified
                  </span>
                  <span *ngIf="!row.dirty && row.UserMasterSid" class="status-pill status-configured">
                    <i class="fas fa-check me-1"></i> Configured
                  </span>
                  <span *ngIf="!row.dirty && !row.UserMasterSid" class="status-pill status-not-set">
                    <i class="fas fa-minus me-1"></i> Not Set
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

 
  </section>

  <!-- Empty State -->
  <div *ngIf="!isLoading && configRows.length === 0 && selectedBranchSid" class="text-center py-5">
    <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
    <p class="text-muted">No menus available.</p>
  </div>
</div>
