  [defaultSearchType]="'VesselName'"
  (onCreateClick)="navigateToCreateVessel()"
  (onReportClick)="report()"
  (onResetClick)="resetPage()"
  (onSearchClick)="onSearch($event)">
    </app-listpage>

    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalLengthOfCollection > 0">
         <div class="col-12 p-0" >
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered">
                    <thead>
                        <tr class="bg-info">
                            <th class="bg-transparent text-light" scope="col"  width="10%">Action</th>
                            <th class="bg-transparent text-light" scope="col">Vessel Name</th>
                            <!-- <th class="bg-transparent text-light" scope="col">Code</th>
                            <th class="bg-transparent text-light" scope="col">MMSINo</th> -->
                            <th class="bg-transparent text-light" scope="col">Vessel Type</th>
                            <th class="bg-transparent text-light" scope="col">Year of Built</th>
                            <!-- <th class="bg-transparent text-light" scope="col">IMOCode</th> -->
                            <th class="bg-transparent text-light" scope="col">Vessel Operator</th>
                            <!-- <th class="bg-transparent text-light" scope="col">Net Register Ton</th> -->
                            <th class="bg-transparent text-light" scope="col" width="10%">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of vesselList; let i = index; trackBy: trackByIndex">
                            <td>
                                <div class="d-flex align-items-center">
                                    <a class="text-info mx-2" class="link mx-2 ps-3 "
                                        [routerLink]="['/master/vessel/entry/', item.VesselMasterSid]">
                                        <i-feather class="feather-sm text-info" name="eye"></i-feather>
                                    </a>
                                    <a class="text-danger mx-2 ps-3 border-start"
                                        (click)="deleteVessel(item.VesselMasterSid)">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>
                            <td>
                                {{item.VesselName}}
                            </td>
                            <!-- <td>
                                {{item.VesselShortCode}}
                            </td>
                            <td>
                                {{item.MMSINo}}
                            </td> -->
                            <td>
                                {{item.VesselType}}
                            </td>
                            <td>
                                {{item.YearofBuilt}}
                            </td>
                            <!-- <td>
                                {{item.IMOCode}}
                            </td> -->
                            <td>
                                {{item.VesselOperator}}
                            </td>
                            <!-- <td>
                                {{item.NRT}}
                            </td> -->
                            <td>
                                @if(item.status === 'A'){
                                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Active
                                </div>
                                } @else {
                                <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                    Suspended
                                </div>
                                }
                            </td>

                        </tr>


                    </tbody>
                </table>
            </div>
        </div>
        <div>
            <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
            </ngb-pagination>
        </div>
    </div>
    </div>
   
    <!-- No records found -->
    <div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed">
        <div>No records found</div>
    </div>
</div>
