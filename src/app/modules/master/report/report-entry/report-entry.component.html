<div class="row py-3">
    <div class="col-12">
        <div class="d-flex align-items-center gap-2 mb-3">
            <button class="btn btn-sm btn-light-secondary ms-auto">Edit</button>
            <button class="btn btn-sm btn-info">Update</button>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="Name">
                            <label for="text-input" class="input-label">Name <span class="text-danger">*</span></label>
                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="displayName">
                            <label for="text-input" class="input-label">Display Name <span
                                    class="text-danger">*</span></label>
                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="moduleName">
                            <label for="text-input" class="input-label">Module Name <span
                                    class="text-danger">*</span></label>

                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="formName">
                            <label for="text-input" class="input-label">Form Name <span
                                    class="text-danger">*</span></label>

                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="type">
                            <label for="text-input" class="input-label">Type <span class="text-danger">*</span></label>

                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="apexPageNo">
                            <label for="text-input" class="input-label">Apex Page No</label>

                        </div>
                    </aside>
                    <aside class="col-md-5">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="parameterName">
                            <label for="text-input" class="input-label">Parameter Name <span
                                    class="text-danger">*</span></label>

                        </div>
                    </aside>

                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <textarea id="" placeholder="" rows="1" class="input-field sm"
                                formControlName="titleFormat"></textarea>
                            <label for="text-input" class="input-label">Title Format </label>
                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="procedureName">
                            <label for="text-input" class="input-label">Procedure Name </label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <textarea id="" placeholder="" rows="1" class="input-field sm"
                                formControlName="Remarks"></textarea>
                            <label for="text-input" class="input-label">Remarks </label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="status">
                            <label for="text-input" class="input-label">Status <span
                                    class="text-danger">*</span></label>

                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="form-check form-check-inline">
                            <div class="form-check d-flex align-items-center gap-2">
                                <input type="checkbox" id="defaultSelected" class="form-check-input">
                                <label for="defaultSelected" class="form-check-label">Default Selected</label>
                            </div>
                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="companyList">
                            <label for="text-input" class="input-label">Company List</label>

                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="companyBlockedList">
                            <label for="text-input" class="input-label">Company Blocked List <span
                                    class="text-danger">*</span></label>

                        </div>
                    </aside>

                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">

                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <textarea id="" placeholder="" rows="1" class="input-field sm"
                                formControlName="mailSubject"></textarea>
                            <label for="text-input" class="input-label">Mail Subject </label>
                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="messageBoby">
                            <label for="text-input" class="input-label">Message boby</label>

                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <div class="form-check form-check-inline">
                                <div class="form-check d-flex align-items-center gap-2">
                                    <input type="checkbox" id="sendMailRequired" class="form-check-input">
                                    <label for="sendMailRequired" class="form-check-label">Send Mail Required?</label>
                                </div>
                            </div>
                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="group">
                            <label for="text-input" class="input-label">Group  </label>

                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="subGroup">
                            <label for="text-input" class="input-label">Sub Group</label>

                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 mt-5">
        <div class="card">
            <div class="card-body">
                <ul ngbNav #nav="ngbNav" [(activeId)]="active" class="nav-tabs">
                    <li [ngbNavItem]="1">
                        <button ngbNavLink>Parameter</button>
                        <ng-template ngbNavContent>
                            <ng-container *ngTemplateOutlet="parameter"></ng-container>
                        </ng-template>
                    </li>
                    <li [ngbNavItem]="2">
                        <button ngbNavLink>Logo</button>
                        <ng-template ngbNavContent>
                            <ng-container *ngTemplateOutlet="logo"></ng-container>
                        </ng-template>
                    </li>
                </ul>
    
                <section [ngbNavOutlet]="nav" class="mt-2 p-2"></section>
            </div>
        </div>
    </div>
</div>


<ng-template #parameter>
       
    <div class="col-12 mt-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle no-wrap table-bordered">
                <thead>
                    <tr class="bg-info">
                        <th class="bg-transparent text-light" scope="col">Action</th>
                        <th class="bg-transparent text-light" scope="col"> No</th>
                        <th class="bg-transparent text-light" scope="col">Parameter Name</th>
                        <th class="bg-transparent text-light" scope="col">Prompt Name</th>
                        <th class="bg-transparent text-light" scope="col">Datatype</th>
                        <th class="bg-transparent text-light" scope="col">LOV</th>
                        <th class="bg-transparent text-light" scope="col">Initial Value</th>
                        <th class="bg-transparent text-light" scope="col">Visible</th>
                        <th class="bg-transparent text-light" scope="col">Multi Select</th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of [0,1,2,3,4,5,6,7,8]; track $index) {
                        <tr>
                            <td>
                                <div class="text-truncate">Oman Rials</div>
                            </td>
                            <td>
                                <div class="text-truncate">OMR</div>
                            </td>
                            <td>
                                <div class="text-truncate">RO</div>
                            </td>
                            <td>
                                <div class="text-truncate">Rial</div>
                            </td>
                            <td>
                                <div class="text-truncate">Baizas</div>
                            </td>
                            <td>
                                <div class="text-truncate">Baizas</div>
                            </td>
                            <td>
                                <div class="text-truncate">Baizas</div>
                            </td>
                            <td>
                                <div class="text-truncate">Baizas</div>
                            </td>
                            <td>
                                <div class="text-truncate">Baizas</div>
                            </td>
                           
                           
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</ng-template>

<ng-template #logo>
       
    <div class="row">
        
            <div class="col-md-6">
                <div class="card ">
                    <div class="card-body">
                        <div class="row">
                            <aside class="col-md-12">
                                <div class="custom-form-group">
                                    <input type="file" id="text-input" placeholder="" class="custom-input-field sm"
                                        formControlName="file">
                                </div>
                            </aside>
                            <aside class="col-md-6">
                                <div class="custom-form-group">
                                    <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                        formControlName="fileName">
                                    <label for="text-input" class="input-label">File Name <span
                                            class="text-danger">*</span></label>
                                </div>
                            </aside>
                            <aside class="col-md-6">
                                <div class="custom-form-group">
                                    <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                        formControlName="mimeType">
                                    <label for="text-input" class="input-label">Mime Type <span
                                            class="text-danger">*</span></label>
                                </div>
                            </aside>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card ">
                    <div class="card-body">
                        <div class="row">
                            <aside class="col-md-12">
                                <div class="custom-form-group">
                                    <input type="file" id="text-input" placeholder="" class="custom-input-field sm"
                                        formControlName="file">
                                </div>
                            </aside>
                            <aside class="col-md-6">
                                <div class="custom-form-group">
                                    <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                        formControlName="fileName">
                                    <label for="text-input" class="input-label">File Name <span
                                            class="text-danger">*</span></label>
                                </div>
                            </aside>
                            <aside class="col-md-6">
                                <div class="custom-form-group">
                                    <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                        formControlName="mimeType">
                                    <label for="text-input" class="input-label">Mime Type <span
                                            class="text-danger">*</span></label>
                                </div>
                            </aside>
                        </div>
                    </div>
                </div>
            </div>
        
    </div>
</ng-template>
