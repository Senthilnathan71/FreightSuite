<ngx-spinner
  bdColor="rgba(0,0,0,0.8)"
  size="medium"
  color="#fff"
  type="ball-scale-ripple"
  [fullScreen]="true">
  <p style="color: white;" class="m-0">Loading...</p>
</ngx-spinner>

<div class="row compact-form">
    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm justify-content-between">
            <div class="col pb-2">
                <h4 class="page-title mb-0">Document Authorization</h4>
            </div>

            <div class="col-md pb-2">
                <form class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0">
                    <div class="d-flex gap-2 col-12 px-0 align-items-stretch align-items-md-center">
                        <div class="form-outline flex-grow-1 position-relative">
                            <input name="filterValue" type="text" class="form-control pe-5" placeholder="Search"
                                aria-label="Search input" [(ngModel)]="filterValue">
                            <button *ngIf="filterValue"
                                class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-3 p-1 text-secondary"
                                tabindex="0" aria-label="Clear search"
                                data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Clear search"
                                onfocus="this.classList.replace('text-secondary','text-danger')"
                                onblur="this.classList.replace('text-danger','text-secondary')"
                                (click)="clearFilterValue()"
                                >
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="mt-md-0 mt-1">
                            <button type="submit" 
                                class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="searchPendingApprovals()">
                                <i class="fas fa-search me-1"></i> Search
                            </button>
                        </div>

                    </div>
                </form>
            </div>

            <div class="col-md-auto pb-2">
                <form
                    class=" d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <app-favorite-star screenName="Document Authorization" class="mt-1 me-1"></app-favorite-star>
                    <!-- <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                        >
                        <i class="fas fa-plus me-1"></i> Create
                    </button> -->

                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" 
                      (click)="report()">
                        <i class="fas fa-file-alt me-1"></i> Report
                    </button>

                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" 
                      (click)="resetPage()" >
                        <i class="fas fa-sync-alt me-1"></i> Reset
                    </button>
                </form>
            </div>


        </div>
    </div>
    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalLengthOfCollection > 0">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered table-sm mb-1">
                    <thead>
                        <tr class="bg-info">
                           
                            <th class="bg-transparent text-light" scope="col" (click)="sort('DocumentName')">
                                Document Name
                                <i class="fas fa-sort ms-1"
                                    [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'DocumentName', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'DocumentName'}"></i>
                            </th>
                            <th class="bg-transparent text-light" scope="col" (click)="sort('DocumentNo')">
                                 Document No.
                              <i class="fas fa-sort ms-1"
                                    [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'DocumentNo', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'DocumentNo'}"></i>
                            </th>
                             <th class="bg-transparent text-light" scope="col" (click)="sort('CreatedOn')">
                                Created On
                              <i class="fas fa-sort ms-1"
                                    [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'CreatedOn', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'CreatedOn'}"></i>
                            </th>
                             <th class="bg-transparent text-light" scope="col" (click)="sort('CreatedBy')">
                                Created By
                              <i class="fas fa-sort ms-1"
                                    [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'CreatedBy', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'CreatedBy'}"></i>
                            </th>
                             <th class="bg-transparent text-light" scope="col" (click)="sort('AuthorizeStatus')">
                                Authorize Status
                              <i class="fas fa-sort ms-1"
                                    [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'AuthorizeStatus', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'AuthorizeStatus'}"></i>
                            </th>
                             <th class="bg-transparent text-light" scope="col" width="8%">
                                Authorize
                              <i class="fas fa-sort ms-1"></i>
                            </th>

                        </tr>
                    </thead>
                    <tbody>
                        @for(item of allPendingApprovals;track item){
                        <tr >
                            <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                <div class="text-truncate">{{item.DocumentName}}</div>
                            </td>
                            <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                <div class="text-truncate">{{item.DocumentNo}}</div>
                            </td>
                             <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                <div class="text-truncate">{{item.CreatedOn | formatDate}}</div>
                            </td>
                             <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                <div class="text-truncate">{{item.CreatedBy}}</div>
                            </td>
                             <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                <div class="text-truncate">{{item.AuthorizeStatus}}</div>
                            </td>
                            <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                <div class="d-flex justify-content-center">
                                     <a class="btn btn-link btn-sm text-info" (click)="goToApprovalLink(item.menuSid,item.authorizeLink)">
                                    <i-feather name="external-link" class="feather-sm"></i-feather>
                                </a>
                                </div>
                               
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-end mt-2">
                <ngb-pagination [collectionSize]="totalLengthOfCollection" [(page)]="page" [pageSize]="pageSize"
                    (pageChange)="updatePaginationData()" [maxSize]="10" [rotate]="true" [ellipses]="false">
                </ngb-pagination>
            </div>
        </div>
    </div>
    <div class="col-12" *ngIf="totalLengthOfCollection === 0">
        <div>No records found</div>
    </div>
</div>
