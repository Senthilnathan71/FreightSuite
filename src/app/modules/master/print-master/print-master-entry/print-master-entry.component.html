<ngx-spinner bdColor="rgba(0,0,0,0.8)" size="medium" color="#fff" type="ball-scale-ripple" [fullScreen]="true">
  <p style="color: white;" class="m-0">Loading...</p>
</ngx-spinner>

<div class="row compact-form">
  <div class="col-12 px-0">
    <!-- Header -->
    <div class="row bg-white mb-1 align-items-center pt-1 rounded shadow-sm mx-0">
      <div class="col-md-4 d-flex pb-1">
        <div class="d-flex align-items-center gap-2">
          <div class="brand-icon">
            <i class="fas fa-print"></i>
          </div>
          <h5 class="page-title mb-0 text-info">
            {{ isEditMode ? 'Edit' : 'Add' }} Print Master
          </h5>
        </div>
      </div>
      <div class="col-md-8 pb-1">
        <div class="d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
          <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" (click)="navigateBack()">
            <i class="fas fa-chevron-left me-1"></i> Back
          </button>
          <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" (click)="resetForm()">
            <i class="fas fa-sync-alt me-1"></i> Reset
          </button>
          <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
            (click)="onSubmit()" [disabled]="form.invalid || isLoading">
            <i class="fas fa-save me-1"></i> Save
          </button>
        </div>
      </div>
    </div>

    <!-- Form -->
    <form [formGroup]="form">
      <div class="card mb-1">
        <div class="card-body">
          <div class="row">

            <!-- Menu -->
            <aside class="col-md-4">
              <div class="custom-form-group custom-form-group-select"
                [class.filled]="!!form.get('MenuMasterSid')?.value">
                <ng-select
                  class="ng-select"
                  [items]="menuList"
                  bindLabel="MenuName"
                  bindValue="MenuMasterSid"
                  placeholder=""
                  formControlName="MenuMasterSid">
                </ng-select>
                <label class="input-label">Menu <span class="text-danger">*</span></label>
                <div class="error-message"
                  *ngIf="form.get('MenuMasterSid')?.touched && form.get('MenuMasterSid')?.hasError('required')">
                  Menu is required
                </div>
              </div>
            </aside>

            <!-- Print Name -->
            <aside class="col-md-4">
              <div class="custom-form-group"
                [class.filled]="!!form.get('Name')?.value">
                <input type="text" class="custom-input-field sm" placeholder=""
                  formControlName="Name" maxlength="50">
                <label class="input-label">Print Name <span class="text-danger">*</span></label>
                <div class="error-message"
                  *ngIf="form.get('Name')?.touched && form.get('Name')?.invalid">
                  <span *ngIf="form.get('Name')?.hasError('required')">Print Name is required</span>
                  <span *ngIf="form.get('Name')?.hasError('maxlength')">Max 50 characters</span>
                </div>
              </div>
            </aside>

            <!-- Action (PrintMail) -->
            <aside class="col-md-4">
              <div class="custom-form-group custom-form-group-select"
                [class.filled]="!!form.get('PrintMail')?.value">
                <ng-select
                  class="ng-select"
                  [items]="printMailOptions"
                  bindLabel="label"
                  bindValue="value"
                  placeholder=""
                  formControlName="PrintMail">
                </ng-select>
                <label class="input-label">Action <span class="text-danger">*</span></label>
                <div class="error-message"
                  *ngIf="form.get('PrintMail')?.touched && form.get('PrintMail')?.hasError('required')">
                  Action is required
                </div>
              </div>
            </aside>

            <!-- Status (edit mode only) -->
            <aside class="col-md-4" *ngIf="isEditMode">
              <div class="custom-form-group custom-form-group-select"
                [class.filled]="!!form.get('Status')?.value">
                <ng-select
                  class="ng-select"
                  [items]="statusOptions"
                  bindLabel="label"
                  bindValue="value"
                  placeholder=""
                  formControlName="Status">
                </ng-select>
                <label class="input-label">Status</label>
              </div>
            </aside>

          </div>
        </div>
      </div>
    </form>
  </div>
</div>
