<div class="row py-3">
    <div class="col-12">
        <div class="d-flex align-items-center gap-2 mb-3">
            <button class="btn btn-sm btn-light-secondary ms-auto">Edit</button>
            <button class="btn btn-sm btn-info">Update</button>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="Name" >
                            <label for="text-input" class="input-label">Name <span class="text-danger">*</span></label>    
                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="Code" >
                            <label for="text-input" class="input-label">Code <span class="text-danger">*</span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="numericCode" >
                            <label for="text-input" class="input-label">Numeric Code <span class="text-danger">*</span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="3letterCode" >
                            <label for="text-input" class="input-label">3 Letter Code</label>
                        </div>
                    </aside>
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="address1" >
                            <label for="text-input" class="input-label">Address1</label>
                            
                        </div>
                    </aside>
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="address2" >
                            <label for="text-input" class="input-label">Address2</label>
                            
                        </div>
                    </aside>
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="address3" >
                            <label for="text-input" class="input-label">Address3</label>
                            
                        </div>
                    </aside>
                    <aside class="col-md-8">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="city" >
                            <label for="text-input" class="input-label">City</label>
                           
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="postalCode" >
                            <label for="text-input" class="input-label">Postal Code</label>
                           
                        </div>
                    </aside>
                    <aside class="col-md-8">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="country" >
                            <label for="text-input" class="input-label">Country</label>
                           
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="reorderedQTY" >
                            <label for="text-input" class="input-label">Reorderd Qty.</label>
                           
                        </div>
                    </aside>
                   
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">
                    <!-- <h6 class="card-title mb-0">Basic Info 2</h6> -->
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="file" id="text-input" placeholder="" class="custom-input-field sm" formControlName="MinTemp" >
                            <label for="text-input" class="input-label"></label>
                           
                        </div>
                    </aside>
                    <aside>
                        <div class="col-md-12 py-2">
                            <div class="form-check form-check-inline">
                                <div class="form-check">
                                    <input type="checkbox" id="CASS" class="form-check-input">
                                    <label for="CASS" class="form-check-label">CASS Controlled</label>
                                </div>
                            </div>
                            <div class="form-check form-check-inline">
                                <div class="form-check">
                                    <input type="checkbox" id="IATA" class="form-check-input">
                                    <label for="IATA" class="form-check-label">IATA</label>
                                </div>
                            </div>
                            <div class="form-check form-check-inline">
                                <div class="form-check">
                                    <input type="checkbox" id="ATA" class="form-check-input">
                                    <label for="ATA" class="form-check-label">ATA</label>
                                </div>
                            </div>
                            <div class="form-check form-check-inline">
                                <div class="form-check">
                                    <input type="checkbox" id="AIRNC" class="form-check-input">
                                    <label for="AIRNC" class="form-check-label">AIRNC</label>
                                </div>
                            </div>
                            <div class="form-check form-check-inline">
                                <div class="form-check">
                                    <input type="checkbox" id="SITA" class="form-check-input">
                                    <label for="SITA" class="form-check-label">SITA</label>
                                </div>
                            </div>
                        </div>
                    </aside>
                    <aside class="col-md-12 pt-2">
                        <div class="custom-form-group">
                            <textarea id="" placeholder="" rows="" class="input-field sm" formControlName="Remarks"></textarea>
                            <label for="text-input" class="input-label">Remarks </label>
                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="Status" >
                            <label for="text-input" class="input-label">Status <span class="text-danger">*</span></label>
                        </div>
                    </aside>   
                    <aside class="col-md-6">
                        <div class="form-check form-check-inline mt-3">
                            <div class="form-check">
                                <input type="checkbox" id="EAWB" class="form-check-input">
                                <label for="EAWB" class="form-check-label">EAWB Agreement Signed</label>
                            </div>
                        </div>
                    </aside>   
                   
                </div>
            </div>
        </div>
    </div>
    <div class="col-12">
        <div class="card mt-3">
            <div class="card-body">
               
            </div>
        </div>
    </div>
</div>
