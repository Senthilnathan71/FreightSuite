<div class="row">
    <div class="col-12">
        <div class="rounded-3 p-2 bg-body-tertiary shadow mb-2">
            <div class="col-12">
                <div class="rounded-3 p-2 bg-body-tertiary shadow mb-2" data-bs-theme="light">
                    <form class="d-flex align-items-center gap-2">
                        <div class="form-outline col">
                            <select [(ngModel)]="searchType" name="searchType" class="form-select">
                                <option value="currencyName">Currency Name</option>
                                <option value="currencyCode">Currency Code</option>
                                <option value="symbol">Symbol</option>
                                <option value="unit">Unit</option>
                                <option value="subUnit">Sub Unit</option>
                                <option value="status">Status</option>
                                <option value="countryName">Country Name</option>
                            </select>
                        </div>
                        <div class="form-outline col">
                            <input [(ngModel)]="filterValue" name="filterValue" type="text" class="form-control"
                                placeholder="Enter filter value">
                            <i
                                class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                        </div>

                        <button type="button" class="btn btn-info btn-sm" (click)="search()">
                            <i class="fas fa-search"></i>
                            Search
                        </button>
                        <button type="button" class="btn btn-info btn-sm" (click)="navigateToCreateCurrency()">
                            <i class="mdi mdi-plus"></i> Add
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm">
                            report
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm" (click)="resetSearch()">
                            Reset
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12" *ngIf="totalLengthOfCollection > 0">
        <div class="table-responsive">
            <table class="table table-hover align-middle no-wrap table-bordered">
                <thead>
                    <tr class="bg-info">
                        <th class="bg-transparent text-light" scope="col">Currency Name</th>
                        <th class="bg-transparent text-light" scope="col">Currency Code</th>
                        <th class="bg-transparent text-light" scope="col">Symbol</th>
                        <th class="bg-transparent text-light" scope="col">Unit</th>
                        <th class="bg-transparent text-light" scope="col">Sub Unit</th>
                        <th class="bg-transparent text-light" scope="col">Status</th>
                        <th class="bg-transparent text-light" scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of filteredCurrencies; let i = index; trackBy: trackByIndex">
                        <td>
                            <div class="text-truncate">{{item.currencyName}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.currencyCode}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.symbol}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.unit}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.subUnit}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{ item.status === 'A' ? 'Active' : 'Inactive' }}</div>
                        </td>
                        <td>
                            <div class="d-flex align-items-center">
                                <a class="text-primary mx-2" 
                                   [routerLink]="['/master/currency/entry/', item.CurrencyMasterSid]"
                                   title="Edit">
                                   <i-feather name="edit-3" class="feather-sm"></i-feather>
                                </a>
                                <a class="text-danger mx-2 ps-3 border-start"
                                   (click)="deleteCurrency(item.CurrencyMasterSid)"
                                   title="Delete">
                                    <i-feather name="trash-2" class="feather-sm"></i-feather>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div>
            <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
            </ngb-pagination>
        </div>
    </div>

    <!-- No records found -->
    <div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed">
        <div>No records found</div>
    </div>
</div>
