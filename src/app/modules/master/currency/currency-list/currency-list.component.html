    <div class="row bg-white py-2 rounded shadow-sm mx-auto">
         <div class="col-12 p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle no-wrap table-bordered">
                <thead>
                    <tr class="bg-info">
                        <th class="bg-transparent text-light" scope="col">Currency Name</th>
                        <th class="bg-transparent text-light" scope="col">Currency Code</th>
                        <th class="bg-transparent text-light" scope="col">Symbol</th>
                        <th class="bg-transparent text-light" scope="col">Unit</th>
                        <th class="bg-transparent text-light" scope="col">Sub Unit</th>
                        <th class="bg-transparent text-light" scope="col">Sub Unit In</th>
                        <th class="bg-transparent text-light" scope="col">Round off</th>
                        <th class="bg-transparent text-light" scope="col">Status</th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of [0,1,2,3,4,5,6,7,8]; track $index) {
                        <tr>
                            <td>
                                <div class="text-truncate">Oman Rials</div>
                            </td>
                            <td>
                                <div class="text-truncate">OMR</div>
                            </td>
                            <td>
                                <div class="text-truncate">RO</div>
                            </td>
                            <td>
                                <div class="text-truncate">Rial</div>
                            </td>
                            <td>
                                <div class="text-truncate">Baizas</div>
                            </td>
                            <td>
                                <div class="text-truncate">1000</div>
                            </td>
                            <td>
                                <div class="text-truncate">3</div>
                            </td>
                            <td>
                                <div class="text-truncate">Active</div>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
