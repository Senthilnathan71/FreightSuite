     <div class="col-12">
        <div class="rounded-3 p-2 bg-body-tertiary shadow mb-2">
            <div class="col-8 mx-auto">
                <div class="rounded-3 p-2 bg-body-tertiary  mb-2" data-bs-theme="light">
                    <form class="d-flex align-items-center gap-2">
                        <div class="form-outline col">
                            <select  name="searchType" class="form-select">
                                <option value="departmentName">Department Name</option>
                                <option value="departmentCode">Department Code</option>
                                <option value="departmentType">Department Type</option>
                                <option value="ExportImport">Export/Import</option>
                                <option value="FCLLCL">FCLLCL</option>
                                <option value="status">Status</option>
                            </select>
                        </div>
                        <div class="form-outline col">
                            <input  name="filterValue" type="text" class="form-control"
                                placeholder="Enter filter value">
                            <i
                                class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                        </div>

                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80" >
                            <i class="fas fa-search"></i>
                            Search
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80"
                           >
                            <i class="mdi mdi-plus"></i> Create
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80" >
                            <!-- <i class="mdi mdi-plus"></i> -->
                            Report
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80" >
                            <!-- <i class="mdi mdi-plus"></i> -->
                            Reset
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12">
        <div class="table-responsive">
            <table class="table table-hover align-middle no-wrap table-bordered">
                <thead>
                    <tr class="bg-info">
                        <th class="bg-transparent text-light" scope="col">Currency Name</th>
                        <th class="bg-transparent text-light" scope="col">Currency Code</th>
                        <th class="bg-transparent text-light" scope="col">Symbol</th>
                        <th class="bg-transparent text-light" scope="col">Unit</th>
                        <th class="bg-transparent text-light" scope="col">Sub Unit</th>
                        <th class="bg-transparent text-light" scope="col">Sub Unit In</th>
                        <th class="bg-transparent text-light" scope="col">Round off</th>
                        <th class="bg-transparent text-light" scope="col">Status</th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of [0,1,2,3,4,5,6,7,8]; track $index) {
                        <tr>
                            <td>
                                <div class="text-truncate">Oman Rials</div>
                            </td>
                            <td>
                                <div class="text-truncate">OMR</div>
                            </td>
                            <td>
                                <div class="text-truncate">RO</div>
                            </td>
                            <td>
                                <div class="text-truncate">Rial</div>
                            </td>
                            <td>
                                <div class="text-truncate">Baizas</div>
                            </td>
                            <td>
                                <div class="text-truncate">1000</div>
                            </td>
                            <td>
                                <div class="text-truncate">3</div>
                            </td>
                            <td>
                                <div class="text-truncate">Active</div>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
