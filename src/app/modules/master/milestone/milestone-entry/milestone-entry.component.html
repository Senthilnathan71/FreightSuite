<div class="row py-3">
    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
            <div class="col-md-4 pb-2">
                <h4 class="page-title mb-0">Add Milestone</h4>
            </div>
            <div class="col-md-8 pb-2">
                <div
                    class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-chevron-left me-1"></i>
                        Back
                    </button>
                    <button class="btn btn-sm btn-light-secondary dofi-min-w-80 dofi-max-w-80">
                        <i-feather name="edit-3" class="feather-sm me-1"></i-feather> Edit
                    </button>
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-sync-alt me-1"></i>
                        Reset
                    </button>
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-save me-1"></i>
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="Name">
                            <label for="text-input" class="input-label">Name <span class="text-danger">*</span></label>
                        </div>
                    </aside>

                    <aside class="col-md-6">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="PortType" [items]="modeOfShipmentType" bindLabel="name"
                                bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">Shipment Type </label>
                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="PortType" [items]="modeOfDepartmentType" bindLabel="name"
                                bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">Deparment Type </label>
                        </div>
                    </aside>

                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="orderBy">
                            <label for="text-input" class="input-label">Order By</label>

                        </div>
                    </aside>



                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6 mt-md-0 mt-3">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="code">
                            <label for="text-input" class="input-label">Code <span class="text-danger">*</span></label>

                        </div>
                    </aside>
                    <aside class="col-md-3 d-flex align-items-center">
                        <div class="form-check form-check-inline ps-0">
                            <div class="form-check d-flex align-items-center">
                                <input type="checkbox" id="autoCapture" class="form-check-input sm">
                                <label for="autoCapture" class="form-check-label sm">Auto Capture</label>
                            </div>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="PortType" [items]="modeOfStatus" bindLabel="name"
                                bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">Status <span class="text-danger">*</span></label>
                        </div>
                    </aside>
                    <aside class="col-md-12 ">
                        <div class="custom-form-group">
                            <textarea id="" placeholder="" rows="" class="input-field sm"
                                formControlName="Remarks"></textarea>
                            <label for="text-input" class="input-label">Remarks </label>
                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="originalName">
                            <label for="text-input" class="input-label">Original Name <span
                                    class="text-danger">*</span></label>

                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="autoMail">
                            <label for="text-input" class="input-label">Auto Mail <span
                                    class="text-danger">*</span></label>

                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </div>

</div>
