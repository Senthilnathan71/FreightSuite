
<div class="row py-3">
    <div class="col-12">
        <div class="d-flex align-items-center gap-2 mb-3">
            <button class="btn btn-sm btn-light-secondary ms-auto">Edit</button>
            <button class="btn btn-sm btn-info">Update</button>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="Name" >
                            <label for="text-input" class="input-label">Name <span class="text-danger">*</span></label>    
                        </div>
                    </aside>
                  
                    <aside class="col-md-6">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="PortType" [items]="modeOfShipmentType" bindLabel="name" bindValue="name">
                               
                            </ng-select>
                            <label for="" class="input-label">Shipment Type </label>
                        </div>
                    </aside>   
                    <aside class="col-md-6">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="PortType" [items]="modeOfDepartmentType" bindLabel="name" bindValue="name">
                               
                            </ng-select>
                            <label for="" class="input-label">Deparment Type </label>
                        </div>
                    </aside>   
                   
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="orderBy" >
                            <label for="text-input" class="input-label">Order By</label>
                           
                        </div>
                    </aside>
                
                    
                   
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="code" >
                            <label for="text-input" class="input-label">Code <span class="text-danger">*</span></label>
                           
                        </div>
                    </aside>
                    <aside class="col-md-3 d-flex align-items-center">
                        <div class="form-check form-check-inline ps-0">
                            <div class="form-check d-flex align-items-center">
                                <input type="checkbox" id="autoCapture" class="form-check-input sm">
                                <label for="autoCapture" class="form-check-label sm">Auto Capture</label>
                            </div>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="PortType" [items]="modeOfStatus" bindLabel="name" bindValue="name">
                               
                            </ng-select>
                            <label for="" class="input-label">Status <span class="text-danger">*</span></label>
                        </div>
                    </aside>   
                    <aside class="col-md-12 ">
                        <div class="custom-form-group">
                            <textarea id="" placeholder="" rows="" class="input-field sm" formControlName="Remarks"></textarea>
                            <label for="text-input" class="input-label">Remarks </label>
                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="originalName" >
                            <label for="text-input" class="input-label">Original Name <span class="text-danger">*</span></label>
                           
                        </div>
                    </aside>   
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="autoMail" >
                            <label for="text-input" class="input-label">Auto Mail <span class="text-danger">*</span></label>
                           
                        </div>
                    </aside>   
                </div>
            </div>
        </div>
    </div>
   
</div>
