<div class="row py-3">
    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
            <div class="col-md-4 pb-2">
                <h4 class="page-title mb-0"> Sailing Schedule</h4>
            </div>
            <div class="col-md-8 pb-2">
                <div
                    class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                        (click)="navigateBack()">
                        <i class="fas fa-chevron-left me-1"></i>
                        Back
                    </button>
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-sync-alt me-1"></i>
                        Reset
                    </button>
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-save me-1"></i>
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-12">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">

                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Vessel <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Voy No <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Rotation No <span
                                    class="text-danger"></span></label>

                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Shipr IRN <span
                                    class="text-danger"></span></label>

                        </div>
                    </aside>

                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Crew IRN <span
                                    class="text-danger"></span></label>

                        </div>
                    </aside>

                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">SCM ETA <span
                                    class="text-danger"></span></label>

                        </div>
                    </aside>

                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">SCM ETD <span
                                    class="text-danger"></span></label>

                        </div>
                    </aside>

                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">SCM Cargo Description <span
                                    class="text-danger"></span></label>

                        </div>
                    </aside>

                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Remarks <span
                                    class="text-danger"></span></label>

                        </div>
                    </aside>

                    <aside class="col-md-3">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="PortType" [items]="modeOfStatus" bindLabel="name"
                                bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">Status <span class="text-danger"></span></label>
                        </div>
                    </aside>

                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Co lead <span
                                    class="text-danger"></span></label>

                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="PortType" [items]="modeOfVoyageType" bindLabel="name"
                                bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">Voyage Type <span class="text-danger"></span></label>
                        </div>
                    </aside>

                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Carrier <span
                                    class="text-danger"></span></label>

                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </div>


    <div class="row bg-white py-2 rounded shadow-sm mx-0 my-3">
          <div class="col-12 p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle no-wrap table-bordered">
                <thead>
                    <tr class="bg-info">
                        <th class="bg-transparent text-light" scope="col">Action</th>
                        <th class="bg-transparent text-light" scope="col">POL</th>
                        <th class="bg-transparent text-light" scope="col">POD</th>
                        <th class="bg-transparent text-light" scope="col">ETA</th>
                        <th class="bg-transparent text-light" scope="col">ETD</th>
                        <th class="bg-transparent text-light" scope="col">Port Cut off</th>
                        <th class="bg-transparent text-light" scope="col">Transit Date</th>
                        <th class="bg-transparent text-light" scope="col">Rotation</th>
                        <th class="bg-transparent text-light" scope="col">Date</th>
                        <th class="bg-transparent text-light" scope="col">IGM No</th>
                        <th class="bg-transparent text-light" scope="col">IGM Date</th>
                        <th class="bg-transparent text-light" scope="col">EGM No</th>
                        <th class="bg-transparent text-light" scope="col">EGM Date</th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of [0,1,2,3]; track $index) {
                    <tr>
                        <td>
                            <i-feather name="edit-3" class="feather-sm ms-2"></i-feather>
                        </td>
                        <td>
                            <div class="text-truncate">OMR</div>
                        </td>
                        <td>
                            <div class="text-truncate">RO</div>
                        </td>
                        <td>
                            <div class="text-truncate">Rial</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>

                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
    </div>

</div>
