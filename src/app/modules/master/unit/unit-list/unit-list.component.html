<div class="row">
    <!-- #region Search Panel -->
    <div class="col-12">
        <div class="rounded-3 p-2 bg-body-tertiary shadow mb-2">
            <form action="" class="d-flex align-items-center gap-2">
                <div class="form-outline col">
                    <input type="search" class="form-control ps-5" [(ngModel)]="searchText" name="search"
                        (input)="searchUnit()" autocomplete="off" placeholder="Search">
                    <i class="fas fa-search ms-3"></i>
                </div>
                <button type="button" class="btn btn-info btn-sm" (click)="createNew()">
                    <i class="mdi mdi-plus"></i> Add
                </button>
            </form>
        </div>
    </div>
    <!-- #endregion -->

    <div class="col-12">
        <div class="card">
            <!-- #region  -->
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered">
                    <thead>
                        <tr class="bg-info">
                            <th class="bg-transparent text-light" scope="col">Name</th>
                            <th class="bg-transparent text-light" scope="col">Code</th>
                            <th class="bg-transparent text-light" scope="col">job Type</th>
                            <th class="bg-transparent text-light" scope="col">containerType</th>
                            <th class="bg-transparent text-light" scope="col">measurementType</th>
                            <th class="bg-transparent text-light" scope="col">Remarks</th>
                            <th class="bg-transparent text-light" scope="col">Status</th>
                            <th class="bg-transparent text-light" scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody>

                        <tr *ngFor="let unit of filteredUnit">
                            <td>
                                {{ unit.unitName}}
                            </td>
                            <td>
                                {{ unit.unitCode}}
                            </td>
                            <td>
                                {{ unit.jobType}}
                            </td>
                            <td>
                                {{ unit.containerType}}
                            </td>
                            <td>
                                {{ unit.measurementType}}
                            </td>
                            <td>
                                {{ unit.remarks}}
                            </td>
                            <td>
                                <span
                                    class="bg-light-success px-2  rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    {{ unit.status === 'A' ? 'Active' : 'Cancelled' }}</span>
                            </td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <a class="text-info mx-2" class="link mx-2 ps-3 "
                                        [routerLink]="['/master/unit/entry/', unit.UnitMasterSid]">
                                        <i-feather class="feather-sm" name="eye"></i-feather>
                                    </a>
                                    <a class="text-danger mx-2 ps-3 border-start"
                                        (click)="deleteUnit(unit.UnitMasterSid)">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>

            <div class="card-body">
                <!-- #region Pagination -->
                <ngb-pagination class="d-flex justify-content-end
                " [collectionSize]="totalLengthOfCollection" [pageSize]="pageSize" [(page)]="page"></ngb-pagination>
                <!-- #endregion -->
            </div>
            <!-- #endregion -->
        </div>
    </div>
</div>
