<div class="row">
    <div class="col-12">
        <div class="rounded-3 p-2 bg-body-tertiary shadow mb-2">
            <div class="col-8 mx-auto">
                <div class="rounded-3 p-2 bg-body-tertiary  mb-2" data-bs-theme="light">
                    <form class="d-flex align-items-center gap-2">
                        <div class="form-outline col">
                            <select [(ngModel)]="searchType" name="searchType" class="form-select">
                                <option value="unitName">Unit Name</option>
                                <option value="unitCode">Unit Code</option>
                                <option value="jobType">Job Type</option>
                                <option value="containerType">Container Type</option>
                                <option value="measurementType">Measurement Type</option>
                                <option value="remarks">Remarks</option>
                                <option value="status">Status</option>
                            </select>
                        </div>
                        <div class="form-outline col">
                            <input [(ngModel)]="filterValue" name="filterValue" type="text" class="form-control"
                                placeholder="Enter filter value">
                            <i
                                class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                        </div>

                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80" (click)="search()">
                            <i class="fas fa-search"></i>
                            Search
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80"
                            (click)="navigateToCreateUnit()">
                            <i class="mdi mdi-plus"></i> Create
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80" (click)="resetPage()">
                            Reset
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="col-12" *ngIf="totalLengthOfCollection > 0">
    <div class="table-responsive">
        <table class="table table-hover align-middle no-wrap table-bordered">
            <thead>
                <tr class="bg-info">
                    <th class="bg-transparent text-light" scope="col">Unit Name</th>
                    <th class="bg-transparent text-light" scope="col">Unit Code</th>
                    <th class="bg-transparent text-light" scope="col">Job Type</th>
                    <th class="bg-transparent text-light" scope="col">Container Type</th>
                    <th class="bg-transparent text-light" scope="col">Measurement Type</th>
                    <th class="bg-transparent text-light" scope="col">Remarks</th>
                    <th class="bg-transparent text-light" scope="col">Status</th>
                    <th class="bg-transparent text-light" scope="col">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of unitList; let i = index; trackBy: trackByIndex">
                    <td>
                        <div class="text-truncate">{{item.unitName}}</div>
                    </td>
                    <td>
                        <div class="text-truncate">{{item.unitCode}}</div>
                    </td>
                    <td>
                        <div class="text-truncate">{{item.jobType}}</div>
                    </td>
                    <td>
                        <div class="text-truncate">{{item.containerType}}</div>
                    </td>
                    <td>
                        <div class="text-truncate">{{item.measurementType}}</div>
                    </td>
                    <td>
                        <div class="text-truncate">{{item.remarks}}</div>
                    </td>
                    <td>
                        <div class="text-truncate">{{getStatusText(item.status)}}</div>
                    </td>
                    <td>
                        <div class="d-flex align-items-center">
                            <a class="text-info mx-2" [routerLink]="['/master/unit/entry/', item.UnitMasterSid]">
                                <i-feather class="feather-sm" name="eye"></i-feather>
                            </a>
                            <a class="text-danger mx-2 ps-3 border-start" (click)="deleteUnit(item.UnitMasterSid)">
                                <i-feather name="trash-2" class="feather-sm"></i-feather>
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div>
        <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
            [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
        </ngb-pagination>
    </div>
</div>

<!-- No records found -->
<div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed">
    <div class="alert alert-info">No records found</div>
</div>
