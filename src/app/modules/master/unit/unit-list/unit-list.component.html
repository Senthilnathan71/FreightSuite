<div class="d-flex justify-content-end mb-2">
  <i
    [ngClass]="isFavorite ? 'fas fa-star fs-5 text-danger' : 'far fa-star fs-5 text-secondary'"
    (click)="toggleFavorite()"
    data-toggle="tooltip"
    data-placement="bottom"
    title="Favorites"
    style="cursor: pointer;">
  </i>
</div>
<div class="row">
    <app-listpage
  [title]="'Unit'"
  [searchOptions]="[
    { value: 'unitName', label: 'Unit Name' },
    { value: 'unitCode', label: 'Unit Code' },
    { value: 'jobType', label: 'Job Type' },
    { value: 'containerType', label: 'Container Type' },
    { value: 'measurementType', label: 'Measurement Type' },
    { value: 'Status', label: 'Status' }
  ]"
  [searchPerformed]="searchPerformed"
  [defaultSearchType]="'unitName'"
  (onCreateClick)="navigateToCreateUnit()"
  (onReportClick)="report()"
  (onResetClick)="resetPage()"
  (onSearchClick)="onSearch($event)">
    </app-listpage>

    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalLengthOfCollection > 0">
         <div class="col-12 p-0" >
        <div class="table-responsive">
            <table class="table table-hover align-middle no-wrap table-bordered">
                <thead>
                    <tr class="bg-info">
                        <th class="bg-transparent text-light" scope="col" width="10%">Action</th>
                        <th class="bg-transparent text-light" scope="col">Unit Name</th>
                        <th class="bg-transparent text-light" scope="col">Unit Code</th>
                        <th class="bg-transparent text-light" scope="col">Job Type</th>
                        <th class="bg-transparent text-light" scope="col">Container Type</th>
                        <th class="bg-transparent text-light" scope="col">Measurement Type</th>
                        <th class="bg-transparent text-light" scope="col">Remarks</th>
                        <th class="bg-transparent text-light" scope="col">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of unitList; let i = index; trackBy: trackByUnitId">
                        <td>
                            <div class="d-flex align-items-center justify-content-center">
                                <a class="text-info mx-2" [routerLink]="['/master/unit/entry/', item.UnitMasterSid]">
                                    <i-feather class="feather-sm" name="eye"></i-feather>
                                </a>
                                <a class="text-danger mx-2 ps-3 border-start" (click)="deleteUnit(item.UnitMasterSid)">
                                    <i-feather name="trash-2" class="feather-sm"></i-feather>
                                </a>
                            </div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.unitName}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.unitCode}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.jobType}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.containerType}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.measurementType}}</div>
                        </td>
                        <td>
                            <div class="text-truncate">{{item.Remarks}}</div>
                        </td>
                        <td>@if(item.status === "A"){
                            <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                Active
                            </div>
                            } @else {
                            <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                Suspended
                            </div>
                            }
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div>
            <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
            </ngb-pagination>
        </div>
    </div>
    </div>
   

    <!-- No records found -->
    <div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed">
        <div class="alert alert-info text-center">No records found</div>
    </div>
</div>
