    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalAmountOfCollections > 0">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered">
                    <thead>
                        <tr class="bg-info">
                            <th class="bg-transparent text-light" scope="col" width="10%">Action</th>
                           <th class="bg-transparent text-light" scope="col" (click)="sort('BranchMasterSid')">
            Branch
            <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'BranchMasterSid', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'BranchMasterSid'}"></i>
        </th>
        <th class="bg-transparent text-light" scope="col" (click)="sort('MenuMasterSid')">
            Menu
            <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'MenuMasterSid', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'MenuMasterSid'}"></i>
        </th>
                            <th class="bg-transparent text-light" scope="col" width="10%">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (item of slicedTandCList; track $index) {
                        <tr>
                            <td>
                                <div class="d-flex align-items-center justify-content-center" >
                                    <a class="mx-2 ps-2"
                                        [routerLink]="['/master/terms-condition/entry/', item.TermsAndConditionsMasterSid]" title="Edit">
                                        <i-feather name="eye" class="feather-sm"></i-feather>
                                    </a>
                                    <a class="text-danger mx-2 ps-3 border-start" (click)="deleteTandC(item.TermsAndConditionsMasterSid)"
                                        title="Delete">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.branch?.branchName || ''}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.menu?.MenuName || ''}}</div>
                            </td>
                            <td>
                                @if(item.status === "A"){
                                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Active
                                </div>
                                } @else {
                                <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                    Suspended
                                </div>
                                }
                            </td>

                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
        <div>
            <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalAmountOfCollections" [pageSize]="pageSize"
                [(page)]="page" (pageChange)="updatePaginationData()">
            </ngb-pagination>
        </div>
    </div>
    <div class="col-12" *ngIf="totalAmountOfCollections === 0 && searchPerformed">
        <div class="alert alert-info text-center">No records found</div>
    </div>
</div>
