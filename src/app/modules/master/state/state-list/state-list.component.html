<div class="row">
    <app-listpage
    [title]="'State'"
    [searchOptions]="[
    { value: 'stateName', label: 'State Name'},
    { value: 'stateCode', label: 'State Code'},
    { value: 'stateGSTCode', label: 'GST Code'},
    { value: 'countryName', label: 'Country Name'},
    { value: 'zoneName', label: 'Zone Name'},
    { value: 'status', label: 'Status'}
    ]"
    [searchPerformed]="searchPerformed"
    [defaultSearchType]="'stateName'"
    (onCreateClick)="navigateToCreateState()"
    (onReportClick)="report()"
    (onResetClick)="resetPage()"
    (onSearchClick)="onSearch($event)"
    ></app-listpage>
    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalLengthOfCollection > 0">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered">
                    <!-- Update the table headers to make them sortable -->
<!-- ... previous code remains the same until the table headers ... -->
<thead>
    <tr class="bg-info">
        <th class="bg-transparent text-light" scope="col" width="10%">Action</th>
        <th class="bg-transparent text-light" scope="col" (click)="sort('stateName')">
            State Name
            <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'stateName', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'stateName'}"></i>
        </th>
        <th class="bg-transparent text-light" scope="col" (click)="sort('stateCode')">
            State Code
            <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'stateCode', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'stateCode'}"></i>
        </th>
        <th class="bg-transparent text-light" scope="col" (click)="sort('stateGSTCode')">
            GST Code
            <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'stateGSTCode', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'stateGSTCode'}"></i>
        </th>
        <th class="bg-transparent text-light" scope="col" (click)="sort('countryName')">
            Country
            <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'countryName', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'countryName'}"></i>
        </th>
        <th class="bg-transparent text-light" scope="col" (click)="sort('zoneName')">
            Zone
            <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'zoneName', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'zoneName'}"></i>
        </th>
        
<!-- ... rest of the code remains the same ... -->
        
                            <th class="bg-transparent text-light" scope="col">
                                Status
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of stateList; let i = index; trackBy: trackByStateId">
                            <td>
                                <div class="d-flex align-items-center">
                                    <a class="mx-2 ps-3"
                                        [routerLink]="['/master/state/entry/', item.StateMasterSid]" title="Edit">
                                        <i-feather name="eye" class="feather-sm"></i-feather>
                                    </a>
                                    <a class="text-danger mx-2 ps-3 border-start" (click)="softDelete(item.StateMasterSid)"
                                        title="Delete">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.stateName}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.stateCode}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.stateGSTCode}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.countryName || '-'}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.zoneName || '-'}}</div>
                            </td>
                            <td>
                                @if(item.status === "A"){
                                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Active
                                </div>
                                } @else {
                                <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                    Suspended
                                </div>
                                }
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div>
                <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                    [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
                </ngb-pagination>
            </div>
        </div>
    </div>
    <div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed">
        <div>No records found</div>
    </div>
</div>
