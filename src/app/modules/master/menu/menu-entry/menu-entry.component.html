<div class="row py-3">
    <div class="col-12">
        <div class="d-flex align-items-center gap-2 mb-3">
            <button class="btn btn-sm btn-light-secondary ms-auto">Edit</button>
            <button class="btn btn-sm btn-info">Update</button>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="Name">
                            <label for="text-input" class="input-label">Name <span class="text-danger">*</span></label>
                        </div>
                    </aside>
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="displayName">
                            <label for="text-input" class="input-label">Display Name </label>
                        </div>
                    </aside>
                    <aside class="col-md-12">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="PortType" [items]="modeOfType" bindLabel="name" bindValue="name">
                               
                            </ng-select>
                            <label for="" class="input-label">Type <span class="text-danger">*</span></label>
                        </div>
                    </aside>  
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="fromName">
                            <label for="text-input" class="input-label">Form Name </label>

                        </div>
                    </aside>
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="parent">
                            <label for="text-input" class="input-label">Parent </label>

                        </div>
                    </aside>



                </div>
            </div>
        </div>
    </div>
</div>
