<div class="d-flex justify-content-end mb-2">
  <i
    [ngClass]="isFavorite ? 'fas fa-star fs-5 text-danger' : 'far fa-star fs-5 text-secondary'"
    (click)="toggleFavorite()"
    data-toggle="tooltip"
    data-placement="bottom"
    title="Favorites"
    style="cursor: pointer;">
  </i>
</div>
<div class="row">
    <app-listpage
  [title]="'Charge'"
  [searchOptions]="[
    { value: 'chargeName', label: 'Charge Name' },
    { value: 'chargeCode', label: 'Charge Code' },
    { value: 'Status', label: 'Status' }
  ]"
  [searchPerformed]="searchPerformed"
  [defaultSearchType]="'chargeName'"
  (onCreateClick)="navigateToCreateCharge()"
  (onReportClick)="report()"
  (onResetClick)="resetPage()"
  (onSearchClick)="onSearch($event)">
    </app-listpage>

    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalLengthOfCollection > 0">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered">
                    <thead>
                        <tr class="bg-info">
                            <th class="bg-transparent text-light" scope="col" width="10%">Action</th>
                            <th class="bg-transparent text-light" scope="col" (click)="sort('chargeCode')">
                                Charge Code
                                <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'chargeCode', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'chargeCode'}"></i>
                            </th>
                            <th class="bg-transparent text-light" scope="col" (click)="sort('chargeName')">
                                Charge Name
                                <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'chargeName', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'chargeName'}"></i>
                            </th>
                            <th class="bg-transparent text-light" scope="col" (click)="sort('UOM')">
                                UOM
                                <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'UOM', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'UOM'}"></i>
                            </th>
                            <th class="bg-transparent text-light" scope="col" (click)="sort('SAC')">
                                HSN/SAC
                                <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'SAC', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'SAC'}"></i>
                            </th>
                            <th class="bg-transparent text-light" scope="col" (click)="sort('TDSset')">
                                TDS Set
                                <i class="fas fa-sort ms-1" [ngClass]="{'fa-sort-up': sortDirection === 'asc' && sortColumn === 'TDSset', 'fa-sort-down': sortDirection === 'desc' && sortColumn === 'TDSset'}"></i>
                            </th>
                            <th class="bg-transparent text-light" scope="col" width="10%">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of chargeList; let i = index; trackBy: trackByChargeId">
                            <td>
                                <div class="d-flex align-items-center justify-content-center">
                                    <a class="text-info mx-2" [routerLink]="['/master/charge/entry/', item.ChargeMasterSid]">
                                        <i-feather class="feather-sm text-info" name="eye"></i-feather>
                                    </a>
                                    <a class="text-danger mx-2 ps-3 border-start"
                                        (click)="deleteCharge(item.ChargeMasterSid)">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>
                            <td>{{item.chargeCode}}</td>
                            <td>{{item.chargeName}}</td>
                            <td>{{item.UOM}}</td>
                            <td>{{item.SAC}}</td>
                            <td>{{item.TDSset}}</td>
                            <td>
                                @if(item.Status === "A"){
                                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Active
                                </div>
                                } @else {
                                <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                    Inactive
                                </div>
                                }
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div>
                <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                    [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
                </ngb-pagination>
            </div>
        </div>
    </div>

    <!-- No records found -->
    <div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed">
        <div>No records found</div>
    </div>
</div>
