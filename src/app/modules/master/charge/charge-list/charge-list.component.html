<div class="row">
  <div class="col-12">
    <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm">
      <div class="col-md-4 pb-2">
        <h4 class="page-title mb-0">Charge</h4>
      </div>
      <div class="col-md-8 pb-2">
        <div class="" data-bs-theme="light">
          <form class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
            <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="search()">
              <i class="fas fa-search me-1"></i> Search
            </button>
            <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="navigateToCreateCharge()">
              <i class="fas fa-plus me-1"></i> Create
            </button>
            <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="report()">
              <i class="fas fa-file-alt me-1"></i> Report
            </button>
            <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="resetPage()">
              <i class="fas fa-sync-alt me-1"></i> Reset
            </button>
          </form>
        </div>
      </div>
      <div class="col-md-12 border-top">
        <div class="row mx-0 py-2">
          <div class="col-md-8 mx-auto px-0">
            <form class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0">
              <div class="form-outline col-12 col-md px-0">
                <select [(ngModel)]="searchType" name="searchType" class="form-select">
                  <option value="chargeName">Charge Name</option>
                  <option value="chargeCode">Charge Code</option>
                  <option value="Status">Status</option>
                </select>
              </div>
              <div class="form-outline col-12 col-md px-0">
                <input [(ngModel)]="filterValue" name="filterValue" type="text" class="form-control" placeholder="Enter filter value">
                <i class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalLengthOfCollection > 0">
    <div class="col-12 p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle no-wrap table-bordered">
          <thead>
            <tr class="bg-info">
              <th class="bg-transparent text-light" scope="col">Actions</th>
              <th class="bg-transparent text-light" scope="col">Charge Name</th>
              <th class="bg-transparent text-light" scope="col">Charge Code</th>
              <th class="bg-transparent text-light" scope="col">UOM</th>
              <th class="bg-transparent text-light" scope="col">HSN/SAC</th>
              <th class="bg-transparent text-light" scope="col">TDS Set</th>
              <th class="bg-transparent text-light" scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of chargeList; let i = index; trackBy: trackByIndex">
              <td>
                <div class="d-flex align-items-center">
                  <a class="text-info mx-2" [routerLink]="['/master/charge/entry/', item.ChargeMasterSid]">
                    <i-feather class="feather-sm" name="eye"></i-feather>
                  </a>
                  <a class="text-danger mx-2 ps-3 border-start" (click)="deleteCharge(item.ChargeMasterSid)">
                    <i-feather name="trash-2" class="feather-sm"></i-feather>
                  </a>
                </div>
              </td>
              <td>{{item.chargeName}}</td>
              <td>{{item.chargeCode}}</td>
              <td>{{item.UOM}}</td>
              <td>{{item.SAC}}</td>
              <td>{{item.TDSset}}</td>
              <td>
                @if(item.Status === "A"){
                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                  <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                  Active
                </div>
                } @else {
                <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                  <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                  Inactive
                </div>
                }
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div>
        <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
          [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
        </ngb-pagination>
      </div>
    </div>
  </div>

  <!-- No records found -->
  <div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed">
    <div>No records found</div>
  </div>
</div>
