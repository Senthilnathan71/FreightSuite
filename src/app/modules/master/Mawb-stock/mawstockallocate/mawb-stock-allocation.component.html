<div class="modal-header bg-info text-white p-2">
  <h5 class="modal-title mb-0">
    {{ mode === 'allocate' ? 'Allocate MAWB Stock' : 'Deallocate MAWB Stock' }}
  </h5>
  <button type="button" class="btn-close btn-close-white"
    (click)="cancel()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="allocationForm">
    <!-- =============================== -->
    <!-- Header Selection Section -->
    <!-- =============================== -->
    <div class="row compact-form">
      <!-- Airline Dropdown - Only show in allocate mode -->
      <aside class="col-md-6" *ngIf="mode === 'allocate'">
        <div class="custom-form-group custom-form-group-select" 
          [class.filled]="!!allocationForm.get('airlineId')?.value">
          <ng-select
            formControlName="airlineId"
            [items]="airlineList"
            bindLabel="CustomerName"
            bindValue="CustomerMasterSid"
            placeholder=""
            (change)="loadStock()">
          </ng-select>
          <label class="input-label">
            Airline <span class="text-danger">*</span>
          </label>
          <div class="error-message" 
            *ngIf="allocationForm.get('airlineId')?.touched && allocationForm.get('airlineId')?.errors">
            <span>Required</span>
          </div>
        </div>
      </aside>

      <!-- Customer Dropdown - Full width in deallocate mode -->
      <aside [class.col-md-6]="mode === 'allocate'" [class.col-md-12]="mode === 'deallocate'">
        <div class="custom-form-group custom-form-group-select" 
          [class.filled]="!!allocationForm.get('customerId')?.value">
          <ng-select
            formControlName="customerId"
            [items]="clientlist"
            bindLabel="CustomerName"
            bindValue="CustomerMasterSid"
            placeholder=""
            (change)="loadStock()">
          </ng-select>
          <label class="input-label">
            Customer <span class="text-danger">*</span>
          </label>
          <div class="error-message" 
            *ngIf="allocationForm.get('customerId')?.touched && allocationForm.get('customerId')?.errors">
            <span>Required</span>
          </div>
        </div>
      </aside>
    </div>

    <!-- =============================== -->
    <!-- Stock Table -->
    <!-- =============================== -->
    <div class="card mt-2">
      <div class="card-body p-2">
        <div class="table-responsive">
          <table class="table table-hover align-middle table-bordered table-sm mb-0">
            <thead class="bg-info text-white">
              <tr>
                <th width="50px">Select</th>
                <th>AWB No</th>
                <th>Stock Status</th>
                <th>Available Status</th>
              </tr>
            </thead>
            <tbody formArrayName="stocks">
              <tr *ngFor="let stock of stocksArray.controls; let i = index; trackBy: trackByIndex" 
                [formGroupName]="i">
                <!-- Checkbox - Using formControlName -->
                <td class="text-center">
                  <input type="checkbox" 
                    formControlName="selected">
                </td>

                <!-- AWB -->
                <td>
                  {{ stock.get('MasterBillNumber')?.value }}
                </td>

                <!-- Stock Status -->
                <td>
                  <!-- Allocate Mode → Readonly text -->
                  <span *ngIf="mode === 'allocate'">
                    {{ stock.get('StockStatus')?.value }}
                  </span>

                  <!-- Deallocate Mode → Editable Dropdown - Fixed -->
                  <div *ngIf="mode === 'deallocate'" 
                    class="custom-form-group custom-form-group-select m-0 p-0"
                    [class.filled]="!!stock.get('StockStatus')?.value">
                    <ng-select
                      [formControlName]="'StockStatus'"
                      [items]="stockStatusList"
                      [clearable]="false"
                      [searchable]="false"
                      placeholder="" appendTo="body">
                    </ng-select>
                  </div>
                </td>

                <!-- Available Status -->
                <td>
                  {{ stock.get('AvailableStatus')?.value }}
                </td>
              </tr>

              <!-- Empty State -->
              <tr *ngIf="stocksArray.length === 0">
                <td colspan="4" class="text-center text-muted py-3">
                  No records found
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </form>
</div>

<div class="modal-footer p-2">
  <button class="btn btn-light-secondary btn-sm" 
    (click)="cancel()" 
    [disabled]="loading">
    Cancel
  </button>

  <button class="btn btn-info btn-sm" 
    (click)="confirm()" 
    [disabled]="!hasSelectedStocks() || loading">
    <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
    Confirm
  </button>
</div>
