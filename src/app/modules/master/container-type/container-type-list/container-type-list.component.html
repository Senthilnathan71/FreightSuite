<div class="row py-3">
    <app-listpage
  [title]="'Container Type'"
  [searchOptions]="[
    { value: 'ContainerName', label: 'Container Name' },
    { value: 'ContainerCode', label: 'ContainerCode' },
    { value: 'ContainerIsoCode', label: 'ISO Code' },
    { value: 'ContainerCategory', label: 'Category' },
    { value: 'NoOfTeu', label: 'No of TEU' },
    { value: 'CompanyMasterSid', label: 'Company' },
    { value: 'status', label: 'Status' }
  ]"
  [searchPerformed]="searchPerformed"
  [defaultSearchType]="'ContainerName'"
  (onCreateClick)="navigateToaddNewContainerType()"
  (onReportClick)="report()"
  (onResetClick)="resetPage()"
  (onSearchClick)="onSearch($event)">
    </app-listpage>

    <div class="col-12" *ngIf="totalLengthOfCollection > 0">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle no-wrap table-bordered">
                        <thead>
                            <tr class="bg-info">
                                <th class="bg-transparent text-light" scope="col" width="10%">Actions</th>
                                <th class="bg-transparent text-light" scope="col">Container Name</th>
                                <th class="bg-transparent text-light" scope="col">Container Code</th>
                                <th class="bg-transparent text-light" scope="col">ISO Code</th>
                                <th class="bg-transparent text-light" scope="col">Category</th>
                                <th class="bg-transparent text-light" scope="col">No of TEU</th>
                                <!-- <th class="bg-transparent text-light" scope="col">Company</th> -->
                                <th class="bg-transparent text-light" scope="col" width="10%">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of containerList; let i = index; trackBy: trackByIndex">
                                <td>
                                    <div class="d-flex align-items-center justify-content-center">
                                        <a class="text-info mx-2" class="link mx-2 ps-3"
                                            [routerLink]="['/master/container-type/entry/', item.ContainerTypeMasterSid]">
                                            <i-feather class="feather-sm text-info" name="eye"></i-feather>
                                        </a>
                                        <a class="text-danger mx-2 ps-3 border-start"
                                            (click)="deleteContainerType(item.ContainerTypeMasterSid)">
                                            <i-feather name="trash-2" class="feather-sm"></i-feather>
                                        </a>
                                    </div>
                                </td>
                                <td>
                                    <div class="text-truncate">{{item.ContainerName}}</div>
                                </td>
                                <td>
                                    <div class="text-truncate">{{item.ContainerCode}}</div>
                                </td>
                                <td>
                                    <div class="text-truncate">{{item.ContainerIsoCode}}</div>
                                </td>
                                <td>
                                    <div class="text-truncate">{{item.ContainerCategory}}</div>
                                </td>
                                <td>
                                    <div class="text-truncate">{{item.NoOfTeu}}</div>
                                </td>
                                <!-- <td>
                                    <div class="text-truncate">{{ companyMap[item.CompanyMasterSid] || item.CompanyMasterSid}}</div>
                                </td> -->
                                <td>
                                    @if(item.status === "A"){
                                        <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                            <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                            Active
                                        </div>
                                    } @else {
                                        <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                            <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                            Suspended
                                        </div>
                                    }
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div>
            <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection"
                [pageSize]="pageSize" [(page)]="page" (pageChange)="updatePaginatedData()">
            </ngb-pagination>
        </div>
    </div>
    <!-- No records found -->
    <div class="col-12" *ngIf="totalLengthOfCollection === 0 && searchPerformed">
        <div>No records found</div>
    </div>
</div>
