<div class="row">

    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm">
            <div class="col-md-auto pb-2">
                <h4 class="page-title mb-0">TDS Set</h4>
            </div>

            <div class="col pb-2">
                <form class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0">
                    <div class="form-outline col-12 col-md-auto px-0">
                        <select name="searchType" class="form-select">
                            <option value="departmentName">Department Name</option>
                            <option value="departmentCode">Department Code</option>
                            <option value="departmentType">Department Type</option>
                            <option value="ExportImport">Export/Import</option>
                            <option value="FCLLCL">FCLLCL</option>
                            <option value="status">Status</option>
                        </select>
                    </div>
                    <!-- <div class="form-outline col-12 col-md px-0">
                                <input name="filterValue" type="text" class="form-control"
                                    placeholder="Enter filter value">
                                <i
                                    class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                            </div> -->
                    <div class="d-flex d-md-flex gap-2 col-12 col-md px-0 align-items-center">
                        <div class="form-outline flex-grow-1">
                            <input name="filterValue" type="text" class="form-control" placeholder="Enter filter value">
                            <i
                                class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                        </div>

                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                            <i class="fas fa-search me-1"></i>
                            Search
                        </button>
                    </div>
                </form>
            </div>

            <div class="col-md-auto pb-2">
                <div class="" data-bs-theme="light">
                    <form
                        class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                        <!-- <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                            <i class="fas fa-search me-1"></i>
                            Search
                        </button> -->
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                            (click)="navigateTocreatetdsSet()">
                            <i class="fas fa-plus me-1"></i> Create
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                            <i class="fas fa-file-alt me-1"></i>
                            Report
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                            <i class="fas fa-sync-alt me-1"></i>
                            Reset
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>


    <div class="row bg-white py-2 rounded shadow-sm mx-auto">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered table-sm mb-1">
                    <thead>
                        <tr class="bg-info">
                            <th class="bg-transparent text-light" scope="col" width="10%">Action</th>
                            <th class="bg-transparent text-light" scope="col">TDS Name</th>
                            <th class="bg-transparent text-light" scope="col">Effective Date</th>
                            <th class="bg-transparent text-light" scope="col">Transaction Limit</th>
                            <th class="bg-transparent text-light" scope="col">Annual Limit</th>
                            <th class="bg-transparent text-light" scope="col" width="10%">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (item of [0,1,2,3,4,5,6,7,8]; track $index) {
                        <tr>
                            <td>
                                <div class="d-flex align-items-center justify-content-center">
                                    <a class="text-info mx-2" class="link mx-2 ps-3 ">
                                        <i-feather class="feather-sm text-info" name="eye"></i-feather>
                                    </a>
                                    <a class="text-danger mx-2 ps-3 border-start">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>

                            <td>
                                <div class="text-truncate">OMR</div>
                            </td>
                            <td>
                                <div class="text-truncate">RO</div>
                            </td>
                            <td>
                                <div class="text-truncate">Rial</div>
                            </td>
                            <td>
                                <div class="text-truncate">Rial</div>
                            </td>
                            <td>
                                <span
                                    class="bg-light-success px-2  rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Approved</span>
                            </td>



                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
