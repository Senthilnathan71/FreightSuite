<ngx-spinner bdColor="rgba(0,0,0,0.8)" size="medium" color="#fff" type="ball-scale-ripple">
  <p style="color: white;" class="m-0">Loading...</p>
</ngx-spinner>

<div class="row compact-form">
  <div class="col-12">
    <div class="row bg-white mb-1 align-items-center pt-1 rounded shadow-sm justify-content-between">
      <div class="col pb-1">
        <div class="d-flex align-items-center gap-1">
          <h5 class="page-title mb-0">Tax Group</h5>
          <app-favorite-star screenName="Tax Group" class="mt-1 me-1"></app-favorite-star>
        </div>
      </div>

      <div class="col-md pb-1">
        <form class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0">
          <div class="d-flex gap-2 col-12 px-0 align-items-stretch align-items-md-center">
            <div class="form-outline flex-grow-1 position-relative">
              <input name="filterValue" type="text" [(ngModel)]="filterValue" class="form-control pe-5"
                placeholder="Search" (keyup.enter)="search()">
              <button *ngIf="filterValue"
                class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-3 p-1 text-secondary"
                (click)="clearSearch()" tabindex="0" aria-label="Clear search">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="mt-md-0 mt-1">
              <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="search()">
                <i class="fas fa-search me-1"></i> Search
              </button>
            </div>
          </div>
        </form>
      </div>

      <div class="col-md-auto pb-1">
        <form
          class="d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
          <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="addRow()">
            <i class="fas fa-plus me-1"></i> Add
          </button>

          <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="reset()">
            <i class="fas fa-sync-alt me-1"></i> Reset
          </button>

          <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="report()">
            <i class="fas fa-file-alt me-1"></i> Report
          </button>

          <!-- <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="saveChanges()"
            [disabled]="!hasChanges() || isSaving">
            <i class="fas fa-save me-1"></i> {{ isSaving ? 'Saving...' : 'Save' }}
          </button> -->
          <div class="action-group primary">
  <button class="btn btn-sm dofi-min-w-80 dofi-max-w-80 position-relative"
          [ngClass]="{'btn-info': !hasUnsavedChanges(), 'btn-warning': hasUnsavedChanges()}"
          (click)="saveChanges()"  
          [disabled]="!hasChanges() || isSaving" >
    <i class="fas fa-save me-1"></i>
    <span>{{ isSaving ? "Saving..." : "Save" }}</span> 
    <span *ngIf="hasUnsavedChanges()"
          class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"
          title="You have unsaved changes">
      <span class="visually-hidden">unsaved changes</span>
    </span>
  </button>
</div>
        </form>
      </div>
    </div>
  </div>

  <div class="row bg-white mx-auto rounded  py-1">
    <div class="col-12 p-0" style="width: 80%; margin: 0 auto;">
      <div class="table-responsive table-borderless" >
        <table class="table table-hover align-middle no-wrap mb-0">
          <thead>
            <tr class="bg-info">
              <th class="bg-transparent text-light text-center" style="border-top-left-radius: 10px;" width="2%">
              </th>
              <th class="bg-transparent text-light" width="35%">
                <div class="d-flex align-items-center justify-content-between">
                  <div>Tax Group</div>
                  <div>
                    <i class="{{ getSortIcon('name') }} ms-1" style="opacity: 0.7;font-size: 10px;cursor: pointer;"
                      (click)="sort('name')"></i>
                  </div>
                </div>
              </th>
              <th class="bg-transparent text-light" width="25%">
                <div class="d-flex align-items-center justify-content-between">
                  <div>Tax %</div>
                  <div>
                    <i class="{{ getSortIcon('taxPercent') }} ms-1"
                      style="opacity: 0.7;font-size: 10px;cursor: pointer;" (click)="sort('taxPercent')"></i>
                  </div>
                </div>
              </th>
              <th class="bg-transparent text-light" width="25%" style="border-top-right-radius: 10px;">
                <div class="d-flex align-items-center justify-content-between">
                  <div>Status</div>
                  <div>
                    <i class="{{ getSortIcon('status') }} ms-1" style="opacity: 0.7;font-size: 10px;cursor: pointer;"
                      (click)="sort('status')"></i>
                  </div>
                </div>
              </th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let group of getCurrentData(); let i = index"
              [style.border-left]="(group.hasChanges && group.TaxGroupMasterSid !== undefined) ? '3px solid #ffc107' : ''">
              <td class="text-center " style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                <button type="button" class="btn btn-sm py-0 btn-light" (click)="deleteRow(i)" placement="top"
                  ngbTooltip="Delete"  [disabled]="(!mps.can('delete') )">
                  <i class="fas fa-trash text-danger"></i>
                </button>
              </td>
              <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;" class="pe-5">
                <input type="text" class="custom-input-field sm" [ngModel]="group.name"
                  (ngModelChange)="onNameChange(group, $event)" placeholder="">
              </td>
              <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;" class="pe-5">
                <input type="number" class="custom-input-field sm" [ngModel]="group.taxPercent"
                  (ngModelChange)="onTaxPercentChange(group, $event)" placeholder="" min="0" max="100">
              </td>
              <td class="dofi-max-w-90" style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;" class="pe-5">
                <ng-select [items]="statusOptions" bindLabel="name" bindValue="id" [ngModel]="group.status"
                  (ngModelChange)="onStatusChange(group, $event)" placeholder="" appendTo="body">
                </ng-select>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- No Data Message -->
      <div *ngIf="filteredTaxGroups.length === 0" class="text-center text-muted py-2">
        <i class="fas fa-inbox fa-3x"></i>
        <p>No Records Found</p>
        <p *ngIf="filterValue">Try adjusting your search criteria</p>
      </div>

      <!-- Pagination -->
      <div *ngIf="filteredTaxGroups.length > 0" class="d-flex justify-content-between align-items-center mt-1">
        <div class="text-muted">
          Showing {{ (page - 1) * pageSize + 1 }} to
          {{ mathMin(page * pageSize, totalLengthOfCollection) }} of
          {{ totalLengthOfCollection }} entries
        </div>
        <ngb-pagination [collectionSize]="totalLengthOfCollection" [(page)]="page" [pageSize]="pageSize"
          (pageChange)="onPageChange($event)" [maxSize]="5" [rotate]="true" [boundaryLinks]="true" size="sm">
        </ngb-pagination>
      </div>
    </div>
  </div>
</div>
