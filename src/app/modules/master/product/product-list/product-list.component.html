<div class="row">


    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm">
            <div class="col-md-4 pb-2">
                <h4 class="page-title mb-0">Product</h4>
            </div>
            <div class="col-md-8 pb-2">
                <div class="" data-bs-theme="light">
                    <form
                        class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">

                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="navigateTocreateProduct()">
                            <i class="fas fa-plus me-1"></i> Create
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="report()" [disabled]="!searchPerformed">
                            <i class="fas fa-file-alt me-1"></i>
                            Report
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="reset()" [disabled]="!searchPerformed">
                            <i class="fas fa-sync-alt me-1"></i>
                            Reset
                        </button>
                    </form>
                </div>
            </div>
            <div class="col-md-12  border-top">
                <div class="row mx-0 py-2">
                    <div class="col-md-8 mx-auto px-0">
                        <form
                            class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0">
                            <div class="form-outline col-12 col-md px-0">
                                <select name="searchType" class="form-select" [(ngModel)]="searchType">
                                    <option value="ProductName">Product Name</option>
                                    <option value="ProductCode">Product Code</option>
                                    <option value="ProductType">Product Type</option>
                                    <option value="UOMCode">UOM Code</option>
                                    <option value="HSNCode">HSN Code</option>
                                    <option value="status">Status</option>
                                </select>
                            </div>
                            <!-- <div class="form-outline col-12 col-md px-0">
                                <input name="filterValue" type="text" class="form-control"
                                    placeholder="Enter filter value">
                                <i
                                    class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                            </div>
                            </div>  -->
                            <div class="d-flex d-md-flex gap-2 col-12 col-md px-0 align-items-center">
                                <div class="form-outline flex-grow-1">
                                    <input name="filterValue" type="text" class="form-control"
                                        placeholder="Enter filter value" [(ngModel)]="filterValue">
                                    <i
                                        class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                                </div>

                                <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="onSearch()">
                                    <i class="fas fa-search me-1"></i>
                                    Search
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="row bg-white py-2 rounded shadow-sm mx-auto" *ngIf="totalAmountOfCollection > 0">
        <div class="col-12 p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered">
                    <thead>
                        <tr class="bg-info">
                            <th class="bg-transparent text-light" scope="col" width="10%">Action</th>
                            <th class="bg-transparent text-light" scope="col">Product Name</th>
                            <th class="bg-transparent text-light" scope="col">Product Code</th>
                            <th class="bg-transparent text-light" scope="col">Type</th>
                            <th class="bg-transparent text-light" scope="col">UOM</th>
                            <th class="bg-transparent text-light" scope="col">HSN Code</th>
                            <th class="bg-transparent text-light" scope="col" width="10%">Status</th>

                        </tr>
                    </thead>
                    <tbody>
                        @for (item of slicedProductList; track $index) {
                        <tr>
                            <td>
                                <div class="d-flex align-items-center justify-content-center">
                                    <a class="text-info mx-2" [routerLink]="['/master/product/entry/', item.ProductMasterSId]">
                                        <i-feather class="feather-sm" name="eye"></i-feather>
                                    </a>
                                    <a class="text-danger mx-2 ps-3 border-start" (click)="deleteProductById(item.ProductMasterSId)">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a>
                                </div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.ProductName}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.ProductCode}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.ProductType}}</div>
                            </td>

                            <td>
                                <div class="text-truncate">{{item.UOMCode}}</div>
                            </td>
                            <td>
                                <div class="text-truncate">{{item.HSNCode}}</div>
                            </td>
                            <td>
                                @if(item.status === "A"){
                                <div class="bg-light-success px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                    Active
                                </div>
                                } @else {
                                <div class="bg-light-danger px-2 rounded-pill d-inline-flex align-items-center gap-1">
                                    <span class="dofi-w-4 dofi-h-4 bg-danger d-inline-block rounded"></span>
                                    Suspended
                                </div>
                                }
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
        <div>
        <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalAmountOfCollection" [pageSize]="pageSize"
            [(page)]="page" (pageChange)="updatePaginationData()" [rotate]="true" [ellipses]="false" [maxSize]="5">
        </ngb-pagination>
      </div>
    </div>
    <div class="col-12" *ngIf="totalAmountOfCollection === 0">
        <div class="alert alert-info text-center">No records found</div>
    </div>
</div>
