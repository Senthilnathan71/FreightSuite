<div class="row py-3">
    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
            <div class="col-md-4 pb-2">
                <h4 class="page-title mb-0">Add Product</h4>
            </div>
            <div class="col-md-8 pb-2">
                <div
                    class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-chevron-left me-1"></i>
                        Back
                    </button>
                    <button class="btn btn-sm btn-light-secondary dofi-min-w-80 dofi-max-w-80">
                        <i-feather name="edit-3" class="feather-sm me-1"></i-feather> Edit
                    </button>
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-sync-alt me-1"></i>
                        Reset
                    </button>
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-save me-1"></i>
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-12">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">

                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Product Name <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Product Code <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Product LL <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>


                    <aside class="col-md-3">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="" [items]="modeOfUOM" bindLabel="name" bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">UOM <span class="text-danger"></span></label>
                        </div>
                    </aside>

                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Product ID <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Packing Group <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Description <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>


                    <aside class="col-md-3">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="" [items]="modeOfProductType" bindLabel="name"
                                bindValue="name">
                                
                            </ng-select>
                            <label for="" class="input-label">Product Type <span class="text-danger"></span></label>
                        </div>
                    </aside>
                   
                </div>
            </div>
        </div>
    </div>

 
     <div class="col-md-12 mt-2">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">

                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">UN No <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">UN Packing Code <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="commodityCode">
                            <label for="text-input" class="input-label">IMO Class <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>

                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">IMO Sub Class <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">UN Packing Code <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Flash Point <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>                   
                </div>
            </div>
        </div>
    </div>


</div>
