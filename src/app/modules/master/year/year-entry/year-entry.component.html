<form [formGroup]="yearForm">
    <div class="row">
        <div class="col-12">
            <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
                <div class="col-md-4 pb-2">
                    <h4 class="page-title mb-0">Year</h4>
                </div>
                <div class="col-md-8 pb-2">
                    <div
                        class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                        <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                            (click)="navigateBack()">
                            <i class="fas fa-chevron-left me-1"></i>
                            Back
                        </button>
                        <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" (click)="resetForm()">
                            <i class="fas fa-sync-alt me-1"></i>
                            Reset
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                            (click)="onSubmit()">
                            <i class="fas fa-save me-1"></i>
                            Save
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-12">
            <div class="card h-100">
                <div class="card-body">
                    <div class="row">

                        <aside class="col-md-4">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                    formControlName="Name">
                                <label for="text-input" class="input-label">Name <span
                                        class="text-danger">*</span></label>
                                <div class="error-message"
                                    *ngIf="yearForm.get('Name')?.touched && yearForm.get('Name')?.hasError('required')">
                                    Name is required
                                </div>
                            </div>
                        </aside>
                        <aside class="col-md-4">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                    formControlName="Code">
                                <label for="text-input" class="input-label">Code <span
                                        class="text-danger">*</span></label>
                                <div class="error-message"
                                    *ngIf="yearForm.get('Code')?.touched && yearForm.get('Code')?.hasError('required')">
                                    Code is required
                                </div>
                            </div>
                        </aside>
                        <aside class="col-md-4">
                            <div class="custom-form-group">
                                <input type="date" id="text-input" placeholder="" class="custom-input-field sm"
                                    formControlName="StartDate">
                                <label for="text-input" class="input-label">Start Date <span
                                        class="text-danger">*</span></label>
                                <div class="error-message"
                                    *ngIf="yearForm.get('StartDate')?.touched && yearForm.get('StartDate')?.hasError('required')">
                                    Start Date is required
                                </div>
                            </div>
                        </aside>


                        <aside class="col-md-4">
                            <div class="custom-form-group">
                                <input type="date" id="text-input" placeholder="" class="custom-input-field sm"
                                    formControlName="EndDate">
                                <label for="text-input" class="input-label">End Date <span
                                        class="text-danger">*</span></label>
                                <div class="error-message"
                                    *ngIf="yearForm.get('EndDate')?.touched && yearForm.get('EndDate')?.hasError('required')">
                                    End Date is required
                                </div>
                            </div>
                        </aside>

                        <aside class="col-md-4">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                    formControlName="CurrentYear">
                                <label for="text-input" class="input-label">Current Year <span
                                        class="text-danger">*</span></label>
                                <div class="error-message"
                                    *ngIf="yearForm.get('CurrentYear')?.touched && yearForm.get('CurrentYear')?.hasError('required')">
                                    Current Year is required
                                </div>
                            </div>
                        </aside>

                        <aside class="col-md-4">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                    formControlName="YearEndCompl">
                                <label for="text-input" class="input-label">Year End Completed <span
                                        class="text-danger">*</span></label>
                                <div class="error-message"
                                    *ngIf="yearForm.get('YearEndCompl')?.touched && yearForm.get('YearEndCompl')?.hasError('required')">
                                    Year End Completed is required
                                </div>
                            </div>
                        </aside>
                        <aside class="col-md-4">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                    formControlName="Remarks">
                                <label for="text-input" class="input-label">Remarks<span
                                        class="text-danger"></span></label>

                            </div>
                        </aside>

                        <aside class="col-md-4">
                            <div class="custom-form-group custom-form-group-select">
                                <ng-select formControlName="Status" [items]="modeOfStatus" bindLabel="name"
                                    bindValue="name">
                                </ng-select>
                                <label for="" class="input-label">Status <span class="text-danger"></span></label>
                                <div class="error-message"
                                    *ngIf="yearForm.get('Status')?.touched && yearForm.get('Status')?.hasError('required')">
                                    Status is required
                                </div>
                            </div>
                        </aside>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
