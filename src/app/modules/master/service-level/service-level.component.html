<div class="row compact-form">
    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
            <div class="col-md-4 pb-2">
                  <div class="d-flex align-items-center gap-2">
                         <div class="brand-icon">
                       <i class="fas fa-cogs"></i>

                    </div>
                <h5 class="page-title mb-0 text-info"> Service Level</h5>
                </div>
            </div>
            <div class="col-md-8 pb-2">
                <div
                    class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                        (click)="navigateBack()">
                        <i class="fas fa-chevron-left me-1"></i>
                        Back
                    </button>
                    <!-- <button class="btn btn-sm btn-light-secondary dofi-min-w-80 dofi-max-w-80">
                        <i-feather name="edit-3" class="feather-sm me-1"></i-feather> Edit
                    </button> -->
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-sync-alt me-1"></i>
                        Reset
                    </button>
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-save me-1"></i>
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-12">
        <div class="card h-100 mb-0">
           <div class="card-body py-3 px-4">
                        <div class="row compact-form pb-3 rounded shadow-sm">
                             <div class="card-header-title d-flex align-items-center gap-2">
                     <i class="fas fa-cogs fs-4"></i>
                        <h6 class="card-titlename mb-0">Service Level Information</h6>
                    </div>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="commodityName">
                            <label for="text-input" class="input-label">Name <span class="text-danger">*</span></label>
                        </div>
                    </aside>
                    <aside class="col-md-6">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="commodityCode">
                            <label for="text-input" class="input-label">Code <span class="text-danger">*</span></label>
                        </div>
                    </aside>

                    <aside class="col-md-4 mt-md-2 mt-0">
                        <div class="form-check form-check-inline p-0 me-5">
                            <div class="form-check">
                                <input type="checkbox" id="DoorToDoor" class="form-check-input">
                                <label for="DoorToDoor" class="form-check-label">Door to Door</label>
                            </div>
                        </div>
                    </aside>
                    <aside class="col-md-4 mt-md-2 mt-0">
                         <div class="form-check form-check-inline p-0 me-5">
                        <div class="form-check">
                            <input type="checkbox" id="IsSea" class="form-check-input">
                            <label for="IsSea" class="form-check-label">Is Sea</label>
                        </div>
                    </div>
                    </aside>
                    <aside class="col-md-4 mt-md-2 mt-0">
                         <div class="form-check form-check-inline p-0 me-5">
                        <div class="form-check">
                            <input type="checkbox" id="IsAir" class="form-check-input">
                            <label for="IsAir" class="form-check-label">Is Air</label>
                        </div>
                    </div>
                    </aside>
                   



                    <aside class="col-md-4 mt-2">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="PortType" [items]="modeOfStatus" bindLabel="name"
                                bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">Status <span class="text-danger">*</span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4 pt-2">
                        <div class="custom-form-group">
                            <textarea id="" placeholder="" rows="1" class="custom-input-field sm"
                                formControlName="Remarks"></textarea>
                            <label for="text-input" class="input-label">Remarks </label>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </div>
</div>
