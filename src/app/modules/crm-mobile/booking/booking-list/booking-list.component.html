<section class="ticket light my-3" *ngFor="let item of bookingLis; trackBy: trackByBookingId">
  <aside class="ticket-body">
    <div class="d-flex justify-content-between mb-3">
      <div>
        <h6 class="fw-bold mb-0">{{item.BookingNo}}</h6>
        <div class="text-muted small">Booking Number</div>

      </div>
      <div class="text-end">
        <div class="fw-bold text-info">{{getDepartmentName(item.DepartmentMasterSid)}}</div>
        <div class="text-muted small">Booking Type</div>

      </div>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="text-start">
        <div class="fw-bold"> <i class="fas fa-ship me-1"></i>{{item.POL}}</div>
        <div class="text-muted small">{{item.ETA | date:'short'}}</div>
      </div>
      <div class="journey-lined flex-grow-1 mx-3">
        <div class="text-muted small text-center">Direct</div>
      </div>
      <div class="text-end">
        <div class="fw-bold"><i class="fas fa-ship me-1"></i>{{item.POD}}</div>
        <div class="text-muted small">{{item.ETD | date:'short'}}</div>
      </div>
    </div>

  </aside>
  <aside class="footer p-2  me-3">
    <div class="d-flex gap-2 align-items-center justify-content-end">
      <button class="veiw-btn">View Details</button>
    </div>
  </aside>
</section>
