<div class="row">
    <div class="col-12">
        <div class="rounded-3 p-2 bg-body-tertiary shadow mb-2">
            <form action="" class="d-flex align-items-center gap-2">
                <div class="form-outline col">
                    <input type="search" class="form-control ps-5"  name="search"  autocomplete="off" placeholder="Search">
                    <i class="fas fa-search ms-3"></i>
                </div>
                <button type="button" class="btn btn-info btn-sm" >
                    <i class="mdi mdi-plus"></i> Add
                </button>
            </form>
        </div>
    </div>
    <div class="col-12">
        <div class="table-responsive">
            <table class="table table-hover align-middle no-wrap table-bordered">
                <thead>
                    <tr class="bg-info">
                        <th class="bg-transparent text-light" scope="col">Effective From</th>
                        <th class="bg-transparent text-light" scope="col">From Currency</th>
                        <th class="bg-transparent text-light" scope="col">To Currency</th>
                        <th class="bg-transparent text-light" scope="col">Sell Rate</th>
                        <th class="bg-transparent text-light" scope="col">Buy Rate</th>
                        <th class="bg-transparent text-light" scope="col">Bank Name</th>
                        <th class="bg-transparent text-light" scope="col">Remarks</th>
                        <th class="bg-transparent text-light" scope="col">Status</th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of [0,1,2,3,4,5,6,7,8]; track $index) {
                        <tr>
                            <td>
                                <div class="text-truncate">1-Mar-25</div>
                            </td>
                            <td>
                                <div class="text-truncate">USD</div>
                            </td>
                            <td>
                                <div class="text-truncate">INR</div>
                            </td>
                            <td>
                                <div class="text-truncate">87.65</div>
                            </td>
                            <td>
                                <div class="text-truncate">87.56</div>
                            </td>
                            <td>
                                <div class="text-truncate">N/A</div>
                            </td>
                            <td>
                                <div class="text-truncate">N/A</div>
                            </td>
                            <td>
                                <div class="text-truncate">Active</div>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
