<div class="row">
    <div class="col-12">
        <div class="card bg-info-subtle">
            <div class="card-body">
                <ng-container *ngTemplateOutlet="QuoteInfo"></ng-container>
                
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <ng-container *ngTemplateOutlet="QuoteTablePrimary"></ng-container>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- #region QuoteInfo -->
<ng-template #QuoteInfo>
    <div class="row  pb-3">
                    
        <div class="col-6 col-md">
            <span>Quote No.:</span>
            <h5 class="mt-2">#35972</h5>
        </div>

        <div class="col-6 col-md text-end text-md-start">
            <span>Enq. No.:</span>
            <h5 class="mt-2">#648</h5>
        </div>
        

        <div class="col-6 col-md">
            <span>Quote Dt.
                
            </span>
            <h5 class="mt-2"><i class="mdi mdi-calendar me-1 text-dark fs-5"></i> 
                Feb 1, 2025 </h5>
        </div>

        <div class="col-6 col-md text-end text-md-start">
            <span>Status</span>
            <h5 class="mt-2">
                <span class="badge bg-warning font-medium px-3">
                    Hold
                </span>
            </h5>
        </div>

        <div class="col-12 col-md">
            <span>Customer</span>
            <h5 class="mt-2"><i class="mdi mdi-account me-1 text-dark fs-5"></i> Hikushima</h5>
        </div>
    </div>
</ng-template>
<!-- #endregion -->

<!-- #region QuoteTablePrimary -->
<ng-template #QuoteTablePrimary>
    <table class="table table-bordered table-hover no-wrap align-middle">
        <thead>
            <tr>
                <th class="bg-info-subtle p-1">POR</th>
                <th class="bg-info-subtle p-1">POL</th>
                <th class="bg-info-subtle p-1">POD</th>
                <th class="bg-info-subtle p-1">FPOD</th>
                <th class="bg-info-subtle p-1">Carrier</th>
                <th class="bg-info-subtle p-1">Eff . Date</th>
                <th class="bg-info-subtle p-1">Exp. Date</th>
                <th class="bg-info-subtle p-1">Status</th>
                <th class="bg-info-subtle p-1">20ft</th>
                <th class="bg-info-subtle p-1">40ft</th>						
            </tr>
        </thead>
        <tbody>
           
                <tr>
                    <td class="p-1">INMAA</td>
                    <td class="p-1">INMAA</td>
                    <td class="p-1">AEJEA</td>
                    <td class="p-1">AEJEA</td>
                    <td class="p-1">Mearsj</td>
                    <td class="p-1">1-Jan-25</td>
                    <td class="p-1">10-Feb-25</td>
                    <td class="p-1">
                        <span class="badge bg-success font-medium px-3"> Approved </span>
                    </td>
                    <td class="p-1">
                        1
                    </td>
                    <td class="p-1">
                        0
                    </td>
                </tr>
                
                <tr>
                    <td colspan="10" class="p-0">
                        <ng-container *ngTemplateOutlet="QuoteTableSecondary"></ng-container>
                        
                    </td>
                </tr>
            
        </tbody>
    </table>
</ng-template>
<!-- #endregion -->

<!-- #region QuoteTableSecondary -->
<ng-template #QuoteTableSecondary>
    <table class="table table-bordered table-hover no-wrap align-middle mb-0">
        <thead>
            <tr>
                <th class="bg-secondary-subtle p-1">Charge</th>
                <th class="bg-secondary-subtle p-1">Unit</th>
                <th class="bg-secondary-subtle p-1">Curr</th>
                <th class="bg-secondary-subtle p-1">20ft</th>
                <th class="bg-secondary-subtle p-1">40ft</th>
            </tr>
        </thead>
        <tbody>
            
            <tr>
                <td class="p-1">FRT</td>
                <td class="p-1">USD</td>
                <td class="p-1">USD</td>
                <td class="p-1">450</td>
                <td class="p-1">600</td>
            </tr>

            <tr>
                <td class="p-1">THC</td>
                <td class="p-1">INR</td>
                <td class="p-1">INR</td>
                <td class="p-1">2200</td>
                <td class="p-1">3500</td>
            </tr>
        
        </tbody>
    </table>
</ng-template>
<!-- #endregion -->
