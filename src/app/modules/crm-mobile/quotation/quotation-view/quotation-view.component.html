<ngx-spinner bdColor="rgba(0,0,0,0.8)" size="medium" color="#fff" type="ball-scale-ripple" [fullScreen]="true">
    <p style="color: white;" class="m-0">Loading...</p>
</ngx-spinner>

<div class="nav-pills-container">
    <div class="nav-pills">
        <div class="nav-pill" *ngFor="let tab of tabs" [class.active]="selectedTab === tab.name"
            (click)="selectTab(tab.name)">
            <div class="pill-icon">
                <i [class]="tab.icon"></i>
            </div>
            <span class="pill-label">{{ tab.name }}</span>
            <div class="pill-indicator" *ngIf="selectedTab === tab.name"></div>
        </div>
    </div>
</div>


<div class="content-workspace">
    <div class="workspace-content" [hidden]="selectedTab !== 'Pending Enquiry'">
        <div class="row compact-form">
            <div class="col-12">
                <app-page-header [title]="'Pending Enquiry'" [showFavorite]="false" [showSearch]="true" [searchPlaceholder]="'Search'"
                    [searchButtonText]="'Search'" [(searchValue)]="enquiryManager.filterValue" [actions]="enquiryHeaderActions"
                    [autoSearchOnFilterChange]="true"
                    [dateRangeConfig]="enquiryDateRangeConfig"
                    [dateTypeConfig]="enquiryDateTypeConfig"
                    [partyFilterConfig]="enquiryPartyFilterConfig"
                    [departmentFilterConfig]="enquiryDepartmentFilterConfig"
                    [polFilterConfig]="enquiryPolFilterConfig"
                    [podFilterConfig]="enquiryPodFilterConfig"
                    [partySearchFn]="partySearchFn"
                    (departmentFilterChanged)="onEnquiryDepartmentFilterChanged($event)"
                    (advancedSearchTriggered)="onEnquiryAdvancedSearch($event)"
                    (searchTriggered)="onEnquirySearchTriggered($event)" (searchCleared)="enquiryResetPage()"
                    (actionTriggered)="onEnquiryActionTriggered($event)">
                </app-page-header>
            </div>
            <div class="col-12">
                <div>
                    <app-reusable-table #enquiryTable [config]="enquiryTableConfig" [data]="enquiryManager.items"
                        [loading]="enquiryManager.loading" 
                        [totalRecords]="enquiryManager.totalRecords" 
                        [paginationConfig]="enquiryManager.enquiryPaginationConfig"
                        (actionClick)="onEnquiryTableActionClick($event)"
                        (rowClick)="onEnquiryTableRowClick($event)" (sortChange)="enquiryManager.onSortChange($event)"
                        (pageChange)="enquiryManager.onPageChange($event)" (pageSizeChange)="enquiryManager.onPageSizeChange($event)">
                    </app-reusable-table>
                </div>
            </div>
        </div>
    </div>
    <div class="workspace-content" [hidden]="selectedTab !== 'Quotation'">
        <div class="row compact-form">
            <!-- #region Search Panel -->
            <div class="col-12">
                <app-page-header [title]="'Quotation'" [showFavorite]="true" [showSearch]="true" [searchPlaceholder]="'Search'"
                    [searchButtonText]="'Search'" [(searchValue)]="quotationManager.filterValue" [actions]="quotationHeaderActions"
                    [autoSearchOnFilterChange]="true"
                    [dateRangeConfig]="quotationDateRangeConfig"
                    [dateTypeConfig]="quotationDateTypeConfig"
                    [partyFilterConfig]="quotationPartyFilterConfig"
                    [departmentFilterConfig]="quotationDepartmentFilterConfig"
                    [polFilterConfig]="quotationPolFilterConfig"
                    [podFilterConfig]="quotationPodFilterConfig"
                    [extraFilterConfig]="quotationApprovalStatusFilterConfig"
                    [partySearchFn]="partySearchFn"
                    (departmentFilterChanged)="onQuotationDepartmentFilterChanged($event)"
                    (advancedSearchTriggered)="onQuotationAdvancedSearch($event)"
                    (searchTriggered)="onQuotationSearchTriggered($event)" (searchCleared)="quoteResetPage()"
                    (actionTriggered)="onQuotationActionTriggered($event)">
                </app-page-header>
                <!-- #endregion -->
                <div class="col-12">
                    <div>
                        <app-reusable-table 
                            #quotationTable 
                            [config]="quotationTableConfig" 
                            [data]="quotationManager.items" 
                            [loading]="quotationManager.loading"
                            [paginationConfig]="quotationManager.quotationPaginationConfig"
                            [totalRecords]="quotationManager.totalRecords"
                            (actionClick)="onQuotationTableActionClick($event)" (rowClick)="onQuotationTableRowClick($event)"
                            (sortChange)="quotationManager.onSortChange($event)" (filterChange)="onQuotationTableFilterChange($event)"
                            (pageChange)="quotationManager.onPageChange($event)" (pageSizeChange)="quotationManager.onPageSizeChange($event)">
                        </app-reusable-table>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- NO DATA TEMPLATE -->
    <ng-template #noDataTemplate>
        <div class="text-center py-5">
            <p class="text-muted">No data available.</p>
        </div>
    </ng-template>
