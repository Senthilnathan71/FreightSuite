<div>
    <div class="d-flex justify-content-between align-items-center px-5 py-3">
        <h4 class="m-0">Package Type Entry</h4>
        <div class="d-flex gap-2">
           
            <button type="button" class="btn btn-info btn-sm" >
                <i class="bi bi-arrow-down-right"></i> Add
            </button>
            <button type="button" class="btn btn-info btn-sm" >
                <i class="bi bi-arrow-down-right"></i> Close
            </button>
            <button type="button" style="border: none;outline: none; background-color:#e7e7ea;" >
                <i class="bi bi-arrow-down-right"></i> Action
            </button>
        </div>
    </div>
    <hr class="m-0">
    <div class="row py-3">
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <div class="row">
                        <!-- <h6 class="card-title mb-0">Basic Info</h6> -->
                        <aside class="col-md-6">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="commodityName" >
                                <label for="text-input" class="input-label">Name <span class="text-danger">*</span></label>    
                            </div>
                        </aside>
                        <aside class="col-md-6">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="commodityCode" >
                                <label for="text-input" class="input-label">Code <span class="text-danger">*</span></label>
                            </div>
                        </aside>
                        <aside class="col-md-8">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="HsCode" >
                                <label for="text-input" class="input-label">Arabic Name <span class="text-danger">*</span></label>
                                
                            </div>
                        </aside>
                        <aside class="col-md-4">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="Unit" >
                                <label for="text-input" class="input-label">Status <span class="text-danger">*</span></label>
                               
                            </div>
                        </aside>
                        <aside class="col-md-12 pt-2">
                            <div class="custom-form-group">
                                <textarea id="" placeholder="" rows="" class="input-field sm" formControlName="Remarks"></textarea>
                                <label for="text-input" class="input-label">Remarks </label>
                            </div>
                        </aside>
                        
                       
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <div class="row">
                        <!-- <h6 class="card-title mb-0">Basic Info 2</h6> -->
                        <aside class="col-md-12">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="MinTemp" >
                                <label for="text-input" class="input-label">Malaysia EDI <span class="text-danger">*</span></label>
                               
                            </div>
                        </aside>
                        <aside class="col-md-12">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="Max Temp" >
                                <label for="text-input" class="input-label">India EDI <span class="text-danger">*</span></label>
                               
                            </div>
                        </aside>
                        <aside class="col-md-12">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="Status" >
                                <label for="text-input" class="input-label">Srilanka EDI <span class="text-danger">*</span></label>
                               
                            </div>
                        </aside>   
                        <aside class="col-md-12">
                            <div class="custom-form-group">
                                <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="Status" >
                                <label for="text-input" class="input-label">UAE EDI <span class="text-danger">*</span></label>
                               
                            </div>
                        </aside>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
  
</div>
