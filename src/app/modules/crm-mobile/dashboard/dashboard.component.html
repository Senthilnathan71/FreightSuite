    <div class="col-12">
        @for (item of menuItems; track $index) {
        <section class="menu-card" [ngClass]="item.category">
            <a [routerLink]="item.link">
                <div class="d-flex align-items-center justify-content-between">
                    <div class="menu-name fw-bold fs-6">{{ item.name }}</div>
                    <div class="d-flex align-items-center gap-2">
                        @if (item.badge) {
                        <span class="badge bg-danger sidebar-badge rounded-pill">{{ item.badge }}</span>
                        }
                        <div class="link-external">
                            <i-feather class="feather-sm" name="arrow-up-right"></i-feather>
                        </div>
                    </div>
                </div>
            </a>
        </section>
        }
    </div>
</div>
