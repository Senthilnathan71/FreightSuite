<ngx-spinner
  bdColor="rgba(0,0,0,0.8)"
  size="medium"
  color="#fff"
  type="ball-scale-ripple"
  [fullScreen]="true">
  <p style="color: white;" class="m-0">Loading...</p>
</ngx-spinner>

<div class="row">
    <!-- #region Search Panel -->
       <div class="col-12">
        <div class="row bg-white mb-1 align-items-center pt-2 rounded shadow-sm justify-content-between">
            <div class="col-md-4 pb-1">
                <div class="d-flex align-items-center gap-2">
                    <h4 class="page-title mb-0">Lead</h4>
                <app-favorite-star screenName="Zone" class="mt-1 me-1"></app-favorite-star>
                </div>
                
            </div>

            <div class="col-md pb-1 compact-form">
                <form class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0">
                    <div class="d-flex gap-2 col-12  px-0 align-items-stretch align-items-md-center">
                        <div class="form-outline flex-grow-1 position-relative">
                            <input name="filterValue" type="text" class="form-control pe-5" placeholder="Search"
                                [(ngModel)]="searchText" name="search" aria-label="Search input" (input)="searchLeads()">

                            <button *ngIf="searchText"
                                class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-3 p-1 text-secondary"
                               (input)="searchLeads()"  tabindex="0" aria-label="Clear search"
                                data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Clear search"
                                onfocus="this.classList.replace('text-secondary','text-danger')"
                                onblur="this.classList.replace('text-danger','text-secondary')">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="mt-md-0 mt-1">
                            <button type="submit"  (click)="clearSearchText()"
                                class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                                <i class="fas fa-search me-1"></i> Search
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="col-md-auto pb-1">
                <form
                    class=" d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                       (click)="createNew()">
                        <i class="fas fa-plus me-1"></i> Create
                    </button>
                      <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                            >
                            <i class="fas fa-file-alt me-1"></i>
                            Report
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                            >
                            <i class="fas fa-sync-alt me-1"></i>
                            Reset
                        </button>
                </form>
            </div>


        </div>
    </div>
    <div class="col-12 d-none">
        <div class="bg-white rounded-3 p-2  shadow mb-2 " data-bs-theme="light">
            <form class="d-flex align-items-center gap-2">
                <div class="form-outline col position-relative">
                    <input type="search" class="form-control ps-5" [(ngModel)]="filterValue" name="search"
                        autocomplete="off" placeholder="Search" (keyup.enter)="searchlead()">
                    <i class="fas fa-search ms-3 position-absolute start-0 top-50 translate-middle-y"></i>
                    <!-- Clear button (X) when there's text -->
                    <button *ngIf="searchText" type="button" class="btn btn-sm position-absolute end-0 top-50 translate-middle-y me-2" 
                            (click)="searchlead()" style="background: none; border: none;">
                        <i class="fas fa-times text-muted"></i>
                    </button>
                </div>
                <button type="button" class="btn btn-info btn-sm" (click)="createNew()">
                    <i class="mdi mdi-plus" [class.me-1]="!isMobile"></i>
                    @if (!isMobile) {
                    Create New Lead
                    }
                </button>
            </form>
        </div>
    </div>
    <!-- #endregion -->
    <div class="col-12 px-0">
        <div *ngIf="isMobile; else desktopTemplate">
            <ng-container *ngTemplateOutlet="mobileTemplate"></ng-container>
        </div>
    </div>
</div>


<!-- MOBILE CODE -->
<ng-template #mobileTemplate>
     
    <div class="mobile-view" *ngIf="totalLengthOfCollection > 0; else noDataTemplate">
        <div class="card" *ngFor="let lead of leads">
            <div class="card-body">
                <div class="d-flex flex-column gap-2 position-relative">
                    <div class="d-flex align-items-center fw-bold dofi-font-16 text-uppercase">
                        <div class="text-truncate">
                            {{ lead.preCustomerName }}
                        </div>

                        <span class="ms-auto badge dofi-min-w-12 dofi-h-12 rounded-pill px-0 py-0" [ngClass]="{
                                'bg-success': lead.status === 'A',
                                'bg-danger': lead.status === 'S',
                                'bg-warning': lead.status !== 'A' && lead.status !== 'S'
                              }">&nbsp;</span>

                    </div>
                    <div class="d-flex align-items-center">
                        <i-feather name="user" class="feather-sm"></i-feather>
                        <div class="ms-2">{{ lead.contactPerson }}</div>
                        <div class="ms-auto d-flex align-items-center gap-1">

                            <a class="text-info" (click)="viewLead(lead.PreCustomerMasterSid)">
                                <i-feather name="eye" class="feather-sm"></i-feather>
                            </a>
                        </div>
                    </div>
                    <div class="d-flex align-items-center">
                        <i-feather name="smartphone" class="feather-sm"></i-feather>
                        <div class="ms-2">{{ lead.phone }}</div>
                    </div>
                    <div class="d-flex align-items-center">
                        <i-feather name="map-pin" class="feather-sm"></i-feather>
                        <div class="ms-2">{{ lead.preCustomerAddress1 }}</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-body">
            <!-- #region Pagination -->
            <ngb-pagination class="d-flex justify-content-end" [collectionSize]="totalLengthOfCollection" [pageSize]="pageSize"
                [(page)]="page" (pageChange)="updatePaginatedData()">
            </ngb-pagination>
            <!-- #endregion -->
        </div>
    </div>
</ng-template>

<!-- DESKTOP CODE -->
<ng-template #desktopTemplate>
     <app-reusable-table
        #leadTable
        [config]="tableConfig"
        [data]="allleads"
        [loading]="tableLoading"
        [totalRecords]="totalLengthOfCollection"
        [paginationConfig]="paginationConfig"
        (actionClick)="onTableActionClick($event)"
        (rowClick)="onTableRowClick($event)"
        (sortChange)="onTableSortChange($event)"
        (filterChange)="onTableFilterChange($event)"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)">
    </app-reusable-table>

<!-- NO DATA TEMPLATE -->
<ng-template #noDataTemplate>
    <div class="text-center py-5">
        <p class="text-muted" *ngIf="searchPerformed">No leads found.</p>
       
    </div>
</ng-template>

<ng-template #scheduleTemplate let-lead>
  <div class="text-truncate text-center">
    <button class="btn btn-sm btn-light-success p-1" (click)="createMeeting(lead.PreCustomerMasterSid)">
      <i-feather name="calendar" class="feather-sm"></i-feather> Schedule
    </button>
  </div>
</ng-template>
