<div class="row">
    <!-- #region Search Panel -->
    <div class="col-12 d-flex align-items-stretc">
        <div class="card gredient-info-bg text-white card-hover w-100">
            <div class="card-body">
                <h4 class="card-title">Search</h4>
                <form class="">
                    <div class="form-outline col">
                        <input type="search" class="form-control ps-5" [(ngModel)]="searchText" name="search"
                            (input)="searchLeads()" autocomplete="off" placeholder="Search">
                        <i class="fas fa-search ms-3"></i>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- #endregion -->

    <div class="col-12">
        <div class="card">
            <!-- #region lead view -->
            <div class="table-responsive">
                <table class="table table-hover align-middle no-wrap table-bordered mobile-table">
                    <thead>
                        <tr class="gredient-info-bg">
                            <th class="bg-transparent text-light" scope="col">Name</th>
                            <th class="bg-transparent text-light" scope="col">Address</th>
                            <th class="bg-transparent text-light" scope="col">Phone</th>
                            <th class="bg-transparent text-light" scope="col">Last Meet</th>
                            <!-- <th class="bg-transparent text-light" scope="col">Last Booking</th> -->
                            <th class="bg-transparent text-light" scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let customer of customerItems">
                            <td data-label="Company">
                                <div class="text-truncate">
                                    {{ customer.CustomerName }}
                                </div>
                            </td>
                            <td data-label="Address">
                                <div class="text-truncate">
                                    <i-feather name="map-pin" class="feather-sm"></i-feather> {{
                                    customer.PreCustomerAddress1 }}
                                </div>
                            </td>
                            <td data-label="Phone">
                                <div class="text-truncate">
                                    <i-feather name="phone" class="feather-sm"></i-feather> {{
                                    customer.preCustomerMaster.phone }}
                                </div>
                            </td>
                            <td data-label="Last Meet">{{ customer.preCustomerMaster.preCustomerMeeting['0'].meetingDate
                                }}</td>
                            <!-- <td data-label="Last Booking">{{ customer.lastBooking }}</td> -->

                            <td data-label="Action">
                                <section class="action-items">
                                    <a class="text-info mx-2">
                                        <i-feather name="eye" class="feather-sm"></i-feather>
                                    </a>


                                    <!-- <a href="javascript:void(0)" class="text-danger mx-2 ps-3 border-start">
                                        <i-feather name="trash-2" class="feather-sm"></i-feather>
                                    </a> -->
                                </section>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- #endregion -->
        </div>
    </div>
</div>
