<div class="row">
    <div class="col-8">
        <div class="card">
            <div class="card-body">
                <section class="row">
                    <h6 class="card-title mb-0">Basic Information</h6>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" class="custom-input-field sm" placeholder=" " />
                            <label for="text-input" class="input-label">UOM Name</label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" class="custom-input-field sm" placeholder=" " />
                            <label for="text-input" class="input-label">UOM Code</label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select [multiple]="true" [(ngModel)]="selectedShipmentType">
                                @for (shipmenttype of shipmenttypes; track shipmenttype.id) {
                                    <ng-option [value]="shipmenttype.id">{{shipmenttype.name}}</ng-option>
                                }
                            </ng-select>
                            <label for="text-input" class="input-label">Shipment Type</label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" class="custom-input-field sm" placeholder=" " />
                            <label for="text-input" class="input-label">Diemension</label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" class="custom-input-field sm error" placeholder=" " />
                            <label for="text-input" class="input-label">Vol</label>
                            <p class="error-message">Invalid input</p>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" class="custom-input-field sm" placeholder=" " />
                            <label for="text-input" class="input-label">Weight</label>
                        </div>
                    </aside>
                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <textarea id="textarea-input" class="input-field sm" placeholder="" rows="1"></textarea>
                            <label for="text-input" class="input-label">Remarks</label>
                        </div>
                    </aside>
                </section>
            </div>
        </div>
    </div>
</div>
