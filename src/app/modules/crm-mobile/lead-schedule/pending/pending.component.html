<div class="row">
    <div class="col-12">
        <!-- #region pending -->
        <div class="table-responsive">
            <table class="table table-hover align-middle no-wrap table-bordered mobile-table">
                <thead>
                    <tr class="bg-info">
                        <th class="bg-transparent text-light" scope="col">Customer Name</th>
                        <th class="bg-transparent text-light" scope="col">City</th>
                        <th class="bg-transparent text-light" scope="col">Contact</th>
                        <th class="bg-transparent text-light" scope="col">Phone</th>
                        <th class="bg-transparent text-light" scope="col">Schedule</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let schedule of pendingSchedule">
                        <td data-label="Name">
                            <div class="text-truncate">
                                {{ schedule.preCustomerName }}
                            </div>
                        </td>
                        <td data-label="City">
                            <div class="text-truncate">
                                {{ schedule.cityMaster.cityName }}
                            </div>
                        </td>
                        <td data-label="Contact">
                            <div class="text-truncate">
                                {{ schedule.contactPerson }}
                            </div>
                        </td>
                        <td data-label="Phone">
                            <div class="text-truncate">
                                <i-feather name="phone" class="feather-sm"></i-feather> {{ schedule.phone }}
                            </div>
                        </td>
                        <td data-label="Schedule">
                            <button class="btn btn-sm btn-light-success" (click)="createMeeting(schedule.PreCustomerMasterSid)">
                                <i-feather name="calendar" class="feather-sm"></i-feather>Schedule Meeting
                            </button>

                            <!-- <span class="border-start mx-2">&nbsp;</span> -->

                            <!-- <button class="btn btn-sm btn-light">
                                <i-feather name="edit-3" class="feather-sm"></i-feather> Edit
                            </button> -->

                            <!-- <div class="text-truncate">
                                <i-feather name="phone" class="feather-sm"></i-feather> {{ schedule.Schedule }}
                            </div> -->

                        </td>
                        
                    </tr>
                </tbody>
            </table>
        </div>
        <!-- #endregion -->
    </div>
</div>
