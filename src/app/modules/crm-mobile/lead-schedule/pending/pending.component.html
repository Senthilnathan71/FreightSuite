<div class="nav-pills-container">
  <div class="nav-pills">
    <div
      class="nav-pill"
      *ngFor="let tab of tabs"
      [class.active]="selectedTab === tab.name"
      (click)="selectTab(tab.name)"
    >
      <div class="pill-icon">
        <i [class]="tab.icon"></i>
      </div>
      <span class="pill-label">{{ tab.name }}</span>
      <div class="pill-indicator" *ngIf="selectedTab === tab.name"></div>
    </div>
  </div>
</div>
 
 
<div class="content-workspace">
    <!-- Opportunity Tab -->
    <div class="workspace-content" *ngIf="selectedTab === 'Opportunity'">
        <div class="row compact-form">
            <div class="col-12">
                <app-page-header
                    [title]="'Opportunity'"
                    [showFavorite]="false"
                    [showSearch]="true"
                    [searchPlaceholder]="'Search'"
                    [searchButtonText]="'Search'"
                    [(searchValue)]="filterValue"
                    [actions]="opportunityHeaderActions"
                    (searchTriggered)="onOpportunitySearchTriggered($event)"
                    (searchCleared)="opportunityResetPage()"
                    (actionTriggered)="onOpportunityActionTriggered($event)">
                </app-page-header>
            </div>
            <div class="col-12">
                <div *ngIf="isMobile; else oppdesktopTemplate">
                    <ng-container *ngTemplateOutlet="oppdesktopTemplate"></ng-container>
                </div>
            </div>
        </div>
    </div>
    <div class="workspace-content" *ngIf="selectedTab === 'Existing Customers'">
        <div class="row compact-form">
            <div class="col-12">
                <app-page-header
                    [title]="'Existing Customers'"
                    [showFavorite]="false"
                    [showSearch]="true"
                    [searchPlaceholder]="'Search'"
                    [searchButtonText]="'Search'"
                    [(searchValue)]="filterValue"
                    [actions]="existingCustomerHeaderActions"
                    (searchTriggered)="onExistingCustomerSearchTriggered($event)"
                    (searchCleared)="existingCustomerResetPage()"
                    (actionTriggered)="onExistingCustomerActionTriggered($event)">
                </app-page-header>
            </div>
            <div class="col-12">
                <div *ngIf="isMobile; else exidesktopTemplat">
                    <ng-container *ngTemplateOutlet="exidesktopTemplat"></ng-container>
                </div>
            </div>
        </div>
    </div>
</div>
 
 
 
 
<ng-template #mobileTemplate>
    <div class="mobile-view">
        <div class="card" *ngFor="let schedule of pendingSchedule">
            <div class="card-body">
                <div class="d-flex flex-column gap-2 position-relative">
                    <div class="d-flex flex-column gap-2 position-relative">
                        <div class="d-flex align-items-center fw-bold dofi-font-16 text-uppercase">{{
                            schedule.preCustomerName }}</div>
                    </div>
                    <div class="d-flex align-items-center">
                        <i-feather name="globe" class="feather-sm"></i-feather>
                        <div class="ms-2">{{ schedule.cityMaster.cityName }}</div>
                    </div>
                    <div class="d-flex align-items-center">
                        <i-feather name="user" class="feather-sm"></i-feather>
                        <div class="ms-2">{{ schedule.contactPerson }}</div>
                    </div>
                    <div class="d-flex align-items-center">
                        <i-feather name="phone" class="feather-sm"></i-feather>
                        <div class="ms-2">{{ schedule.phone }}</div>
                    </div>
                    <div class="d-flex align-items-start">
                        <i-feather name="calendar" class="feather-sm"></i-feather>
                        <div class="mx-2 text-decoration-underline text-success"
                            (click)="createMeeting(schedule.PreCustomerMasterSid)">Schedule Meeting</div>
                        <i-feather name="external-link" class="feather-sm text-success"></i-feather>
                    </div>
                </div>
            </div>
        </div>
    </div>
</ng-template>
 
<ng-template #oppdesktopTemplate>
    <div class="desktop-view">
        <div *ngIf="selectedTab === 'Opportunity'">
 
           <app-reusable-table
            #scheduleTable
            [config]="tableConfig"
            [data]="allSchedule"
            [loading]="tableLoading"
            [totalRecords]="totalLengthOfCollection"
            [paginationConfig]="paginationConfig"
            (actionClick)="onOpportunityTableActionClick($event)"
            (rowClick)="onOpportunityTableRowClick($event)"
            (sortChange)="onTableSortChange($event)"
            (filterChange)="onOpportunityTableFilterChange($event)"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </app-reusable-table>
        </div>

<ng-template #exidesktopTemplat>
    <div class="desktop-view">
        <div *ngIf="selectedTab === 'Existing Customers'">
 
                    <app-reusable-table
            #exitingCustomerTable
            [config]="tableCustomerConfig"
            [data]="allExistingCustomers"
            [loading]="tableLoading"
            [totalRecords]="totalLengthOfCollection"
            [paginationConfig]="paginationConfig"
            (actionClick)="onExistingCustomerTableActionClick($event)"
            (rowClick)="onExistingCustomerTableRowClick($event)"
            (sortChange)="onTableSortChange($event)"
            (filterChange)="onExistingCustomerTableFilterChange($event)"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </app-reusable-table>
        </div>
 
    </div>
</ng-template>
