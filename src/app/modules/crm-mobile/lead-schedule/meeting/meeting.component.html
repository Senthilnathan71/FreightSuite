<div class="row">
  <div class="col-12">
    <div class="card">
      <section class="card-body">
        <form [formGroup]="meetingForm" (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-sm-12 col-md-3">
              <div class="mb-2">
                <label class="control-label col-form-label">Customer Name</label>
                <input type="text" formControlName="customerName" class="form-control" />
                <small *ngIf="f['customerName'].touched && f['customerName'].invalid" class="text-danger">
                  Customer name is required.
                </small>
              </div>
            </div>

            <div class="col-sm-12 col-md-4">
              <div class="mb-2">
                <label class="control-label col-form-label">Contact Person</label>
                <input type="text" formControlName="contactPerson" class="form-control" />
                <small *ngIf="f['contactPerson'].touched && f['contactPerson'].invalid" class="text-danger">
                  Contact Person is required.
                </small>
              </div>
            </div>

            <div class="col-sm-12 col-md-4">
              <div class="mb-2">
                <label class="control-label col-form-label">Phone</label>
                <input type="text" formControlName="phone" class="form-control" />
                <small *ngIf="f['phone'].touched && f['phone'].invalid" class="text-danger">
                  Valid 10-digit phone number is required.
                </small>
              </div>
            </div>


            <div class="card-title">Schedule Meeting</div>

            <div class="col-sm-12 col-md-3">
              <div class="mb-2">
                <label class="control-label col-form-label">Meeting Date <span>*</span></label>
                <input type="datetime-local" formControlName="meetingDate" class="form-control" [min]="minDate" />
                <small *ngIf="f['meetingDate'].touched && f['meetingDate'].invalid" class="text-danger">
                  Meeting date is required.
                </small>
              </div>
            </div>

            <div class="col-sm-12 col-md-3">
              <div class="mb-2">
                <label class="control-label col-form-label">Meeting End Date <span>*</span></label>
                <input type="datetime-local" formControlName="meetingEndDate" class="form-control" [min]="minDate" />
                <small *ngIf="f['meetingEndDate'].touched && f['meetingEndDate'].invalid" class="text-danger">
                  Meeting End date is required.
                </small>
              </div>
            </div>

            <div class="col-sm-12 col-md-3">
              <div class="mb-2">
                <label class="control-label col-form-label">Meeting Type <span>*</span></label>
                <select formControlName="meetingType" class="form-select">
                  <option value="">Select</option>
                  <option value="Call">Call</option>
                  <option value="Visit">Visit</option>
                  <option value="Phone">Phone</option>
                  <option value="eMeeting">eMeeting</option>
                </select>
                <small *ngIf="f['meetingType'].touched && f['meetingType'].invalid" class="text-danger">
                  Meeting type is required.
                </small>
              </div>
            </div>

            <div class="col-sm-12 col-md-3">
              <div class="mb-2">
                <label class="control-label col-form-label">Salesperson <span>*</span></label>
                <select formControlName="leadAssignTo" class="form-select">
                  <option value="">Select</option>
                  <option *ngFor="let person of salesPersons" [value]="person.UserMasterSid">
                    {{ person.userName }}
                  </option>
                </select>
                <small *ngIf="f['leadAssignTo'].touched && f['leadAssignTo'].invalid" class="text-danger">
                  Salesperson is required.
                </small>
              </div>
            </div>

            <div class="col-sm-12 col-md-4">
              <div class="mb-2">
                <label class="control-label col-form-label">Meeting Agenda <span>*</span></label>
                <textarea type="text" formControlName="customerProfile" class="form-control"></textarea>
                <small *ngIf="f['customerProfile'].touched && f['customerProfile'].invalid" class="text-danger">
                  Meeting Agenda is required.
                </small>
              </div>
            </div>
            <div class="col-sm-12 col-md-4">
              <div class="mb-2">
                <label class="control-label col-form-label">Status</label>
                <input type="text" formControlName="status" class="form-control" [disabled]="true" />
                <small *ngIf="f['status'].touched && f['status'].invalid" class="text-danger">
                  Status is required.
                </small>
              </div>
            </div>
          </div>

          <div class="d-flex align-items-center justify-content-start gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary waves-effect waves-light" (click)="goBack()">
              <i-feather class="feather-sm me-1" name="arrow-left"></i-feather> Back
            </button>
            <button type="button" (click)="resetForm()"
              class="btn btn-sm btn-outline-secondary waves-effect waves-light btn-min-width ms-auto">
              <i-feather class="feather-sm me-1" name="refresh-cw"></i-feather> Reset
            </button>
            <button type="submit" class="btn btn-sm btn-info waves-effect waves-light btn-min-width"
              [disabled]="meetingForm.invalid || btnDisable">
              <i-feather class="feather-sm me-1" name="upload-cloud"></i-feather> Save
            </button>
          </div>
        </form>
      </section>
    </div>
  </div>
</div>
