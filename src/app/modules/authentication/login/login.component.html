<div class="auth-wrapper d-flex no-block justify-content-center align-items-center" [ngClass]="{ 'appmode-mobile': isMobile, 'appmode-desktop': !isMobile}">
    <div class="auth-box m-3 m-md-0">
        <div id="loginform" [ngClass]="{'d-none': recoverform}">
            <div class="text-center">
                <span class="db"><img src="assets/images/logos/xtreme-dark-icon.svg" alt="logo" /></span>
                <h5 class="font-medium mb-4">Sign In to Freight Forwarding</h5>
            </div>
            <!-- Form -->
            <div class="row">
                <div class="col-12">
                    <form class="form-horizontal mt-3" id="loginform" [formGroup]="loginform">
                        <div class="input-group mb-2"> 
                            <span class="input-group-text" id="basic-addon1"><i class="ti-user"></i></span>
                        
                            <input type="text" formControlName="email" id="email" class="form-control" placeholder="Email ID" aria-label="email ID" aria-describedby="basic-addon1" 
                            [ngClass]="{'is-invalid':
                                loginform.controls['email'].invalid &&
                                (loginform.controls['email'].touched || loginform.controls['email'].dirty)}">
                        </div>
                        <div class="input-group my-3">
                            <span class="input-group-text"><i class="ti-lock"></i></span>
                            <input type="password" formControlName="password" class="form-control" placeholder="Password" [ngClass]="{
                                        'is-invalid':
                                          loginform.controls['password'].invalid &&
                                          (loginform.controls['password'].touched || loginform.controls['password'].dirty)
                                      }" #passwordInput />
                            <span class="input-group-text password-toggle" (mousedown)="togglePassword(passwordInput)"
                                (mouseup)="resetPassword(passwordInput)" (mouseleave)="resetPassword(passwordInput)">
                                @if(!passwordView){
                                <i-feather class="feather-sm" name="eye"></i-feather>
                                } @else {
                                <i-feather class="feather-sm" name="eye-off"></i-feather>
                                }
                            </span>
                        </div>
                        <!-- <div class="input-group mb-2"> 
                                <span class="input-group-text" id="basic-addon2"><i class="ti-lock"></i></span>
                            
                            <input type="password" class="form-control" placeholder="Password" formControlName ="password"  id="password" aria-label="Password" aria-describedby="basic-addon1"
                            [ngClass]="{'is-invalid':
                                loginform.controls['password'].invalid &&
                                (loginform.controls['password'].touched || loginform.controls['password'].dirty)}">
                        </div> -->
                        <div class="form-group row">
                            <div class="col-md-12">
                                <div class="form-check d-flex">
                                    <input type="checkbox" class="form-check-input" id="customCheck1" formControlName="rememberMe">
                                    <label class="form-check-label fs-3 ms-2" for="customCheck1">Remember me</label>
                                    <a (click)="showRecoverForm()" href="javascript:void(0)" id="to-recover" class="text-dark fs-3 ms-auto"><i class="fa fa-lock me-2"></i> Forgot pwd?</a>
                                </div>
                            </div>
                        </div>
                        <div class="form-group text-center mt-3">
                            <div class="col-xs-12">
                                <button class="btn d-block w-100 btn-lg btn-info" (click)="login()" [disabled]="loginform.invalid">Log In</button>
                            </div>
                        </div>
                        
                        <!-- <div class="form-group mb-0 mt-2">
                            <div class="col-sm-12 text-center">
                                Don't have an account? <a href="authentication/signup" class="text-info ms-1"><b>Sign Up</b></a>
                            </div>
                        </div> -->
                    </form>
                </div>
            </div>
        </div>
        <div id="recoverform" [ngClass]="{'d-block': recoverform}">
            <div class="logo">
                <span class="db"><img src="assets/images/logos/xtreme-dark-icon.svg" alt="logo" /></span>
                <h5 class="font-medium mb-4">Recover Password</h5>
                <span>Enter your Email and instructions will be sent to you!</span>
            </div>
            <div class="row mt-3" [formGroup]="forgotPasswordForm">
                <!-- Form -->
                <form class="col-12">
                    <!-- email -->
                    <div class="form-group row">
                        <div class="col-12">
                            <input class="form-control form-control-lg" type="email" required="" placeholder="email ID" formControlName="email">
                        </div>
                    </div>
                    <!-- pwd -->
                    <div class="row mt-3">
                        <div class="col-6">
                            <button 
                            class="btn btn-md d-block w-100 btn-lg btn-info" 
                            (click)="sendResetLink()"
                            [disabled] = "isLoading"
                            >Submit</button>
                        </div>
                        <div class="col-6">
                            <button 
                            class="btn btn-md d-block w-100 btn-lg btn-light-secondary" 
                            [routerLink]="'/auth/login'"
                            >Back to Login</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
