<div class="modern-table-container">
    <div>
        <div class="table-toolbar">
            <div class="toolbar-left">
                <button class="table-action-btn primary" (click)="openConnectionModal(connectionModal)">
                    <i class="fas fa-plus"></i> Add Connection
                </button>
            </div>
            <div class="toolbar-right">
                <button class="table-action-btn export">
                    <i class="fas fa-download"></i> Export
                </button>
                <button class="table-action-btn print">
                    <i class="fas fa-print"></i> Print
                </button>
            </div>
        </div>
        <div class="modern-table-wrapper">
            <table class="modern-table">
                <thead>
                    <tr>
                        <th width="10%">Actions</th>
                        <th>Mode</th>
                        <th>Vsl</th>
                        <th>Vol</th>
                        <th>POL</th>
                        <th>POD</th>
                        <th>ETD</th>
                        <th>ETA</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="table-row">
                        <td class="actions-cell">
                            <div class="action-buttons"> <button class="action-icon edit"><i
                                        class="fas fa-edit"></i></button>
                                <button class="action-icon copy"><i class="fas fa-copy"></i></button> <button
                                    class="action-icon delete"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                        <td>dgd</td>
                        <td>dgd</td>
                        <td>dgd</td>
                        <td>dgd</td>
                        <td>dgd</td>
                        <td>dgd</td>
                        <td>dgd</td>
                        <td>dgd</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>


<ng-template #connectionModal let-modal>
    <div class="modal-header p-2 bg-info">
        <h5 class="modal-title text-white">Add Connection</h5>
        <button type="button" class="btn-close btn-close-white" aria-label="Close"
            (click)="modal.dismiss('Cross click')"></button>
    </div>

    <div class="modal-body">
        <div class="row">
            <aside class="col-md-4">
                <div class="custom-form-group custom-form-group-select">
                    <ng-select [items]="" bindLabel="name" bindValue="name">

                    </ng-select>
                    <label for="" class="input-label">Mode <span class="text-danger"></span></label>
                </div>
            </aside>

            <aside class="col-md-4">
                <div class="custom-form-group">
                    <input type="text" id="text-input" placeholder="" class="custom-input-field sm">
                    <label for="text-input" class="input-label">Vsl <span class="text-danger"></span></label>
                </div>
            </aside>
            <aside class="col-md-4">
                <div class="custom-form-group">
                    <input type="text" id="text-input" placeholder="" class="custom-input-field sm">
                    <label for="text-input" class="input-label">Voy <span class="text-danger"></span></label>
                </div>
            </aside>
            <aside class="col-md-4">
                <div class="custom-form-group">
                    <input type="text" id="text-input" placeholder="" class="custom-input-field sm">
                    <label for="text-input" class="input-label">POL <span class="text-danger"></span></label>
                </div>
            </aside>
            <aside class="col-md-4">
                <div class="custom-form-group">
                    <input type="text" id="text-input" placeholder="" class="custom-input-field sm">
                    <label for="text-input" class="input-label">POD <span class="text-danger"></span></label>
                </div>
            </aside>
            <div class="col-md-4">
                <div class=" custom-form-group custom-form-group-select">
                    <div class="input-group">
                        <input class="form-control" placeholder="dd-mm-yyyy" name="dp" ngbDatepicker #d6="ngbDatepicker"
                            (click)="d6.toggle()" />
                        <button class="btn  bi bi-calendar3 " (click)="d6.toggle()" type="button">
                            <i-feather name="calendar" class="feather-sm"></i-feather></button>
                    </div>
                    <label for="" class="input-label"> ETA <span class="text-danger"></span>
                    </label>
                </div>
            </div>
            <div class="col-md-4">
                <div class=" custom-form-group custom-form-group-select">
                    <div class="input-group">
                        <input class="form-control" placeholder="dd-mm-yyyy" name="dp" ngbDatepicker #d7="ngbDatepicker"
                            (click)="d7.toggle()" />
                        <button class="btn  bi bi-calendar3 " (click)="d7.toggle()" type="button">
                            <i-feather name="calendar" class="feather-sm"></i-feather></button>
                    </div>
                    <label for="" class="input-label"> ETD <span class="text-danger"></span>
                    </label>
                </div>
            </div>
            <aside class="col-md-4">
                <div class="custom-form-group custom-form-group-select">
                    <ng-select [items]="" bindLabel="name" bindValue="name">
                    </ng-select>
                    <label for="" class="input-label">Status <span class="text-danger"></span></label>
                </div>
            </aside>


        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" (click)="modal.dismiss('Cancel')">Cancel</button>
        <button type="button" class=" btn btn-sm btn-info" (click)="modal.close('Save')">Save</button>
    </div>
</ng-template>
