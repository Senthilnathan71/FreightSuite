     <app-page-header 
    [title]="'Cargo Receipt'" [showFavorite]="true" [showSearch]="true" 
    [searchPlaceholder]="'Search'" [searchButtonText]="'Search'" [(searchValue)]="filterValue" 
     [autoSearchOnFilterChange]="true"
    [actions]="headerActions"
    [dateRangeConfig]="dateRangeConfig"
    [dateTypeConfig]="dateTypeConfig"
    [partyFilterConfig]="partyFilterConfig"
    [departmentFilterConfig]="departmentFilterConfig"
    [polFilterConfig]="polFilterConfig"
    [podFilterConfig]="podFilterConfig"
    [partySearchFn]="partySearchFn"
    (departmentFilterChanged)="onDepartmentFilterChanged($event)"
    (advancedSearchTriggered)="onAdvancedSearch($event)"
    (searchTriggered)="onSearchTriggered($event)"  
    (searchCleared)="onSearchCleared()" (actionTriggered)="onActionTriggered($event)"
    >
    </app-page-header>
    <div class="col-12">
        <app-reusable-table
        #cargoReceiptTable
        [config]="tableConfig"
        [data]="allCargo"
        [loading]="tableLoading"
        [totalRecords]="totalLengthOfCollection"
        [paginationConfig]="paginationConfig"
        (actionClick)="onTableActionClick($event)"
        (rowClick)="onTableRowClick($event)"
        (sortChange)="onTableSortChange($event)"
        (filterChange)="onTableFilterChange($event)"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)">
    </app-reusable-table>
    </div>

</div>
