<div class="row compact-form" [formGroup]="cargoForm">
    <div class="col-12 px-0">
        <div class="row bg-white mb-1 align-items-center pt-1 rounded shadow-sm mx-0">
            <div class="col-md-4 d-flex pb-1">
                <h4 class="page-title mb-0">Cargo Receipt</h4>
            </div>
            <div class="col-md-8 pb-1">
                <div
                    class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <!-- <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" *ngIf="isEditMode"
                        (click)="openAuditLogs(auditLogModal)">
                        <i class="fas fa-history me-1"></i>Logs
                    </button> -->
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                        (click)="goBack()">
                        <i class="fas fa-chevron-left me-1"></i>
                        Back
                    </button>
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                    (click)="resetForm()">
                        <i class="fas fa-sync-alt me-1" ></i>
                        Reset
                    </button>
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="save()">
                        <i class="fas fa-save me-1"></i>
                        Save
                    </button>

                </div>
            </div>
        </div>
    </div>

    <div class="col-md-12 px-0">
        <div class="card h-100 mb-0">
            <div class="card-body pb-0">
                <div class="row">
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="BookingNo" readonly/>
                            <label for="text-input" class="input-label">Booking No <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class=" custom-form-group custom-form-group-select-date">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="BookingDateTime" readonly/>
                            <label class="input-label">Booking Date <span class="text-danger"></span>
                            </label>

                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="departmentName" readonly/>
                            <label for="text-input" class="input-label">Department<span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="CustomerName" readonly/>
                            <label for="text-input" class="input-label">Customer Name <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="VesselName" readonly/>
                            <label for="text-input" class="input-label">Vessel <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="VoyageNo" readonly/>
                            <label for="text-input" class="input-label">Voyage <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="POO" readonly/>
                            <label for="text-input" class="input-label">POO <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="POD" readonly/>
                            <label for="text-input" class="input-label">POD <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="POL" readonly/>
                            <label for="text-input" class="input-label">POL <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                       <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="FPD" readonly/>
                            <label for="text-input" class="input-label">FPD <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="HBLNo" readonly/>
                            <label for="text-input" class="input-label">HBL No <span class="text-danger"></span></label>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-12 mt-1">
        <div class="row bg-white py-2 rounded shadow-sm">
            <div class="table-responsive table-borderless">
                <table class="table table-hover align-middle no-wrap table-sm mb-1">
                    <thead>
                        <tr class="bg-info">
                            <th class="bg-transparent text-light" scope="col">Commodity</th>
                            <th class="bg-transparent text-light" scope="col">Shipping Bill No</th>
                            <th class="bg-transparent text-light" scope="col">Date</th>
                            <th class="bg-transparent text-light" scope="col">External Pkg</th>
                            <th class="bg-transparent text-light text-center" scope="col">No of Pkg</th>
                            <th class="bg-transparent text-light" scope="col">Gross Weight</th>
                            <th class="bg-transparent text-light" scope="col">Net Weight</th>
                            <th class="bg-transparent text-light" scope="col">Volume(CBM)</th>
                            <th class="bg-transparent text-light" scope="col">Cargo Recd. Date</th>
                            <th class="bg-transparent text-light" scope="col">CFS</th>
                            <th class="bg-transparent text-light" scope="col">Recd Pack</th>
                        </tr>
                    </thead>
                    <tbody formArrayName="bookingProducts">
  <tr *ngFor="let prod of bookingProductsArray.controls; let i = index" [formGroupName]="i">
    <td style="padding-top:2px; padding-bottom:2px; line-height:1.5;">
      <div class="text-truncate">{{ prod.value.ProductName }}</div>
    </td>
    <td style="padding-top:2px; padding-bottom:2px; line-height:1.5;">
      <div class="text-truncate">{{ prod.value.ShippingBillNo }}</div>
    </td>
    <td style="padding-top:2px; padding-bottom:2px; line-height:1.5;">
      <div class="text-truncate">{{ prod.value.ShippingBillDate }}</div>
    </td>
    <td style="padding-top:2px; padding-bottom:2px; line-height:1.5;">
      <div class="text-truncate text-center">{{ prod.value.ExternaPkg }}</div>
    </td>

    <!-- Editable fields -->
    <td style="padding-top:2px; padding-bottom:2px; line-height:1.5;">
      <input type="number" class="form-control form-control-sm text-end" formControlName="ExternlQty" [onlyNumbers] />
    </td>
    <td style="padding-top:2px; padding-bottom:2px; line-height:1.5;">
      <input type="number" class="form-control form-control-sm text-end" formControlName="GrossWeight" DecimalPrecision [DecimalPrecisionBefore]="7" [DecimalPrecisionAfter]="3"/>
    </td>
    <td style="padding-top:2px; padding-bottom:2px; line-height:1.5;">
      <input type="number" class="form-control form-control-sm text-end" formControlName="NetWeight" DecimalPrecision [DecimalPrecisionBefore]="7" [DecimalPrecisionAfter]="3"/>
    </td>
    <td style="padding-top:2px; padding-bottom:2px; line-height:1.5;">
      <input type="number" class="form-control form-control-sm text-end" formControlName="Volume" DecimalPrecision [DecimalPrecisionBefore]="7" [DecimalPrecisionAfter]="3"/>
    </td>
    <td>
  <div class="input-group" style="padding-top:2px; padding-bottom:2px; line-height:1.5;">
                <input
                  class="form-control"
                  formControlName="CargoRecDate"
                  placeholder="DD-MMM-YYYY"
                  (click)="d.toggle()"
                  (keydown.arrowDown)="d.open()"
                  ngbDatepicker
                  container="body"
                  #d="ngbDatepicker"
                  [minDate]="today"
                />
                <button class="btn" type="button" (click)="d.toggle()">
                  <i-feather name="calendar" class="feather-sm"></i-feather>
                </button>
              </div>
</td>



    <td style="padding-top:2px; padding-bottom:2px; line-height:1.5;">
      <div class="custom-form-group custom-form-group-select" style="width: 150px;" [class.filled]="!!cargoForm.get('CFS')?.value">
                <ng-select 
                  formControlName="CFS" 
                  [items]="cfsList" 
                  bindLabel="CustomerName" 
                  bindValue="CustomerName"
                  placeholder=""
                ></ng-select>
              </div>
    </td>
    <td style="padding-top:2px; padding-bottom:2px; line-height:1.5;">
      <input type="number" class="form-control form-control-sm text-end" formControlName="RecdPack" [onlyNumbers]/>
    </td>
  </tr>
</tbody>

                </table>
            </div>
        </div>
    </div>
</div>
