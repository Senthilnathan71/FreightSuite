<div class="row compact-form" [formGroup]="cargoForm">
    <div class="col-12 px-0">
        <div class="row bg-white mb-1 align-items-center pt-1 rounded shadow-sm mx-0">
            <div class="col-md-4 d-flex pb-1">
                <h5 class="page-title mb-0">Cargo Receipt</h5>
                @if(isEditMode){
      <a class="text-info  d-flex align-items-center w-2 h-2 cursor-pointer ps-1" (click)="showInfo()">
        <i class="fas fs-6 fa-info-circle"></i>
      </a>
      }
            </div>
            <div class="col-md-8 pb-1">
                <div
                    class="d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <button type="button" class="btn btn-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                        (click)="goBack()">
                        <i class="fas fa-chevron-left me-1"></i>
                        Back
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                        (click)="resetForm()">
                        <i class="fas fa-sync-alt me-1"></i>
                        Reset
                    </button>
                    <button type="button" class="btn btn-info btn-sm text-nowrap" *ngIf="isEditMode" (click)="sendManualMail()">
                        <i class="fas fa-envelope me-1"></i>
                        Send Mail
                    </button>
                    <div class="action-group primary">
        <button class="btn btn-sm dofi-min-w-80 dofi-max-w-80 position-relative"
                [ngClass]="{'btn-info': !hasUnsavedChanges(), 'btn-warning': hasUnsavedChanges()}"
                appPreventMultiClick
                (click)="save()"
                [disabled]="(!mps.can('update') && isEditMode)">
          <i class="fas fa-save me-1"></i>
          <span>Save</span>
          <span *ngIf="hasUnsavedChanges()"
                class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"
                title="You have unsaved changes">
            <span class="visually-hidden">unsaved changes</span>
          </span>
        </button>
      </div>
                    <!-- <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="save()"
                    [disabled]="(!mps.can('update') && isEditMode)">
                        <i class="fas fa-save me-1"></i>
                        Save
                    </button> -->
                    <div *ngIf="mps.hasAtLeastOne() && isEditMode" ngbDropdown class="d-inline-block">
            <button type="button" class="btn btn-light-secondary btn-sm has-arrow" id="dropdownBasic1"
              ngbDropdownToggle>
              <i class="fas fa-ellipsis-v"></i>
            </button>
            <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
              <button *ngIf="mps.has('edoc')" class="text-dark" ngbDropdownItem appPreventMultiClick (click)="openEDoc()"><i
                  class="fas fa-file-alt me-1"></i> Edoc</button>
              <!-- <button *ngIf="mps.has('terms_and_condition')" class="text-dark" ngbDropdownItem appPreventMultiClick (click)="openTandC()"><i
                  class="fas fa-clipboard me-1"></i> Terms & Condition</button> -->
              <button *ngIf="mps.has('authority')" class="text-dark" ngbDropdownItem appPreventMultiClick (click)="openAuthority()"><i
                  class="fas fa-shield-alt me-1"></i> Authorize</button>
              <button *ngIf="mps.has('email')" class="text-dark" ngbDropdownItem appPreventMultiClick (click)="openEmail()"><i
                  class="fas fa-envelope me-1"></i> Email</button>
              <button *ngIf="mps.has('follow_up')" class="text-dark" ngbDropdownItem appPreventMultiClick (click)="openFollowup()"><i
                  class="fas fa-paperclip me-1"></i> Followup</button>
                  <button *ngIf="mps.has('document_reference')" class="text-dark" ngbDropdownItem appPreventMultiClick (click)="openDocRef()"><i
              class="fas fa-paperclip me-1"></i>Document reference</button>
            </div>
          </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-12 px-0">
        <div class="card h-100 mb-0">
            <div class="card-body pb-0">
                <div class="row">
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="bookingNo" placeholder="" class="custom-input-field sm"
                                formControlName="BookingNo" readonly />
                            <label for="bookingNo" class="input-label">Booking No
                                <i
                                    *ngIf="cargoForm?.get('BookingNo')?.value"
                                    class="fas fa-copy ms-1"
                                    style="cursor: pointer; color: #1976d2; font-size: 12px; pointer-events: auto;"
                                    title="Copy Booking No"
                                    (click)="copyDocumentNumber('BookingNo', 'Booking No', $event)"
                                ></i>
                                <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class=" custom-form-group custom-form-group-select-date">
                            <input type="text" id="bookingDateTime" placeholder="" class="custom-input-field sm"
                                formControlName="BookingDateTime" readonly />
                            <label for="bookingDateTime" class="input-label">Booking Date <span class="text-danger"></span>
                            </label>

                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="DepartmentName" placeholder="" class="custom-input-field sm"
                                formControlName="departmentName" readonly />
                            <label for="DepartmentName" class="input-label">Department<span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="customerName"  placeholder="" class="custom-input-field sm"
                                formControlName="CustomerName" readonly />
                            <label for="customerName" class="input-label">Customer Name <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>

                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="vesselName" placeholder="" class="custom-input-field sm"
                                formControlName="VesselName" readonly />
                            <label for="vesselName" class="input-label">Vessel <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="voyageNo" placeholder="" class="custom-input-field sm"
                                formControlName="VoyageNo" readonly />
                            <label for="voyageNo" class="input-label">Voyage <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="poo" placeholder="" class="custom-input-field sm"
                                formControlName="POO" readonly />
                            <label for="poo" class="input-label">POO <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="pod" placeholder="" class="custom-input-field sm"
                                formControlName="POD" readonly />
                            <label for="pod" class="input-label">POD <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input type="text" id="pol" placeholder="" class="custom-input-field sm"
                                formControlName="POL" readonly />
                            <label for="pol" class="input-label">POL <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input id="fpd" type="text" placeholder="" class="custom-input-field sm"
                                formControlName="FPD" readonly />
                            <label for="fpd" class="input-label">FPD <span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-3">
                        <div class="custom-form-group">
                            <input id="hbl" type="text" placeholder="" class="custom-input-field sm"
                                formControlName="HBLNo" readonly />
                            <label for="hbl" class="input-label">HBL No
                                <i
                                    *ngIf="cargoForm?.get('HBLNo')?.value"
                                    class="fas fa-copy ms-1"
                                    style="cursor: pointer; color: #1976d2; font-size: 12px; pointer-events: auto;"
                                    title="Copy HBL No"
                                    (click)="copyDocumentNumber('HBLNo', 'HBL No', $event)"
                                ></i>
                                <span class="text-danger"></span></label>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-12 mt-1">
        <div class="row bg-white py-2 rounded shadow-sm">
            <div class="table-responsive table-borderless">
                <table class="table table-hover align-middle no-wrap table-sm mb-1">
                    <thead>
                        <tr class="bg-info">
                            <th class="bg-transparent text-light  dofi-min-w-140" scope="col">Commodity</th>
                            <th class="bg-transparent text-light dofi-min-w-120" scope="col">Shipping Bill No</th>
                            <th class="bg-transparent text-light dofi-min-w-100" scope="col">Date</th>
                            <th class="bg-transparent text-light" scope="col">External Pkg</th>
                            <th class="bg-transparent text-light text-center" scope="col">No of Pkg</th>
                            <th class="bg-transparent text-light" scope="col">Gross Wt.</th>
                            <th class="bg-transparent text-light" scope="col">Net Wt.</th>
                            <th class="bg-transparent text-light" scope="col">Volume(CBM)</th>
                            <th class="bg-transparent text-light dofi-min-w-150" scope="col">Cargo Recd. Date</th>
                            <th class="bg-transparent text-light" scope="col">CFS</th>
                            <th class="bg-transparent text-light" scope="col">Recd Pack</th>
                        </tr>
                    </thead>
                    <tbody formArrayName="bookingProducts">
                        <tr *ngFor="let prod of bookingProductsArray.controls; let i = index" [formGroupName]="i" class="py-0">
                            <td class="py-0">
                                <div class="text-truncate text-black">{{ prod.value.ProductName }}</div>
                            </td>
                            <td >
                                <div class="text-truncate text-black">{{ prod.value.ShippingBillNo }}</div>
                            </td>
                            <td >
                                <div class="text-truncate text-black">{{ prod.value.ShippingBillDate }}</div>
                            </td>
                            <td >
                                <div class="text-truncate text-center text-black">{{ prod.value.ExternaPkg }}</div>
                            </td>

                            <!-- Editable fields -->
                            <td>
                                <input type="number" class="custom-input-field sm  text-end mt-0"
                                    formControlName="ExternlQty" onlyNumbers>
                            </td>
                            <td >
                                <input type="number" class="custom-input-field sm  text-end mt-0"
                                    formControlName="GrossWeight" DecimalPrecision DecimalPrecisionBefore="7"
                                    DecimalPrecisionAfter="3">
                            </td>
                            <td >
                                <input type="number" class="custom-input-field sm  text-end mt-0"
                                    formControlName="NetWeight" DecimalPrecision DecimalPrecisionBefore="7"
                                    DecimalPrecisionAfter="3">
                            </td>
                            <td >
                                <input type="number" class="custom-input-field sm  text-end mt-0"
                                    formControlName="Volume" DecimalPrecision DecimalPrecisionBefore ="7"
                                    DecimalPrecisionAfter="3">
                            </td>
                            <td>
                                            <div class="custom-form-group custom-form-group-select-date mt-0">

              <div class="d-flex align-items-center">
                <input class="form-control" placeholder="DD-MMM-YYYY" name="dp" ngbDatepicker #d2="ngbDatepicker"
                  (click)="d2.toggle()" formControlName="CargoRecDate" (keydown.arrowDown)="d2.open()" [minDate]="today"   container="body"/>
                <button class="btn py-0" (click)="d2.toggle()" type="button"> <i-feather name="calendar"
                    class="feather-sm"></i-feather></button>
              </div>

            </div>

                                <!-- <div class="input-group" >
                                    <input class="form-control" formControlName="CargoRecDate" placeholder="DD-MMM-YYYY"
                                        (click)="d.toggle()" (keydown.arrowDown)="d.open()" ngbDatepicker
                                        container="body" #d="ngbDatepicker" [minDate]="today" />
                                    <button class="btn" type="button" (click)="d.toggle()">
                                        <i-feather name="calendar" class="feather-sm"></i-feather>
                                    </button>
                                </div> -->
                            </td>



                            <td >
                                <div class="custom-form-group custom-form-group-select mt-0" style="width: 150px;"
                                    [class.filled]="!!cargoForm.get('CFS')?.value">
                                    <!-- <ng-select formControlName="CFS" [items]="dropdownStore.customerTypeData()" bindLabel="CustomerName"
                                        bindValue="CustomerName" placeholder=""></ng-select> -->
                                        <dofi-searchable-dropdown 
                                            [items]="cfsList" 
                                            formControlName="CFS" 
                                            placeholder=""
                                            [displayFields]="customerLookupConfig.displayFields"
                                            [displayLabels]="customerLookupConfig.displayLabels"
                                            [labelFields]="customerLookupConfig.labelFields"
                                            bindValue="CustomerName"
                                            >
                                        </dofi-searchable-dropdown>
                                </div>
                            </td>
                            <td class="pb-1">
                                <input type="number" class="custom-input-field sm  text-end mt-0"
                                    formControlName="RecdPack" onlyNumbers>
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>
        </div>
    </div>
</div>
