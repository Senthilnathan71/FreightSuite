<div class="row compact-form">
    <div class="col-12 px-0">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
            <div class="col-md-4 d-flex pb-2">
                <div class="d-flex align-items-center gap-2">
                    <div class="brand-icon">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <h5 class="page-title mb-0 text-info"> Report</h5>

                </div>

            </div>
            <div class="col-md-8 pb-2">
                <div class="d-flex justify-content-end gap-2 flex-wrap">

                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-chevron-left me-1"></i> Back
                    </button>
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-sync-alt me-1"></i> Reset
                    </button>
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-save me-1"></i>
                        Save
                    </button>
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-100 dofi-max-w-100"
                        (click)="openPreviewModal(previewModal)" [disabled]="!selectedReportId">
                        <i class="fas fa-eye me-1"></i>
                        Preview
                    </button>

                </div>
            </div>
        </div>
    </div>

    <div class="col-md-12 px-0">
        <div class="card h-100 mb-0">
            <div class="card-body pb-0">
                <div class="row">
                    <aside class="col-md-4">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="mode" [items]="ModeofModules" bindLabel="name" bindValue="id"
                                placeholder="">
                            </ng-select>
                            <label for="" class="input-label">
                                Module <span class="text-danger"></span>
                            </label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label">Search Report Name <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="">
                            <label for="text-input" class="input-label"> {{selectedReportName}} <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>


                    <div class="row mt-2">

                        <div class="col-md-6">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle no-wrap table-bordered table-sm mb-1">
                                    <thead>
                                        <tr class="bg-info">
                                            <th class="bg-transparent text-light text-center" scope="col" width="10%">
                                                View</th>
                                            <th class="bg-transparent text-light text-center" scope="col">Report Name
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let report of reports">
                                            <td class="text-center">
                                                <input type="radio" name="reportRadio" [value]="report.id"
                                                    [checked]="selectedReportId === report.id"
                                                    (change)="selectReport(report.id)" class="cursor-pointer" />
                                            </td>
                                            <td>{{ report.name }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle no-wrap table-bordered table-sm mb-1">
                                    <thead>
                                        <tr class="bg-info">
                                            <th class="bg-transparent text-light text-center">Parameter Name</th>
                                            <th class="bg-transparent text-light text-center">Value</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Show only if report is selected -->
                                        <tr *ngFor="let param of selectedReportParameters">
                                            <td>{{ param.name }}</td>
                                            <td><a href="#">{{ param.value }}</a></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>


            </div>



            <ng-template #previewModal let-modal>
                <div class="modal-header p-2 bg-info text-white">
                    <h5 class="modal-title">Preview</h5>
                    <button type="button" class="btn-close btn-close-white" aria-label="Close"
                        (click)="modal.dismiss()"></button>
                </div>
                <div class="modal-body">
                    <!-- Header: Logo + Company Name -->
                    <div class="d-flex align-items-center mb-3">
                        <img src="assets/logo/dofi-logo.svg" width="80" height="80" class="img-fluid me-3" alt="Logo">
                        <div>
                            <h4 class="mb-0 fw-semibold text-info">Dofi <br>Infosys</h4>
                            <!-- <small class="text-muted">Business Intelligence Reports</small> -->
                        </div>
                    </div>

                    <!-- Report Title -->
                    <div class="mb-3 border-bottom">
                        <h4 class="text-info fw-bold">{{ selectedReportName }}</h4>
                    </div>

                    <!-- Parameters List -->
                    <div class="mb-3">
                        <h6 class="fw-semibold text-secondary mb-2">Report Parameters :</h6>
                        <div *ngFor="let param of selectedReportParameters" class="row mb-1">
                            <div class="col-4 fw-medium text-dark">
                                {{ param.name }} :
                            </div>
                            <div class="col-8 text-start">
                                {{ param.value }}
                            </div>
                        </div>
                    </div>

                    <!-- Search and Actions -->
                    <div class="bg-light rounded p-2 mb-2">
                        <form class="row gx-2 gy-2 align-items-center compact-form">
                            <div class="col-md-9">
                                <div class="position-relative">
                                    <input name="filterValue" type="text" class="form-control pe-5" placeholder="Search"
                                        aria-label="Search input">
                                    <button type="button"
                                        class="btn position-absolute top-50 end-0 translate-middle-y me-3 text-secondary p-0"
                                        tabindex="0" aria-label="Clear search">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-info btn-sm">
                                    <i class="fas fa-search me-1"></i> Search
                                </button>
                            </div>
                            <div class="col-auto">
                                <div ngbDropdown>
                                    <button type="button" class="btn btn-secondary btn-sm" ngbDropdownToggle>
                                        Actions
                                    </button>
                                    <div ngbDropdownMenu>
                                        <button ngbDropdownItem>Edit</button>
                                        <button ngbDropdownItem>Delete</button>
                                        <button ngbDropdownItem>Create</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle no-wrap table-bordered table-sm mb-1">
                            <thead>
                                <tr class="bg-info">
                                    <th class="bg-transparent text-light" scope="col">VAT %</th>
                                    <th class="bg-transparent text-light" scope="col">VAT</th>
                                </tr>
                            </thead>
                            <tbody>
                                @for (item of [0,1,2]; track $index) {
                                <tr>
                                    <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                        <div class="text-truncate">RO</div>
                                    </td>
                                    <td style="padding-top: 2px; padding-bottom: 2px; line-height: 1.5;">
                                        <div class="text-truncate">OMR</div>
                                    </td>
                                </tr>
                                }
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-sm btn-secondary" (click)="modal.dismiss()">Cancel</button>
                    <button class="btn btn-sm btn-info" (click)="downloadPDF()">
                        <i class="fas fa-file-pdf me-1"></i> Download PDF
                    </button>
                    <button class="btn btn-sm btn-info">Save</button>
                </div>
            </ng-template>
