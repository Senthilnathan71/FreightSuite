<div class="modern-table-container">
    <div>
        <div class="table-toolbar">
            <div class="toolbar-left">
               
            </div>
            <div class="toolbar-right">
                 <button class="table-action-btn primary" (click)="openMilestoneModal(milestoneModal)" [disabled]="isFormDisabled || !isHBLNoValid()">
                    <i class="fas fa-plus"></i> Add Milestone
                </button>
                <button class="table-action-btn export" (click)="reportMilestones()">
                    <i class="fas fa-download"></i> Export
                </button>
            </div>
        </div>
        @if(milestoneDataLength > 0){
        <div class="modern-table-wrapper">
            <table class="modern-table">
                <thead>
                    <tr>
                        <th width="2%"></th>
                        <th>Sno</th>
                        <th>Milestone</th>
                        <th>Date & Time</th>
                        <th>Auto Captured</th>
                        <th>Remarks</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="table-row" *ngFor="let milestone of slicedMilestoneFormArr; let i = index">
                        <td >
                            <div > 
                                <button class="action-icon edit" (click)="openMilestoneModal(milestoneModal,milestone,i)" [disabled]="isFormDisabled">
                                   <i-feather class="feather-sm text-info" name="eye"></i-feather>
                                </button>
                                <!-- <button class="action-icon copy"><i class="fas fa-copy"></i></button> <button
                                    class="action-icon delete"><i class="fas fa-trash"></i></button> -->
                            </div>
                        </td>
                        <td>{{ (page1 - 1) * pageSize1 + i + 1 }}</td>
                        <td>{{ milestone.MilestoneName }}</td>
                        <td>{{ milestone.MilestoneDate | formatDate : true }}</td>
                        <td>
                            <div class="form-check form-check-inline p-0 ps-2 mt-0">
                                <div class="form-check d-flex align-items-center justify-content-center mt-0">
                                    <input type="checkbox" id="" class="form-check-input sm"
                                        [checked]="milestone.AutoCaptured === true || milestone.AutoCaptured === 'Y'" disabled>
                                </div>
                        </div>
                        </td>
                        <td>{{ milestone.Remarks }}</td>
                    </tr>
                </tbody>
            </table>
            <div class="mt-2">
                <ngb-pagination class="d-flex justify-content-end" [collectionSize]="milestoneDataLength" [(page)]="page1" [pageSize]="pageSize1"
                    (pageChange)="updateMilestonePagination()" [maxSize]="10" [rotate]="true" [ellipses]="false" size="sm">
                </ngb-pagination>
            </div>
        </div>
        }@else {
        <div class="col-12">
            <div class="text-center">No Record Found</div>
        </div>
        }
    </div>
</div>


<ng-template #milestoneModal let-modal>
    <div class="modal-header modalHeaderpart ">
        <h5 class="modal-title ">Milestone</h5>
        <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
        <form [formGroup]="milestoneForm">
            <div class="row compact-form">
                <aside class="col-md-4">
                    <div class="custom-form-group custom-form-group-select" [class.filled]="!!milestoneForm.get('MilestoneMasterSid')?.value">
                        <ng-select [items]="allMilestones" bindLabel="MilestoneName" bindValue="MilestoneMasterSid" class="ng-select"
                            formControlName="MilestoneMasterSid" placeholder="" (change)="onMilestoneChange($event)">
                        </ng-select>
                        <label for="text-input" class="input-label">Milestone <span class="text-danger"></span></label>
                    </div>
                </aside>
                <div class="col-md-4">
                    <div class=" custom-form-group custom-form-group-select-date">
                        <div class="input-group">
                            <input class="form-control" placeholder="dd-mm-yyyy" name="dp" ngbDatepicker #d1="ngbDatepicker"
                                formControlName="MilestoneDate" (click)="d1.toggle()" />
                            <button class="btn bi bi-calendar3 " (click)="d1.toggle()" type="button">
                                <i-feather name="calendar" class="feather-sm"></i-feather></button>
                        </div>
                        <label class="input-label"> Date & Time<span class="text-danger"></span>
                        </label>
                    </div>
                </div>
                <aside class="col-md-4 d-flex align-items-center">
                    <div class="form-check form-check-inline p-0">
                        <div class="form-check d-flex align-items-center">
                            <input type="checkbox" id="" class="form-check-input sm" formControlName="AutoCaptured" readonly>
                            <label for="AutoCaptured" class="form-check-label sm">Auto Captured <span
                                    class="text-danger"></span></label>
                        </div>
                    </div>
                </aside>
                <aside class="col-md-4">
                    <div class="custom-form-group">
                        <input type="text" id="text-input" placeholder="" class="custom-input-field sm" formControlName="Remarks">
                        <label for="text-input" class="input-label">Remarks<span class="text-danger"></span></label>
                    </div>
                </aside>
                <aside class="col-md-4">
                    <div class="custom-form-group custom-form-group-select" [class.filled]="!!milestoneForm.get('Status')?.value">
                        <ng-select [items]="modeOfStatus" bindLabel="name" bindValue="id" formControlName="Status"
                            id="status"></ng-select>
                        <label class="input-label">Status <span class="text-danger">*</span></label>
                    </div>
                </aside>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" (click)="modal.dismiss()">Cancel</button>
        <button type="button" class="btn btn-info btn-sm" (click)="onMilestoneSubmit()" [disabled]="isFormDisabled">Save</button>
    </div>
</ng-template>
