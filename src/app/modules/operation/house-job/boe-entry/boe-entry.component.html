<div class="form-container">
  <form [formGroup]="boeForm">
    <table class="boe-table">
      <thead>
        <tr>
          <th>SNo</th>
          <th>Declaration No</th>
          <th class="required">BOE No</th>
          <th>BOE Date</th>
          <th>BOE Value</th>
          <th>Invoice No</th>
          <th>Transaction Type</th>
          <th>Amount</th>
          <th colspan="2">Exit/Entry Document</th>
          <th colspan="3">Claim</th>
          <th>Note</th>
          <th>Action</th>
        </tr>
        <tr class="subheader">
          <th colspan="8"></th>
          <th>Process Date</th>
          <th>Recv’d Date</th>
          <th>Ack. No</th>
          <th>Ack. Date</th>
          <th>Ack. Status</th>
          <th></th>
          <th></th>
        </tr>
      </thead>

      <tbody formArrayName="boeDetails">
        <tr *ngFor="let row of boeDetails.controls; let i = index" [formGroupName]="i">
          <td>{{ i + 1 }}</td>
          <td><input formControlName="DeclarationNo" [readonly]="!row.get('isEdit')?.value" /></td>
          <td><input formControlName="BOENo" [readonly]="!row.get('isEdit')?.value" /></td>
          <td><input type="date" formControlName="BOEDate" [readonly]="!row.get('isEdit')?.value" /></td>
          <td><input type="number" formControlName="BOEValue" [readonly]="!row.get('isEdit')?.value" /></td>
          <td><input formControlName="BOEInvoiceValue" [readonly]="!row.get('isEdit')?.value" /></td>
          <td><input formControlName="TransactionType" [readonly]="!row.get('isEdit')?.value" /></td>
          <td><input type="number" formControlName="Amount" [readonly]="!row.get('isEdit')?.value" /></td>
          <td><input type="date" formControlName="ProcessDate" [readonly]="!row.get('isEdit')?.value" /></td>
          <td><input type="date" formControlName="ReceivedDate" [readonly]="!row.get('isEdit')?.value" /></td>
          <td><input formControlName="AckNo" [readonly]="!row.get('isEdit')?.value" /></td>
          <td><input type="date" formControlName="AckDate" [readonly]="!row.get('isEdit')?.value" /></td>
          <td><input formControlName="AckStatus" [readonly]="!row.get('isEdit')?.value" /></td>
          <td><input formControlName="Note" [readonly]="!row.get('isEdit')?.value" /></td>

          <td class="actions-cell">
            <button type="button" *ngIf="!row.get('isEdit')?.value" (click)="editRow(i)" class="btn btn-edit">✏️</button>
            <button type="button" *ngIf="row.get('isEdit')?.value" (click)="saveRow(i)" class="btn btn-save">💾</button>
            <button type="button" (click)="removeRow(i)" class="btn btn-delete">🗑</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="actions">
      <button type="button" (click)="addRow()">+ Add Row</button>
    </div>
  </form>
</div>
