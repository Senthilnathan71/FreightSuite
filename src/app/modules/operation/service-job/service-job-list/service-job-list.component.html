<ngx-spinner bdColor="rgba(0,0,0,0.8)" size="medium" color="#fff" type="ball-scale-ripple" [fullScreen]="true">
    <p style="color: white;" class="m-0">Loading...</p>
</ngx-spinner>

<div class="row compact-form">
    <!-- Reusable Page Header for Search, Title, and Actions -->
    <app-page-header 
        [title]="'Service Jobs'" 
        [showFavorite]="true" 
        [showSearch]="true" 
        [searchPlaceholder]="'Search'"
        [searchButtonText]="'Search'" 
        [autoSearchOnFilterChange]="true"
        [(searchValue)]="filterValue" 
        [actions]="headerActions"
        [dateRangeConfig]="dateRangeConfig"
        [dateTypeConfig]="dateTypeConfig"
        [partyFilterConfig]="partyFilterConfig"
        [departmentFilterConfig]="departmentFilterConfig"
        [polFilterConfig]="polFilterConfig"
        [podFilterConfig]="podFilterConfig"
        [partySearchFn]="partySearchFn"
        (departmentFilterChanged)="onDepartmentFilterChanged($event)"
        (advancedSearchTriggered)="onAdvancedSearch($event)"
        (searchCleared)="onSearchCleared()"
        (actionTriggered)="onActionTriggered($event)">
    </app-page-header>

    <!-- Reusable Table for Displaying Data -->
    <div class="col-12 px-0">
        <app-reusable-table #serviceJobTable 
            [config]="tableConfig" 
            [data]="allServiceJobs" 
            [loading]="tableLoading"
            [totalRecords]="totalLengthOfCollection" 
            [paginationConfig]="paginationConfig"
            (actionClick)="onTableActionClick($event)"
            (sortChange)="onTableSortChange($event)"
            (pageChange)="onPageChange($event)" 
            (pageSizeChange)="onPageSizeChange($event)">
        </app-reusable-table>
    </div>

    <!-- Message for When No Records are Found -->
    <div class="col-12 text-center mt-3" *ngIf="!tableLoading && totalLengthOfCollection === 0">
        <p>No service jobs found. Try adjusting your search criteria or create a new one.</p>
    </div>
</div>
