<ngx-spinner
  bdColor="rgba(0,0,0,0.8)"
  size="medium"
  color="#fff"
  type="ball-scale-ripple"
  [fullScreen]="true">
  <p style="color: white;" class="m-0">Loading...</p>
</ngx-spinner>
<div class="row compact-form">
    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm justify-content-between">
            <div class="col pb-2">
                <h4 class="page-title mb-0">Booking</h4>
            </div>

            <div class="col-md pb-2">
                <form class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0">
                    <div class="d-flex gap-2 col-12 px-0 align-items-stretch align-items-md-center">
                        <div class="form-outline flex-grow-1 position-relative">
                            <input name="filterValue" type="text" class="form-control pe-5" placeholder="Search Booking No, POL, POD, Salesman..."
                                aria-label="Search input" [(ngModel)]="filterValue" (keyup.enter)="searchBookings()">
                            <button *ngIf="filterValue"
                                class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-3 p-1 text-secondary"
                                tabindex="0" aria-label="Clear search" data-bs-toggle="tooltip" data-bs-placement="top"
                                data-bs-title="Clear search"
                                onfocus="this.classList.replace('text-secondary','text-danger')"
                                onblur="this.classList.replace('text-danger','text-secondary')"
                                (click)="clearFilterValue()">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="mt-md-0 mt-1">
                            <button type="submit" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                                (click)="searchBookings()">
                                <i class="fas fa-search me-1"></i> Search
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="col-md-auto pb-2">
                <div class="" data-bs-theme="light">
                    <form
                        class="d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                        <app-favorite-star screenName="Booking" class="mt-1 me-1"></app-favorite-star>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                            (click)="navigateToCreate()">
                            <i class="fas fa-plus me-1"></i> Create
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                            (click)="report()">
                            <i class="fas fa-file-alt me-1"></i>
                            Report
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                            (click)="resetPage()">
                            <i class="fas fa-sync-alt me-1"></i>
                            Reset
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
    <!-- Reusable Table Component -->
    <app-reusable-table
        [config]="tableConfig"
        [data]="allBookings"
        [loading]="tableLoading"
        [totalRecords]="totalLengthOfCollection"
        [paginationConfig]="paginationConfig"
        [selectedRows]="selectedTableRows"
        (actionClick)="onTableActionClick($event)"
        (rowClick)="onTableRowClick($event)"
        (rowSelect)="onTableRowSelect($event)"
        (sortChange)="onTableSortChange($event)"
        (filterChange)="onTableFilterChange($event)"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)">
    </app-reusable-table>
</div>
