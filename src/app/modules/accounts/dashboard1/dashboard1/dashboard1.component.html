<div>


    <div class="d-flex justify-content-between align-items-center mb-5">
        <div class="d-flex gap-3">
            <button class="btn btn-light-secondary btn-sm" (click)="activeTab = 'pts'">PTS Dashboard</button>
            <button class="btn btn-light-secondary btn-sm" (click)="activeTab = 'pending'">Pending Approval</button>
        </div>
        <div>
            <button class="btn btn-info btn-sm">Today</button>
        </div>
        <div class="d-flex gap-3">
            <button class="btn btn-info btn-sm">Over Due / Today Action</button>
            <button class="btn btn-light-secondary btn-sm">Future Action</button>
        </div>
    </div>

    <!-- PTS Dashboard Card -->
    <div *ngIf="activeTab === 'pts'" class="card-shape">
        <div class="card-con">
            <div class="card-container fw-bold">
                <div class="card-content">
                    <div class="d-flex align-items-center justify-content-between border-bottom">
                        <div class="card-title">Info</div>
                        <div class="card-subtitle">Menu : Shipment Status</div>
                    </div>
                    <div class="pt-2 pb-3">Shipment successfully delivered</div>
                </div>
                <div class="curve-strip"></div>
            </div>
            <div class="d-flex justify-content-between align-items-center pt-1">
                <i class="fas fa-check-circle text-success ms-2"></i>
                <div>Reference : <span class="text-info">PTS123456</span></div>
            </div>
        </div>

    </div>

    <!-- Pending Approval Card -->
    <div *ngIf="activeTab === 'pending'" class="card-shape">
        <div class="card-shape card-con">
            <div class="card-container fw-bold">
                <div class="card-content">
                    <div class="d-flex align-items-center justify-content-between border-bottom">
                        <div class="card-title">Alert</div>
                        <div class="card-subtitle">Menu : Shipment Planning</div>
                    </div>
                    <div class="pt-2 pb-3">Final approval for invoicing</div>
                </div>
                <div class="curve-strip"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center  pt-1">
                <i class="fas fa-comments text-info ms-2"></i>
                <div>Reference : <span class="text-info">GBOMGE250301</span></div>
            </div>
        </div>

        <div class="card-con">
            <div class="card-container fw-bold">
                <div class="card-content">
                    <div class="d-flex align-items-center justify-content-between border-bottom">
                        <div class="card-title">Alert</div>
                        <div class="card-subtitle">Menu : Shipment Planning</div>
                    </div>
                    <div class="pt-2 pb-3">Final approval for invoicing</div>
                </div>
                <div class="curve-strip"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center  pt-1">
                <i class="fas fa-comments text-info ms-2"></i>
                <div>Reference : <span class="text-info">GBOMGE250301</span></div>
            </div>
        </div>

    </div>
</div>
