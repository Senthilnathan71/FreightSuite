<div class="row compact-form">
  <div class="col-12 px-0">
    <div class="row bg-white mb-1 align-items-center pt-1 rounded shadow-sm mx-0">
      <div class="col-md-4 d-flex pb-1">
        <div class="d-flex align-items-center gap-2">
          <div class="brand-icon">
            <i class="fas fa-rupee-sign"></i>
          </div>
          <h5 class="page-title mb-0 text-info">Currency Exchange</h5>
          @if(isEditMode){
          <a class="text-info ps-2 d-flex align-items-center w-2 h-2 crusor-pointer" (click)="showInfo()">
            <i class="fas fs-6 fa-info-circle"></i>
          </a>
          }
        </div>
      </div>
      
      <div class="col-md-8 pb-1">
        
        <div
          class="d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">

      <div class="action-group"  *ngIf="isEditMode">  
                <button class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="nagivateback()" [disabled]="!mps.can('insert')">    
                    <i class="fas fa-plus me-1"></i>
                    <span>Create </span>    
                    </button>
</div>


          <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" (click)="goBack()">
            <i class="fas fa-chevron-left me-1"></i>
            Back
          </button>
          <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" (click)="reset()">
            <i class="fas fa-sync-alt me-1"></i>
            Reset
          </button>
          <!-- <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
            [disabled]="(!mps.can('update') && isEditMode) || currencyExchangeForm.invalid" (click)="onSubmit()">
            <i class="fas fa-save me-1"></i>
            Save
          </button> -->
          <div class="action-group primary">
  <button class="btn btn-sm dofi-min-w-80 dofi-max-w-80 position-relative"
          [ngClass]="{'btn-info': !hasUnsavedChanges(), 'btn-warning': hasUnsavedChanges()}"
          (click)="onSubmit()"  
          [disabled]="(!mps.can('update') && isEditMode)" >
    <i class="fas fa-save me-1"></i>
    <span>{{ isSaving ? "Saving..." : "Save" }}</span> 
    <span *ngIf="hasUnsavedChanges()"
          class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"
          title="You have unsaved changes">
      <span class="visually-hidden">unsaved changes</span>
    </span>
  </button>
</div>
          <div *ngIf="mps.hasAtLeastOne() && isEditMode" ngbDropdown class="d-inline-block">
            <button type="button" class="btn btn-light-secondary btn-sm has-arrow" id="dropdownBasic1"
              ngbDropdownToggle>
              <i class="fas fa-ellipsis-v"></i>
            </button>
            <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
              <button *ngIf="mps.has('edoc')" class="text-dark" ngbDropdownItem appPreventMultiClick (click)="openEDoc()"><i
                  class="fas fa-file-alt me-1"></i> Edoc</button>
              <!-- <button *ngIf="mps.has('terms_and_condition')" class="text-dark" ngbDropdownItem appPreventMultiClick (click)="openTandC()"><i
                  class="fas fa-clipboard me-1"></i> Terms & Condition</button> -->
              <button *ngIf="mps.has('authority')" class="text-dark" ngbDropdownItem appPreventMultiClick (click)="openAuthority()"><i
                  class="fas fa-shield-alt me-1"></i> Authorize</button>
              <button *ngIf="mps.has('email')" class="text-dark" ngbDropdownItem appPreventMultiClick (click)="openEmail()"><i
                  class="fas fa-envelope me-1"></i> Email</button>
              <button *ngIf="mps.has('follow_up')" class="text-dark" ngbDropdownItem appPreventMultiClick (click)="openFollowup()"><i
                  class="fas fa- me-1"></i> Followup</button>
                <button *ngIf="mps.has('document_reference')" class="text-dark" ngbDropdownItem appPreventMultiClick (click)="openDocRef()"><i
              class="fas fa-paperclip me-1"></i>Document reference</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-12 px-0">
    <div class="card">
      <div class="card-body">
        <form [formGroup]="currencyExchangeForm">
          <div class="row">
            <!-- <div class="card-header-title d-flex align-items-center gap-2 mb-1">
              <i class="fas fa-exchange-alt fs-4"></i>
              <h5 class="card-titlename mb-0">Currency Exchange Information</h5>
            </div> -->

            <aside class="col-md-4">
              <div class="custom-form-group custom-form-group-select-date">
                <div class="input-group">
                  <input class="form-control mb-0" placeholder="dd-mm-yyyy" name="dp" ngbDatepicker #d2="ngbDatepicker"
                    (click)="d2.toggle()" readonly formControlName="EffectiveFrom" [footerTemplate]="footerTemplate2"
                    [minDate]="minDate" />

                  <button class="btn  bi bi-calendar3" (click)="d2.toggle()" type="button">
                    <i-feather name="calendar" class="feather-sm"></i-feather>
                  </button>
                </div>

                <label class="input-label" for="dp">Effective From <span class="text-danger">*</span></label>
                <div
                  *ngIf="currencyExchangeForm.get('EffectiveFrom')?.touched && currencyExchangeForm.get('EffectiveFrom')?.invalid">
                  <p *ngIf="currencyExchangeForm.get('EffectiveFrom')?.errors?.['required']"
                    class="error-message pe-4 pb-2">Required</p>
                </div>
              </div>
            </aside>

            <ng-template #footerTemplate2>
              <hr class="my-0" />
              <button class="btn btn-info btn-sm m-2 float-start"
                (click)="currencyExchangeForm.get('EffectiveFrom')?.setValue(todayDate); d2.close()">
                Today
              </button>
              <button class="btn btn-secondary btn-sm m-2 float-end" (click)="d2.close()">
                Close
              </button>
            </ng-template>

              <div class="custom-form-group">
                <input type="date" id="EffectiveFrom" formControlName="EffectiveFrom" class="custom-input-field sm">
                <label for="EffectiveFrom" class="input-label">Effective From <span class="text-danger fw-bold">*</span></label>

            <aside class="col-md-4">
              <div class="custom-form-group">
                <select formControlName="FromCurrency" class="custom-input-field sm">
                  <option value="">Select From Currency</option>
                  <option *ngFor="let currency of currencies" [value]="currency.currencyCode">
                    {{ currency.currencyCode }} - {{ currency.currencyName }}
                  </option>
                </select>
                <label class="input-label">From Currency <span class="text-danger">*</span></label>
                <div class="error-message"
                  *ngIf="currencyExchangeForm.get('FromCurrency')?.touched && currencyExchangeForm.get('FromCurrency')?.invalid">
                  <span *ngIf="currencyExchangeForm.get('FromCurrency')?.errors?.['required']">Required</span>
                </div>
              </div>
            </aside>

            <aside class="col-md-4">
  <div class="custom-form-group">
    <select formControlName="ToCurrency" class="custom-input-field sm">
      <option value="">Select To Currency</option>
      <option *ngFor="let currency of filteredToCurrencies" [value]="currency.currencyCode">
        {{ currency.currencyCode }} - {{ currency.currencyName }}
      </option>
    </select>
    <label class="input-label">To Currency <span class="text-danger">*</span></label>
    <div class="error-message"
      *ngIf="currencyExchangeForm.get('ToCurrency')?.touched && currencyExchangeForm.get('ToCurrency')?.invalid">
      <span *ngIf="currencyExchangeForm.get('ToCurrency')?.errors?.['required']">Required</span>
    </div>
  </div>
</aside>

            <aside class="col-md-4">
              <div class="custom-form-group">
                <input type="text" formControlName="RateFrom" class="custom-input-field sm" placeholder=""
                  maxlength="100" />
                <label class="input-label">Rate From <span class="text-danger"></span></label>
                <div class="error-message"
                  *ngIf="currencyExchangeForm.get('RateFrom')?.touched && currencyExchangeForm.get('RateFrom')?.invalid">
                  <span>Required</span>
                </div>
              </div>
            </aside>


            <aside class="col-md-4">
              <div class="custom-form-group">
                <input type="number" step="0.00001" formControlName="SellRate" class="custom-input-field sm"
                  placeholder="" DecimalPrecision [DecimalPrecisionBefore]="6" [DecimalPrecisionAfter]="5"
                  max="999.999" />
                <label class="input-label">Sell Rate <span class="text-danger">*</span></label>
                <div class="error-message"
                  *ngIf="currencyExchangeForm.get('SellRate')?.touched && currencyExchangeForm.get('SellRate')?.invalid">
                  <span *ngIf="currencyExchangeForm.get('SellRate')?.errors?.['required']">Required</span>
                  <span *ngIf="currencyExchangeForm.get('SellRate')?.errors?.['pattern']">Enter a valid decimal number
                    (max 5 decimal places)</span>
                </div>
              </div>
            </aside>


            <aside class="col-md-4">
              <div class="custom-form-group">
                <input type="number" step="0.00001" formControlName="BuyRate" class="custom-input-field sm"
                  placeholder="" DecimalPrecision [DecimalPrecisionBefore]="6" [DecimalPrecisionAfter]="5"
                  max="999.999" />
                <label class="input-label">Buy Rate <span class="text-danger">*</span></label>
                <div class="error-message"
                  *ngIf="currencyExchangeForm.get('BuyRate')?.touched && currencyExchangeForm.get('BuyRate')?.invalid">
                  <span *ngIf="currencyExchangeForm.get('BuyRate')?.errors?.['required']">Required</span>
                  <span *ngIf="currencyExchangeForm.get('BuyRate')?.errors?.['pattern']">Enter a valid decimal number
                    (max 5 decimal places)</span>
                </div>
              </div>
            </aside>

            <aside class="col-md-4">

      class="custom-input-field sm"
      placeholder=""
    />
    <label class="input-label">Bank Name <span class="text-danger">*</span></label>
    <div class="error-message" *ngIf="currencyExchangeForm.get('BankName')?.touched && currencyExchangeForm.get('BankName')?.invalid">

    </div>
  </div>
</aside> -->

            <aside class="col-md-4">
              <div class="custom-form-group">
                <textarea formControlName="Remarks" class="custom-input-field sm" rows="1" placeholder=""
                  maxlength="100"></textarea>
                <label class="input-label">Remarks</label>

              </div>
            </aside>


            <aside class="col-md-4">
              <div class="custom-form-group" [class.filled]="!!currencyExchangeForm.get('status')?.value">
                <select id="status" formControlName="status" class="custom-input-field sm">
                  <option *ngFor="let status of statusList" [value]="status">{{status}}</option>
                </select>
                <label for="status" class="input-label">Status <span class="text-danger fw-bold">*</span></label>
                <div *ngIf="currencyExchangeForm.get('status').touched && currencyExchangeForm.get('status').errors"
                  class="text-danger">
                  <div *ngIf="currencyExchangeForm.get('status').errors['required']">Required</div>
                </div>
              </div>
            </aside>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
