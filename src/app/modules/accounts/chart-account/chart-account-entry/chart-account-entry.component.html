<div class="row compact-form" [formGroup]="chartForm">
    <div class="col-12">
        <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
            <div class="col-md-4 pb-2">
                <h4 class="page-title mb-0">Chart of Accounts</h4>
            </div>
            <div class="col-md-8 pb-2">
                <div
                    class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    
 <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" *ngIf="isEditMode"
                  (click)="openAuditLogs(auditLogModal)">
            <i class="fas fa-history me-1"></i>Logs
          </button>

                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                        (click)="nagivateback()">
                        <i class="fas fa-chevron-left me-1"></i>
                        Back
                    </button>
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                        (click)="onReset()">
                        <i class="fas fa-sync-alt me-1"></i>
                        Reset
                    </button>
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" (click)="onSubmit()"
                        [disabled]="chartForm.invalid">
                        <i class="fas fa-save me-1"></i>
                         {{isEditMode ? 'Update' : 'Save' }}
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-12">
        <div class="card h-100 mb-0">
            <div class="card-body rounded">
                <div class="row">


                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" formControlName="LedgerName" class="custom-input-field sm"
                                placeholder="" />
                            <label class="input-label"> Name <span class="text-danger">*</span></label>
                            <div class="error-message"
                                *ngIf="chartForm.get('LedgerName')?.touched && chartForm.get('LedgerName')?.invalid">
                                <span>Required</span>
                            </div>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="LedgerCode">
                            <label for="text-input" class="input-label">Code <span class="text-danger">*</span></label>
                            <div class="error-message"
                                *ngIf="chartForm.get('LedgerCode')?.touched && chartForm.get('LedgerCode')?.invalid">
                                <span> Required</span>
                            </div>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="LedgerCurrency" [items]="currencyList" bindLabel="currencyName"
                                bindValue="CurrencyMasterSid" placeholder="Select Currency">
                            </ng-select>
                            <label class="input-label">Currency Code</label>
                        </div>
                    </aside>

                    <div class="row my-1">
                        <aside class="col-6 col-md-2 mt-2">
                            <div class="form-check">
                                <input type="radio" id="asset" class="form-check-input" name="accountType" />
                                <label for="asset" class="form-check-label">Asset</label>
                            </div>
                        </aside>

                        <aside class="col-6 col-md-2 mt-2">
                            <div class="form-check">
                                <input type="radio" id="liability" class="form-check-input" name="accountType" />
                                <label for="liability" class="form-check-label">Liability</label>
                            </div>
                        </aside>

                        <aside class="col-6 col-md-2 mt-2">
                            <div class="form-check">
                                <input type="radio" id="equity" class="form-check-input" name="accountType" />
                                <label for="equity" class="form-check-label">Equity</label>
                            </div>
                        </aside>

                        <aside class="col-6 col-md-2 mt-2">
                            <div class="form-check">
                                <input type="radio" id="Income" class="form-check-input" name="accountType" />
                                <label for="Income" class="form-check-label">Income</label>
                            </div>
                        </aside>

                        <aside class="col-6 col-md-2 mt-2">
                            <div class="form-check">
                                <input type="radio" id="Expense" class="form-check-input" name="accountType" />
                                <label for="Expense" class="form-check-label">Expense</label>
                            </div>
                        </aside>
                    </div>

                        <aside class="col-md-4 my-3">
                            <div class="form-check">
                                <input type="checkbox" id="ISSR" class="form-check-input"
                                    [checked]="isSubledgerRequired" (change)="onSubledgerChange($event)" />
                                <label for="ISSR" class="form-check-label">Is Subledger Required</label>
                            </div>
                        </aside>

                        <aside class="col-md-4" *ngIf="isSubledgerRequired">
                            <div class="custom-form-group">
                                <input type="text" id="SubledgerName" placeholder="" class="form-control"
                                    formControlName="SubledgerName" />
                                <label for="ledgerName" class="input-label">SubLedger Name</label>
                                <div class="error-message"
                                    *ngIf="chartForm.get('SubledgerName')?.touched && chartForm.get('SubledgerName')?.invalid">
                                    <span>SubledgerName is required</span>
                                </div>
                            </div>
                        </aside>


                    </div> -->

                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="SubledgerName">
                            <label for="text-input" class="input-label">SubledgerName <span
                                    class="text-danger">*</span></label>
                            <div class="error-message"
                                *ngIf="chartForm.get('SubledgerName')?.touched && chartForm.get('SubledgerName')?.invalid">
                                <span> Required</span>
                            </div>
                        </div>

                    </aside>



                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="GroupName">
                            <label for="text-input" class="input-label">Group<span class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="SubGroupName">
                            <label for="text-input" class="input-label">Sub Group</label>
                        </div>
                    </aside>
                    <aside class="col-md-4 mt-3 mt-md-0">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="Category" [items]="modeOfCategory" bindLabel="name"
                                bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">Category <span class="text-danger"></span></label>
                            <div class="error-message"
                                *ngIf="chartForm.get('Category')?.touched && chartForm.get('Category')?.invalid">
                                <span>Required</span>
                            </div>
                        </div>
                    </aside>
                    <aside class="col-md-4 mt-3 mt-md-0">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="LedgerType" [items]="modeOfReportType" bindLabel="name"
                                bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">Report Type <span class="text-danger"></span></label>
                            <div class="error-message"
                                *ngIf="chartForm.get('reportType')?.touched && chartForm.get('reportType')?.invalid">
                                <span>Required</span>
                            </div>
                        </div>
                    </aside>

                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <textarea id="" placeholder="" rows="1" class="custom-input-field sm"
                                formControlName="Remarks"></textarea>
                            <label for="text-input" class="input-label">Remarks </label>
                        </div>
                    </aside>



                    <aside class="col-md-4">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-container *ngIf="isEditMode; else readOnlyStatus">
                                <ng-select formControlName="Status" [items]="modeOfStatus" bindLabel="name"
                                    bindValue="name" placeholder="Select status" class="ng-select">
                                </ng-select>
                            </ng-container>
                            <ng-template #readOnlyStatus>
                                <input type="text" name="Status" class="custom-input-field sm" formControlName="Status"
                                    id="text-input" readonly>
                            </ng-template>

                            <label for="text-input" class="input-label">Status <span class="text-danger"></span></label>


                        </div>
                    </aside>




                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #auditLogModal let-modal>
  <div class="modal-header bg-info text-white p-2">
    <h5 class="modal-title mb-0">Audit Logs</h5>
    <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body p-3">
  <div class="table-responsive">
    <table class="table  align-middle no-wrap table-bordered table-sm mb-0">
      <thead>
        <tr>
          <th>Changed At</th>
          <th>Changed By</th>
          <th>Operation</th>
          <th class="text-center">Old Value</th>
          <th class="text-center">New Value</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of auditLogs">
          <td>{{ log.changedAt | date:'medium' }}</td>
          <td>{{ log.changedBy || '-' }}</td>
          <td>{{ log.operation }}</td>
          <td class="bg-light-danger">
        <ul>
          <li *ngFor="let field of log.oldValDisplay">{{ field }}</li>
        </ul>
      </td>
      <td class="bg-light-success">
        <ul>
          <li *ngFor="let field of log.newValDisplay">{{ field }}</li>
        </ul>
      </td>
        </tr>
        <tr *ngIf="auditLogs.length === 0">
          <td colspan="6" class="text-center text-muted py-3">No audit logs found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.close()">Close</button>
  </div>
</ng-template>
