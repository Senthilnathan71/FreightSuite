<div class="row py-3">
    <div class="col-md-4">
        <div class="card h-100 mb-0">
            <div class="card-body">
                <h5>Active</h5>
                <!-- Trigger the Angular Modal -->
                <button type="button" class="btn btn-info btn-sm" (click)="openModal(content)">
                    Shortcuts
                </button>
            </div>
        </div>
    </div>
</div>


<ng-template #content let-modal>

    <div class="modal-header bg-info text-white d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <h4 class="modal-title mb-0">Shortcuts</h4>
        </div>
        <div class="d-flex align-items-center gap-3">
            <i class="fas fa-edit" style="cursor: pointer;" (click)="openEditModal(modal)"></i>
            <i-feather name="plus-circle" class="feather-sm" style="cursor: pointer;"
                (click)="openAddNew(modal)"></i-feather>
            <button type="button" class="btn-close btn-close-white" aria-label="Close"
                (click)="modal.dismiss()"></button>
        </div>
    </div>

    <div class="modal-body p-0">
        <form>
            <div class="col-md-12 p-0">
                <div class="card h-100 mb-0">
                    <div class="card-body p-0">

                        <div class="row g-0">

                            <div class="col-6 border-end border-bottom p-5 text-center">
                                <div class="d-flex justify-content-center align-items-center mb-2 mx-auto"
                                    style="width: 50px; height: 50px; background-color: #f0f0f0; border-radius: 50%;">
                                    <i class="fas fa-plus text-dark" style="font-size: 20px;"></i>
                                </div>
                                <h4 class="fw-semibold text-primary">DocType</h4>
                                <p class="text-muted">Product DocType</p>
                            </div>



                            <div class="col-6 border-bottom border-end p-5 text-center">
                                <div class="d-flex justify-content-center align-items-center mb-2 mx-auto"
                                    style="width: 50px; height: 50px; background-color: #f0f0f0; border-radius: 50%;">
                                    <i class="fas fa-cubes text-dark" style="font-size: 20px;"></i>
                                </div>
                                <h4 class="fw-semibold text-primary">Partner Product</h4>
                                <p class="text-muted">partner product list</p>
                            </div>


                            <div class="col-6 border-end p-5 text-center">
                                <div class="d-flex justify-content-center align-items-center mb-2 mx-auto"
                                    style="width: 50px; height: 50px; background-color: #f0f0f0; border-radius: 50%;">
                                    <i class="fas fa-shopping-cart text-dark" style="font-size: 20px;"></i>
                                </div>
                                <h4 class="fw-semibold text-primary">Order</h4>
                                <p class="text-muted">Order List</p>
                            </div>


                            <div class="col-6 p-5 text-center border-end">
                                <div class="d-flex justify-content-center align-items-center mb-2 mx-auto"
                                    style="width: 50px; height: 50px; background-color: #f0f0f0; border-radius: 50%;">
                                    <i class="fas fa-cubes text-dark" style="font-size: 20px;"></i>
                                </div>
                                <h4 class="fw-semibold text-primary">Workflow 🧸</h4>
                                <p class="text-muted">Active</p>
                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </form>
    </div>

</ng-template>





<ng-template #addNewModal let-modal>
    <div class="modal-header bg-info text-white">
        <h5 class="modal-title">Shortcuts - <b>Add new</b></h5>
        <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">Label <span class="text-danger fw-semibold">*</span></label>
            <input type="text" class="form-control" />
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" class="form-control" />
        </div>
        <div class="mb-3">
            <label class="form-label">Link <span class="text-danger fw-semibold">*</span></label>
            <input type="text" class="form-control" value="/dashboard" />
        </div>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" checked />
            <label class="form-check-label">Use router for the link</label>
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-primary">Add</button>
    </div>
</ng-template>
