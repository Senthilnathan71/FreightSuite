<div class="row compact-form" [formGroup]="form">
    <div class="col-12 px-0">
        <div class="row bg-white mb-1 align-items-center pt-1 rounded shadow-sm mx-0">
            <div class="col-md-4 d-flex pb-1">
                <div class="d-flex align-items-center gap-2">
                    <div class="brand-icon">
                        <i class="fas fa-file-invoice"></i>
                    </div>
                    <h5 class="page-title mb-0 text-info">Voucher Matching</h5>
                </div>
            </div>
            <div class="col-md-8 pb-1">
                <div
                    class="d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                        (click)="navigateToBack()">
                        <i class="fas fa-chevron-left me-1"></i>
                        Back
                    </button>
                    <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-sync-alt me-1"></i>
                        Reset
                    </button>
                    <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                        <i class="fas fa-save me-1"></i>
                        Save
                    </button>

            <button type="button" class="btn btn-light-secondary btn-sm has-arrow" id="dropdownBasic1"
              ngbDropdownToggle>
              <i class="fas fa-ellipsis-v"></i>
            </button>
            <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
              <button class="text-dark" ngbDropdownItem appPreventMultiClick><i
                  class="fas fa-file-alt me-1"></i> Edoc</button>
              <button class="text-dark" ngbDropdownItem appPreventMultiClick><i
                  class="fas fa-clipboard me-1"></i> Terms & Condition</button>
              <button class="text-dark" ngbDropdownItem appPreventMultiClick><i
                  class="fas fa-shield-alt me-1"></i> Authorize</button>
              <button class="text-dark" ngbDropdownItem appPreventMultiClick><i
                  class="fas fa-envelope me-1"></i> Email</button>
            </div>
          </div>  -->
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 px-0">
        <div class="card mb-1">
            <div class="card-body py-1">
                <form>
                    <div class="row">
                        <aside class="col-md-2 d-md-block d-none ps-md-5 ms-md-5">

                        </aside>

                        <aside class="col-md-2 pe-md-2">
                            <div class="custom-form-group">
                                <input type="text" formControlName="" class="custom-input-field sm" placeholder="" />
                                <label class="input-label">Matching No. <span class="text-danger"></span></label>
                            </div>
                        </aside>

                        <aside class="col-md-2 mx-5">
                            <div class="custom-form-group custom-form-group-select-date">
                                <div class="input-group">
                                    <input class="form-control mb-0" placeholder="dd-mm-yyyy" name="dp" ngbDatepicker
                                        #d2="ngbDatepicker" (click)="d2.toggle()" readonly formControlName="" />

                                    <button class="btn  bi bi-calendar3" (click)="d2.toggle()" type="button">
                                        <i-feather name="calendar" class="feather-sm"></i-feather>
                                    </button>
                                </div>

                                <label class="input-label" for="dp">Matching Date <span
                                        class="text-danger">*</span></label>
                            </div>
                        </aside>

                        <aside class="col-md-2 mx-5">
                            <div class="custom-form-group custom-form-group-select-date">
                                <div class="input-group">
                                    <input class="form-control mb-0" placeholder="dd-mm-yyyy" name="dp" ngbDatepicker
                                        #d2="ngbDatepicker" (click)="d2.toggle()" readonly formControlName="" />

                                    <button class="btn  bi bi-calendar3" (click)="d2.toggle()" type="button">
                                        <i-feather name="calendar" class="feather-sm"></i-feather>
                                    </button>
                                </div>
                                <label class="input-label" for="dp">Posted Date <span
                                        class="text-danger">*</span></label>
                            </div>
                        </aside>


                        <aside class="col-md-2  d-md-block d-none">

                        </aside>

                        <aside class="col-md-2 d-md-block d-none ps-md-5 ms-md-5">

                        </aside>

                        <aside class="col-md-2">
                            <div class="custom-form-group custom-form-group-select">
                                <ng-select formControlName="" bindLabel="name" bindValue="name" placeholder="">
                                </ng-select>
                                <label class="input-label">Ledger <span class="text-danger"></span></label>
                            </div>
                        </aside>

                        <aside class="col-md-2 mx-5">
                            <div class="custom-form-group custom-form-group-select">
                                <label class="input-label">Subledger <span class="text-danger"></span></label>

                                <div class="d-flex align-items-center gap-2">
                                    <ng-select formControlName="subledger" bindLabel="name" bindValue="name"
                                        placeholder="" class="flex-grow-1"></ng-select>

                                    <button type="button" class="btn btn-info btn-sm dofi-min-w-50 dofi-max-w-50">
                                        Get
                                    </button>
                                </div>
                            </div>
                        </aside>


                        <aside class="col-md-2 mx-5">
                            <div class="custom-form-group custom-form-group-select">
                                <ng-select formControlName="" [items]='status' bindLabel="name" bindValue="name"
                                    placeholder="">
                                </ng-select>
                                <label class="input-label"> Status <span class="text-danger">*</span></label>
                            </div>
                        </aside>

                        <aside class="col-md-2 d-md-block d-none">
                            <div class="custom-form-group">

                            </div>
                        </aside>


                        <aside class="col-md-2 ">
                            <div class="custom-form-group">

                            </div>
                        </aside>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-sm btn-info" (click)="addDetails()">
            <i class="fas fa-plus"></i> Add Details
        </button>
    </div>

    <div class="col-12 mt-1" formArrayName="voucherMatching">
        <div class="table-responsive table-borderless">
            <table class="table table-hover align-middle no-wrap table-sm mb-0 ">
                <thead class="bg-info">
                    <tr>
                        <th class="" width="3%"></th>
                        <th class="" style="min-width:100px"></th>
                        <th class="" style="min-width:100px"></th>
                        <th class="" style="min-width:100px"></th>
                        <th colspan="9" class="matching-header bg-warning text-center fw-bold" style="color: black;">OS
                            Vouchers</th>
                        <th colspan="4" class="matching-header  text-center fw-bold"
                            style="color: black; background-color: rgb(211, 74, 74)">Matching</th>
                        <th class="" style="min-width:100px"></th>
                        <th class="" style="min-width:100px"></th>
                    </tr>
                    <tr>
                        <th class="bg-transparent text-light" width="3%"></th>
                        <th class="bg-transparent text-light" rowspan="4" style="min-width:140px">Branch</th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:140px">Ledger</th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:80px">Voucher No. <span
                                class="text-danger"></span></th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">Voucher Type <span
                                class="text-danger"></span></th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">Voucher Date <span
                                class="text-danger"></span></th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:80px">Dr/Cr <span
                                class="text-danger"></span></th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:80px">Curr. <span
                                class="text-danger"></span></th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">Ex.Rate <span
                                class="text-danger"></span></th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">Curr.Amt <span
                                class="text-danger"></span></th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">Local Amt <span
                                class="text-danger"></span></th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">OS Curr.Amt <span
                                class="text-danger"></span></th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">OS Local Amt</th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">Curr.</th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">Ex.Rate</th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">Curr Amt</th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">Local Amt</th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">TDS Amt</th>
                        <th class="bg-transparent text-light" rowspan="2" style="min-width:100px">Balance</th>
                    </tr>


                </thead>

                <tbody>
                    <tr *ngFor="let row of voucherMatching.controls; let i = index" [formGroupName]="i">
                        <td class="text-center">
                            <button type="button" class="btn btn-sm border-0 " (click)="deleteRow(i)">
                                <i class="fas fa-trash text-danger"></i>
                            </button>
                        </td>

                        <td>
                            <ng-select bindLabel="name" bindValue="id" formControlName="branch"
                                appendTo="body"></ng-select>
                        </td>

                        <!-- <td>
                            <dofi-searchable-dropdown [items]="dropdownStore.countries()"
                                formControlName="CountryMasterSid" placeholder=""
                                [displayFields]="countryLookupConfig.displayFields"
                                [displayLabels]="countryLookupConfig.displayLabels"
                                [labelFields]="countryLookupConfig.labelFields" bindValue="CountryMasterSid">
                            </dofi-searchable-dropdown>
                        </td> -->


                        <td>
                            <ng-select bindLabel="name" bindValue="id" formControlName="ledger"
                                appendTo="body"></ng-select>
                        </td>

                        <td>
                            <input type="text" formControlName="voucherNo" class="form-control" />
                        </td>

                        <td>
                            <input type="text" formControlName="voucherType" class="form-control" />
                        </td>

                        <td>
                            <ng-select bindLabel="name" bindValue="id" formControlName="voucherDate"
                                appendTo="body"></ng-select>
                        </td>

                        <td style="width: 73%;">
                            <ng-select bindLabel="name" bindValue="id" formControlName="drcr"
                                appendTo="body"></ng-select>
                        </td>

                        <td>
                            <ng-select bindLabel="name" bindValue="id" formControlName="curr"
                                appendTo="body"></ng-select>
                        </td>

                        <td>
                            <input type="text" formControlName="exRate" class="form-control" />
                        </td>

                        <td>
                            <input type="text" formControlName="currAmt" class="form-control" />
                        </td>

                        <td>
                            <input type="text" formControlName="localAmt" class="form-control" />
                        </td>

                        <td>
                            <input type="text" formControlName="oscurrAmt" class="form-control" />
                        </td>

                        <td>
                            <input type="text" formControlName="oslocalAmt" class="form-control" />
                        </td>

                        <td>
                            <input type="text" formControlName="curr" class="form-control" />
                        </td>

                        <td>
                            <input type="text" formControlName="exRate" class="form-control" />
                        </td>

                        <td>
                            <input type="text" formControlName="currAmt" class="form-control" />
                        </td>

                        <td>
                            <input type="text" formControlName="localAmt" class="form-control" />
                        </td>

                        <td>
                            <input type="text" formControlName="tdsAmt" class="form-control" />
                        </td>

                        <td>
                            <input type="text" formControlName="balance" class="form-control" />
                        </td>

                    </tr>




                    <!-- <tr class="pt-2">
                        <td colspan="17" class="pt-1">
                            <div class="d-flex align-items-center gap-5 justify-content-center align-items-end">
                                <div class="d-flex align-items-center justify-content-between">
                                    <strong>Total :</strong>
                                    <p class="mb-0">xxx</p>
                                    <p class="mb-0">xxx</p>
                                    <p class="mb-0">xxx</p>
                                    <p class="mb-0">xxx</p>
                                </div>
                               
                            </div>
                        </td>
                    </tr> -->

                    <!-- <tr *ngIf="networkArray.length === 0">
                        <td colspan="5" class="text-center text-muted">No records found</td>
                    </tr> -->

                </tbody>
            </table>
        </div>
    </div>

</div>
