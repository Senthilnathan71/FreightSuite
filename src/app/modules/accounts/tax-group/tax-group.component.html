<div class="row py-3">
    <div class="col-12">
        <div class="d-flex align-items-center gap-2 mb-3">
            <button class="btn btn-sm btn-light-secondary ms-auto">Edit</button>
            <button class="btn btn-sm btn-info">Update</button>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">
                    <aside class="col-md-8">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="Name">
                            <label for="text-input" class="input-label">Name <span class="text-danger">*</span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="Code">
                            <label for="text-input" class="input-label">Code <span class="text-danger">*</span></label>
                        </div>
                    </aside>

                    <aside class="col-md-12">
                        <div class="custom-form-group">
                            <textarea id="" placeholder="" rows="1" class="input-field sm"
                                formControlName="Remarks"></textarea>
                            <label for="text-input" class="input-label">Remarks </label>
                        </div>
                    </aside>

                </div>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body">
                <div class="row">

                    <aside class="col-md-8">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="DisplayName">
                            <label for="text-input" class="input-label">Display Name <span
                                    class="text-danger">*</span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="custom-form-group custom-form-group-select">
                            <ng-select formControlName="PortType" [items]="modeOfStatus" bindLabel="name"
                                bindValue="name">

                            </ng-select>
                            <label for="" class="input-label">Status <span class="text-danger">*</span></label>
                        </div>
                    </aside>

                    <aside class="col-md-8">
                        <div class="custom-form-group">
                            <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                formControlName="Category">
                            <label for="text-input" class="input-label">Category <span
                                    class="text-danger"></span></label>
                        </div>
                    </aside>
                    <aside class="col-md-4">
                        <div class="form-check form-check-inline mt-3">
                            <div class="form-check">
                                <input type="checkbox" id="IncludedTax" class="form-check-input">
                                <label for="IncludedTax" class="form-check-label">Included Tax</label>
                            </div>
                        </div>
                    </aside>




                </div>
            </div>
        </div>
    </div>

    <div class="my-3">
        <button class="btn btn-sm btn-info float-end d-flex gap-1"><i-feather name="arrow-down-right"
                class="feather-sm"></i-feather> Add tax Group Detail</button>
    </div>

    <div class="col-md-12">
        <div class="table-responsive">
            <table class="table table-hover align-middle no-wrap table-bordered">
                <thead>
                    <tr class="bg-info">
                        <th class="bg-transparent text-light" scope="col">Action</th>
                        <th class="bg-transparent text-light" scope="col">S.NO</th>
                        <th class="bg-transparent text-light" scope="col">Tax Charge</th>
                        <th class="bg-transparent text-light" scope="col">Description</th>
                        <th class="bg-transparent text-light" scope="col">Calculating%</th>
                        <th class="bg-transparent text-light" scope="col">Eff.Date</th>
                        <th class="bg-transparent text-light" scope="col">Total%</th>
                        <th class="bg-transparent text-light" scope="col">Remarks</th>
                        <th class="bg-transparent text-light" scope="col">Status</th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of [0,1,2,3,4,5,6,7,8]; track $index) {
                    <tr>
                        <td>
                            <i-feather name="edit-3" class="feather-sm ms-2"></i-feather>
                        </td>
                        <td>
                            <div class="text-truncate">OMR</div>
                        </td>
                        <td>
                            <div class="text-truncate">RO</div>
                        </td>
                        <td>
                            <div class="text-truncate">Rial</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <div class="text-truncate">Baizas</div>
                        </td>
                        <td>
                            <span class="bg-light-success px-2  rounded-pill d-inline-flex align-items-center gap-1">
                                <span class="dofi-w-4 dofi-h-4 bg-success d-inline-block rounded"></span>
                                Approved</span>
                        </td>


                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>

</div>
