<div class="sm-dashboard-v2">
  <div class="dashboard-shell">
    <section class="dashboard-hero">
      <div class="hero-accent"></div>
      <div class="hero-glow hero-glow--teal" aria-hidden="true"></div>
      <div class="hero-glow hero-glow--blue" aria-hidden="true"></div>
      <div class="hero-motion" aria-hidden="true">
        <div class="flight-path">
          <i class="fas fa-plane"></i>
        </div>
      </div>

      <div class="hero-top">
        <div class="hero-identity">
          <div class="hero-identity__eyebrow">
            <span class="hero-badge">Sales Manager Dashboard</span>
          </div>
          <div class="hero-identity__title-row">
            <h1 class="hero-title">Performance &amp; Pipeline Control Center</h1>
          </div>
        </div>

        <div class="hero-side">
          <div class="hero-meta">
            <div class="meta-chip">
              <div class="meta-chip__icon"><i class="fas fa-users"></i></div>
              <div class="meta-chip__body">
                <span class="meta-chip__value">{{ salespersons.length }}</span>
                <span class="meta-chip__label">Salesman Count</span>
              </div>
            </div>

            <div class="meta-divider"></div>

            <div class="meta-chip">
              <div class="meta-chip__icon meta-chip__icon--clock"><i class="far fa-clock"></i></div>
              <div class="meta-chip__body">
                <span class="meta-chip__value">{{ lastUpdated ? (lastUpdated | date:'dd MMM yyyy, h:mm a') : '--' }}</span>
                <span class="meta-chip__label">Last Sync</span>
              </div>
            </div>
          </div>

          <button class="meeting-btn" type="button" (click)="openCreateMeetingModal()">
            <i class="fas fa-plus"></i>
            <span>New Meeting</span>
          </button>

          <button class="reset-dashboard-btn" type="button" (click)="resetFilters()">
            <i class="fas fa-rotate-right"></i>
            <span>Refresh</span>
          </button>
        </div>
      </div>

      <div class="hero-filters">
        <div class="preset-toggle-group" aria-label="Date presets">
          <button class="preset-toggle"
                  type="button"
                  [class.active]="activePreset === 'today'"
                  (click)="setPreset('today')">
            Today
          </button>
          <button class="preset-toggle"
                  type="button"
                  [class.active]="activePreset === 'week'"
                  (click)="setPreset('week')">
            This Week
          </button>
          <button class="preset-toggle"
                  type="button"
                  [class.active]="activePreset === 'month'"
                  (click)="setPreset('month')">
            This Month
          </button>
          <button class="preset-toggle"
                  type="button"
                  [class.active]="activePreset === 'lastMonth'"
                  (click)="setPreset('lastMonth')">
            Last Month
          </button>
          <button class="preset-toggle"
                  type="button"
                  [class.active]="activePreset === 'fy'"
                  (click)="setPreset('fy')">
            This FY
          </button>
        </div>

        <div class="custom-range-wrap">
          <button class="custom-range-trigger"
                  type="button"
                  [class.active]="dateDropdownOpen"
                  (click)="toggleDateDropdown($event)">
            <i class="fas fa-calendar-alt"></i>
            <span>Custom Range</span>
            <i class="fas fa-chevron-down chevron" [class.open]="dateDropdownOpen"></i>
          </button>

          <div class="date-dropdown-panel"
               *ngIf="dateDropdownOpen"
               (click)="$event.stopPropagation()">
            <div class="date-dropdown-panel__header">
              <strong>Custom Date Range</strong>
              <span>Choose a precise reporting window</span>
            </div>

            <div class="custom-range">
              <div class="range-field">
                <label>From</label>
                <input class="form-control range-input" placeholder="From"
                       name="dateFromInput"
                       ngbDatepicker #dpFrom="ngbDatepicker" container="body"
                       [(ngModel)]="dateFromInput" (ngModelChange)="onDateChange()"
                       [maxDate]="getMaxDateFrom()" (click)="dpFrom.toggle()" readonly />
              </div>
              <div class="range-field">
                <label>To</label>
                <input class="form-control range-input" placeholder="To"
                       name="dateToInput"
                       ngbDatepicker #dpTo="ngbDatepicker" container="body"
                       [(ngModel)]="dateToInput" (ngModelChange)="onDateChange()"
                       [minDate]="getMinDateTo()" [maxDate]="maxDateTo"
                       (click)="dpTo.toggle()" readonly />
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="content-v2">
      <section class="dashboard-section section-kpis">
        <div class="section-heading">
          <h2>Sales Overview</h2>
          <p class="section-heading__range">{{ salesOverviewDateRangeLabel }}</p>
        </div>

        <app-sm-kpi-cards
          [cards]="primaryKpiCards"
          [loading]="countsLoading"
          [showExpandToggle]="true"
          [isPrimaryRow]="true"
          (cardClicked)="onKpiCardClicked($event)">
        </app-sm-kpi-cards>

        <!-- <div class="expand-toggle-row">
          <button class="expand-toggle" (click)="showAllKpis = !showAllKpis">
            <i class="fas" [ngClass]="showAllKpis ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
            {{ showAllKpis ? 'Hide detailed metrics' : 'Show all 8 metrics' }}
          </button>
        </div> -->

        <!-- <app-sm-kpi-cards *ngIf="showAllKpis"
          [cards]="secondaryKpiCards"
          [loading]="countsLoading"
          [isSecondaryRow]="true"
          (cardClicked)="onKpiCardClicked($event)">
        </app-sm-kpi-cards> -->
      </section>

      <section class="row">
        <section class="col-md-7">
          <!-- <div class="section-heading">
            <h2>12 week trendline</h2>
          </div> -->
      
          <app-sm-trend-chart [data]="weeklyTrend"></app-sm-trend-chart>
        </section>
        <section class="col-md-5">
          <!-- <div class="section-heading">
            <h2>Top performers and action center</h2>
          </div> -->
          <app-sm-top-performers [scoreboard]="scoreboard"></app-sm-top-performers>
        </section>
      </section>

      <section class="dashboard-section">
        <!-- <div class="section-heading">
          <h2>Top performers and action center</h2>
        </div> -->

        <div class="">
          <!-- <app-sm-top-performers [scoreboard]="scoreboard"></app-sm-top-performers> -->
          <app-sm-alerts [alerts]="alerts" [loading]="alertsLoading"
                         [actionCenterItems]="actionCenterItems" [redesignMode]="true">
          </app-sm-alerts>
        </div>
      </section>

      <section class="dashboard-section scoreboard-section" id="scoreboard-section">
        <!-- <div class="section-heading">
          <h2>Sales team overview</h2>
        </div> -->

        <app-sm-scoreboard
          [rows]="scoreboard" [loading]="scoreboardLoading"
          (rowClicked)="onScoreboardRowClicked($event)"
          (remindClicked)="onScoreboardRemindClicked($event)">
        </app-sm-scoreboard>
      </section>

      <ng-container *ngIf="!liteMode">
        <section class="dashboard-section">
          <!-- <div class="section-heading">
            <h2>Meetings board</h2>
          </div> -->

          <app-sm-meetings-board
            [overdue]="meetingsBoard?.overdue || { items: [], totalCount: 0 }"
            [today]="meetingsBoard?.today || { items: [], totalCount: 0 }"
            [upcoming]="meetingsBoard?.upcoming || { items: [], totalCount: 0 }"
            [loading]="meetingsBoardLoading"
            (meetingClicked)="onMeetingClicked($event)"
            (reassignClicked)="openReassignModal($event)">
          </app-sm-meetings-board>
        </section>

        <section class="dashboard-section">
          <!-- <div class="section-heading">
            <h2>Response times and radar view</h2>
          </div> -->

          <div class="row-2col">
            <app-sm-radar-chart [scoreboard]="scoreboard"></app-sm-radar-chart>
            <!-- <app-sm-response-times [data]="responseTimes"></app-sm-response-times> -->
             <app-sm-activity-feed [items]="activityFeed" [loading]="activityLoading"></app-sm-activity-feed>
          </div>
        </section>

        <!-- <section class="dashboard-section">
          <div class="section-heading">
            <h2>Aging and recent activity</h2>
          </div>

          <div class="row-2col">
            <app-sm-aging-chart [data]="aging"></app-sm-aging-chart>
            <app-sm-activity-feed [items]="activityFeed" [loading]="activityLoading"></app-sm-activity-feed>
          </div>
        </section> -->
      </ng-container>
    </div>
  </div>
</div>
