<div class="card mb-0">
  <div class="section-header d-flex align-items-center gap-2">
    <i class="fas fa-trophy" style="color:#E9B949"></i>
    <h3>Top Performers</h3>
  </div>
  <div class="performers-grid">
    <div class="performer-card d-flex align-items-center gap-2" *ngFor="let p of topPerformers" (click)="onPerformerClick(p)" style="cursor: pointer;">
      <div class="rank-badge" [style.color]="getRankColor(p.rank)">
        <i [class]="getRankIcon(p.rank)"></i>
        <span>#{{ p.rank }}</span>
      </div>
      <div class="performer-avatar" [style.background]="p.row.avatarColor">
        {{ p.initials }}
      </div>
      <div class="performer-info">
        <div class="performer-name">{{ p.row.userName }}</div>
        <div class="performer-email">{{ p.row.userEmail }}</div>
      </div>
      <div class="performer-stats">
        <div class="stat-score">{{ p.row.total }}</div>
        <div class="stat-label">total points</div>
      </div>
    </div>
  </div>
</div>
