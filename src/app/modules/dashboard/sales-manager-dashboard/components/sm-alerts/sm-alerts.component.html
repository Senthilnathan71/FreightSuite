<div class="alerts-card">
  <div class="section-header">
    <span class="section-icon danger"><i class="fas fa-exclamation-triangle"></i></span>
    <h3>At-Risk Alerts</h3>
    <span class="badge" *ngIf="alerts.length">{{ alerts.length }}</span>
  </div>

  <div class="skeleton-loader" *ngIf="loading">
    <div class="skeleton-item" *ngFor="let i of [1,2,3]"></div>
  </div>

  <div class="alerts-list" *ngIf="!loading">
    <div class="empty-state" *ngIf="alerts.length === 0">
      <i class="fas fa-shield-alt"></i>
      <p>No alerts — your team is on track!</p>
    </div>

    <div class="alert-item" *ngFor="let alert of alerts"
         [class.danger]="alert.severity === 'danger'"
         [class.warning]="alert.severity === 'warning'"
         [class.info]="alert.severity === 'info'">
      <div class="alert-icon">
        <i [class]="getIcon(alert.alertType)"></i>
      </div>
      <div class="alert-body">
        <div class="alert-header">
          <span class="alert-type">{{ getAlertTypeLabel(alert.alertType) }}</span>
          <span class="severity-badge" [class]="alert.severity">{{ alert.severity }}</span>
        </div>
        <div class="alert-person">{{ alert.salesperson }}</div>
        <div class="alert-desc">{{ alert.description }}</div>
        <div class="alert-count" *ngIf="alert.count">{{ alert.count }} items</div>
      </div>
    </div>
  </div>
</div>
