<div class="filter-bar">
  <label><i class="fa-regular fa-calendar"></i> Period:</label>
  <div class="preset-group">
    <button class="preset-btn" [class.active]="activePreset === 'today'" (click)="setPreset('today')">Today</button>
    <button class="preset-btn" [class.active]="activePreset === 'week'" (click)="setPreset('week')">This Week</button>
    <button class="preset-btn" [class.active]="activePreset === 'month'" (click)="setPreset('month')">This Month</button>
    <button class="preset-btn" [class.active]="activePreset === 'quarter'" (click)="setPreset('quarter')">This Quarter</button>
    <button class="preset-btn" [class.active]="activePreset === 'fy'" (click)="setPreset('fy')">This FY</button>
    <button class="preset-btn" [class.active]="activePreset === 'custom'" (click)="activePreset = 'custom'">Custom</button>
  </div>

  <div class="date-pickers">
    <input class="date-input" placeholder="From"
      ngbDatepicker #dpFrom="ngbDatepicker"
      [(ngModel)]="dateFrom" (ngModelChange)="onDateChange()"
      (click)="dpFrom.toggle()" readonly>
    <span class="date-sep">to</span>
    <input class="date-input" placeholder="To"
      ngbDatepicker #dpTo="ngbDatepicker"
      [(ngModel)]="dateTo" (ngModelChange)="onDateChange()"
      (click)="dpTo.toggle()" readonly>
  </div>

  <div class="separator"></div>

  <label><i class="fa-solid fa-user"></i> Salesperson:</label>
  <select class="sp-select" [(ngModel)]="selectedSalespersonId" (ngModelChange)="onSalespersonChange()">
    <option [ngValue]="null">All Salespersons</option>
    <option *ngFor="let sp of salespersons" [ngValue]="sp.UserMasterSid">{{ sp.userName }}</option>
  </select>

  <div class="separator"></div>

  <button class="refresh-btn" (click)="onRefresh()">
    <i class="fa-solid fa-arrows-rotate"></i> Refresh
  </button>

  <span class="last-updated" *ngIf="lastUpdated">
    <i class="fa-regular fa-clock"></i> Updated: {{ getTimeSinceUpdate() }}
  </span>
</div>
