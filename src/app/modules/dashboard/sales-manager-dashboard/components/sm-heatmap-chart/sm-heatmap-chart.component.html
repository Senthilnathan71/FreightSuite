<div class="card">
  <div class="section-title">
    <div class="title-icon" style="background:#eef2ff;color:#4f46e5"><i class="fa-solid fa-table-cells"></i></div>
    Salesperson Performance Heatmap
  </div>
  <apx-chart *ngIf="chartOptions.series"
    [series]="chartOptions.series"
    [chart]="chartOptions.chart"
    [plotOptions]="chartOptions.plotOptions"
    [dataLabels]="chartOptions.dataLabels"
    [xaxis]="chartOptions.xaxis"
    [yaxis]="chartOptions.yaxis"
    [grid]="chartOptions.grid"
    [tooltip]="chartOptions.tooltip"
  ></apx-chart>
  <div *ngIf="!data?.length" class="empty-state">No heatmap data available</div>
</div>
