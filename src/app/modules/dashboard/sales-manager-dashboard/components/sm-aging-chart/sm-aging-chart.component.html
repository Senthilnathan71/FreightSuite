<div class="card">
  <div class="section-title d-flex align-items-center">
    <div class="title-icon d-flex align-items-center justify-content-center flex-shrink-0" style="background:#fff7ed;color:#f97316"><i class="fas fa-hourglass-start"></i></div>
    Lead Aging by Salesperson
  </div>
  <apx-chart *ngIf="chartOptions.series"
    [series]="chartOptions.series"
    [chart]="chartOptions.chart"
    [plotOptions]="chartOptions.plotOptions"
    [colors]="chartOptions.colors"
    [xaxis]="chartOptions.xaxis"
    [yaxis]="chartOptions.yaxis"
    [legend]="chartOptions.legend"
    [dataLabels]="chartOptions.dataLabels"
    [grid]="chartOptions.grid"
    [tooltip]="chartOptions.tooltip"
  ></apx-chart>
  <div *ngIf="!data?.length" class="empty-state text-center">No aging data available</div>
</div>
