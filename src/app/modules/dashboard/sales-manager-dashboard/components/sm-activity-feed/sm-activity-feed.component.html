<div class="feed-card">
  <div class="section-header">
    <span class="section-icon info"><i class="fa-solid fa-rss"></i></span>
    <h3>Team Activity Feed</h3>
    <span class="live-dot" title="Auto-refreshes every 60s"></span>
  </div>

  <div class="skeleton-loader" *ngIf="loading">
    <div class="skeleton-item" *ngFor="let i of [1,2,3,4]"></div>
  </div>

  <div class="feed-list" *ngIf="!loading">
    <div class="empty-state" *ngIf="items.length === 0">
      <i class="fa-solid fa-inbox"></i>
      <p>No recent activity</p>
    </div>

    <div class="feed-item" *ngFor="let item of items">
      <div class="timeline-marker" [class]="getColorClass(item.activityType)">
        <i [class]="getIcon(item.activityType)"></i>
      </div>
      <div class="feed-body">
        <div class="feed-top">
          <span class="type-badge" [class]="getColorClass(item.activityType)">{{ getTypeLabel(item.activityType) }}</span>
          <span class="feed-time">{{ formatTimeAgo(item.activityDate) }}</span>
        </div>
        <div class="feed-person">{{ item.salesperson }}</div>
        <div class="feed-entity">{{ item.entityName }}</div>
        <div class="feed-details" *ngIf="item.details">{{ item.details }}</div>
      </div>
    </div>
  </div>
</div>
