<div class="feed-card">
  <div class="feed-header">
    <span class="header-icon"><i class="fas fa-rss"></i></span>
    <h3>Team Activity</h3>
    <span class="live-indicator">
      <span class="live-dot"></span>
      LIVE
    </span>
  </div>

  <div class="skeleton-loader" *ngIf="loading">
    <div class="skeleton-row" *ngFor="let i of [1,2,3,4,5]"></div>
  </div>

  <div class="feed-table" *ngIf="!loading">
    <div class="empty-state" *ngIf="items.length === 0">
      <i class="fas fa-inbox"></i>
      <p>No recent activity</p>
    </div>

    <div class="feed-row" *ngFor="let item of items; let i = index"
         [style.animation-delay]="i * 30 + 'ms'">
      <div class="row-indicator" [class]="getColorClass(item.activityType)"></div>
      <div class="row-icon" [class]="getColorClass(item.activityType)">
        <i [class]="getIcon(item.activityType)"></i>
      </div>
      <div class="row-content">
        <span class="row-person">{{ item.salesperson }}</span>
        <span class="row-action">{{ getTypeLabel(item.activityType) }}</span>
        <span class="row-entity">{{ item.entityName }}</span>
      </div>
      <div class="row-time">{{ formatTimeAgo(item.activityDate) }}</div>
    </div>
  </div>
</div>
