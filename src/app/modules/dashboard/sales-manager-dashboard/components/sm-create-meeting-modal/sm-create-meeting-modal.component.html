<div class="modal-header p-2 bg-info">
  <h5 class="modal-title text-white">Add Meeting</h5>
  <button type="button" class="btn-close btn-close-white" (click)="activeModal.dismiss()"></button>
</div>

<form [formGroup]="meetingForm">
  <div class="modal-body">
    <section>
      <div class="row compact-form">
        <aside class="col-md-4">
          <div class="custom-form-group">
            <label class="form-check-label">Lead or Existing Customer</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" formControlName="LeadOrCustomer" value="L">
                <label class="form-check-label">Lead</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" formControlName="LeadOrCustomer" value="C">
                <label class="form-check-label">Customer</label>
              </div>
            </div>
          </div>
        </aside>

        <aside class="col-md-4" *ngIf="meetingForm.get('LeadOrCustomer')?.value === 'L'">
          <div class="custom-form-group custom-form-group-select"
            [class.filled]="!!meetingForm.get('PreCustomerMasterSid')?.value">
            <label class="input-label">Lead <span class="text-danger">*</span></label>
            <ng-select class="ng-select" formControlName="PreCustomerMasterSid" placeholder="">
              <ng-option *ngFor="let item of leadList" [value]="item.PreCustomerMasterSid">
                {{ item.preCustomerName }}
              </ng-option>
            </ng-select>
            <div
              *ngIf="meetingForm.get('PreCustomerMasterSid')?.touched && meetingForm.get('PreCustomerMasterSid')?.invalid"
              class="error-message">
              Required
            </div>
          </div>
        </aside>

        <aside class="col-md-4" *ngIf="meetingForm.get('LeadOrCustomer')?.value === 'C'">
          <div class="custom-form-group custom-form-group-select"
            [class.filled]="!!meetingForm.get('CustomerMasterSid')?.value">
            <label class="input-label">Customer <span class="text-danger">*</span></label>
            <ng-select [items]="customers" bindLabel="CustomerName" bindValue="CustomerMasterSid"
              formControlName="CustomerMasterSid" placeholder="">
            </ng-select>
            <div *ngIf="f['CustomerMasterSid']?.touched && f['CustomerMasterSid']?.invalid" class="error-message">
              Required
            </div>
          </div>
        </aside>

        <aside class="col-md-4">
          <div class="custom-form-group custom-form-group-select"
            [class.filled]="!!meetingForm.get('meetingType')?.value">
            <label class="input-label">Meeting Type <span class="text-danger">*</span></label>
            <ng-select class="ng-select" formControlName="meetingType" placeholder="">
              <ng-option value="Call">Call</ng-option>
              <ng-option value="Visit">Visit</ng-option>
              <ng-option value="eMeeting">eMeeting</ng-option>
            </ng-select>
            <div class="error-message"
              *ngIf="meetingForm.get('meetingType')?.touched && meetingForm.get('meetingType')?.hasError('required')">
              Required
            </div>
          </div>
        </aside>

        <aside class="col-md-4">
          <div class="custom-form-group custom-form-group-select-date w-100">
            <div class="input-group w-100">
              <app-date-time-picker placeholder="dd-mm-yyyy" name="dp" class="w-100"
                formControlName="meetingDate" [inputReadonly]="true"></app-date-time-picker>
            </div>
            <label class="input-label">Meeting Date <span class="text-danger">*</span></label>
            <div class="error-message pb-2 pe-4"
              *ngIf="meetingForm.get('meetingDate')?.touched && meetingForm.get('meetingDate')?.hasError('required')">
              Required
            </div>
          </div>
        </aside>

        <aside class="col-md-4">
          <div class="custom-form-group custom-form-group-select"
            [class.filled]="!!meetingForm.get('meetingDuration')?.value">
            <ng-select [items]="meetingDurations" bindLabel="label" bindValue="value"
              formControlName="meetingDuration" placeholder="">
            </ng-select>
            <label class="input-label">Meeting Duration <span class="text-danger">*</span></label>
            <small *ngIf="f['meetingDuration']?.touched && f['meetingDuration']?.invalid" class="error-message">
              Required.
            </small>
          </div>
        </aside>

        <aside class="col-md-4">
          <div class="custom-form-group custom-form-group-select"
            [class.filled]="!!meetingForm.get('leadAssignTo')?.value">
            <label class="input-label">Salesperson <span class="text-danger">*</span></label>
            <dofi-searchable-dropdown
              [items]="salespersons"
              formControlName="leadAssignTo"
              [placeholder]="''"
              [displayFields]="userLookupConfig.displayFields"
              [displayLabels]="userLookupConfig.displayLabels"
              [labelFields]="userLookupConfig.labelFields"
              [bindValue]="'UserMasterSid'">
            </dofi-searchable-dropdown>
            <div *ngIf="f['leadAssignTo'].touched && f['leadAssignTo'].invalid" class="error-message">
              Required
            </div>
          </div>
        </aside>

        <aside class="col-md-4">
          <div class="custom-form-group custom-form-group-select"
            [class.filled]="!!meetingForm.get('meetingStatus')?.value">
            <label class="input-label">Meeting Status <span class="text-danger">*</span></label>
            <ng-select class="ng-select" formControlName="meetingStatus" placeholder="">
              <ng-option value="Scheduled">Scheduled</ng-option>
              <ng-option value="Confirmed">Confirmed</ng-option>
              <ng-option value="In Progress">In Progress</ng-option>
              <ng-option value="On Hold">On Hold</ng-option>
              <ng-option value="Completed">Completed</ng-option>
            </ng-select>
            <div *ngIf="f['meetingStatus'].touched && f['meetingStatus'].invalid" class="error-message">
              Required
            </div>
          </div>
        </aside>

        <aside class="col-md-4">
          <div class="custom-form-group">
            <textarea class="custom-input-field sm" formControlName="meetingNote" rows="1"></textarea>
            <label class="input-label">Meeting Note <span class="text-danger">*</span></label>
            <div *ngIf="f['meetingNote'].touched && f['meetingNote'].invalid" class="error-message pb-2">
              Required
            </div>
          </div>
        </aside>

        <div class="col-md-4" style="margin-top: -15px;">
          <div>
            <label class="control-label col-form-label">&nbsp;</label>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" formControlName="followUp"
                [checked]="meetingForm.get('followUp')?.value" (change)="toggleFollowUp($event)" />
              <label class="form-check-label">Follow up required?</label>
            </div>
          </div>
        </div>

        <aside class="col-md-4" *ngIf="meetingForm.get('followUp')?.value">
          <div class="custom-form-group custom-form-group-select-date w-100">
            <div class="input-group w-100">
              <app-date-time-picker placeholder="dd-mm-yyyy" name="followUpDp" class="w-100"
                formControlName="followUpDate"></app-date-time-picker>
            </div>
            <label class="input-label me-2">Follow Up Date <span class="text-danger">*</span></label>
            <div *ngIf="f['followUpDate'].touched && f['followUpDate'].invalid" class="error-message pe-4 pb-2">
              Required
            </div>
          </div>
        </aside>

        <aside class="col-md-4" *ngIf="meetingForm.get('followUp')?.value">
          <div class="custom-form-group">
            <textarea class="custom-input-field sm" formControlName="followUpNote" rows="2"></textarea>
            <label class="input-label">Follow Up Note <span class="text-danger">*</span></label>
            <div *ngIf="f['followUpNote'].touched && f['followUpNote'].invalid" class="error-message pb-2">
              Required
            </div>
          </div>
        </aside>
      </div>
    </section>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="activeModal.dismiss()">Cancel</button>
    <button type="button" class="btn btn-info btn-sm" [disabled]="btnDisable" (click)="onSubmit()">
      Save
    </button>
  </div>
</form>
