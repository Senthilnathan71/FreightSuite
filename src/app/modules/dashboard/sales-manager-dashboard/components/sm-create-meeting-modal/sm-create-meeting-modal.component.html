<div class="meeting-modal">
  <div class="modal-header">
    <h5 class="modal-title">
      <i class="fas fa-calendar-plus"></i> Schedule Meeting
    </h5>
    <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <!-- Lead info -->
    <div class="info-card" *ngIf="lead">
      <div class="info-row">
        <span class="info-label">Lead</span>
        <span class="info-value">{{ lead.preCustomerName || lead.companyName || '—' }}</span>
      </div>
    </div>

    <!-- Salesperson -->
    <div class="form-group">
      <label class="form-label">Salesperson <span class="required">*</span></label>
      <select class="form-select" [(ngModel)]="selectedSalespersonId">
        <option [ngValue]="null" disabled>Select a salesperson...</option>
        <option *ngFor="let sp of salespersons" [ngValue]="sp.UserMasterSid">
          {{ sp.userName }} ({{ sp.userEmail }})
        </option>
      </select>
    </div>

    <!-- Date + Time row -->
    <div class="form-row">
      <div class="form-group flex-1">
        <label class="form-label">Meeting Date <span class="required">*</span></label>
        <input class="form-input" placeholder="Select date"
               ngbDatepicker #dp="ngbDatepicker"
               [(ngModel)]="meetingDate"
               (click)="dp.toggle()" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">Time</label>
        <ngb-timepicker [(ngModel)]="meetingTime" [spinners]="false" [meridian]="true" size="small"></ngb-timepicker>
      </div>
    </div>

    <!-- Type -->
    <div class="form-group">
      <label class="form-label">Meeting Type</label>
      <div class="type-options">
        <button *ngFor="let type of meetingTypes"
                class="type-btn" [class.active]="meetingType === type"
                (click)="meetingType = type">
          {{ type }}
        </button>
      </div>
    </div>

    <!-- Notes -->
    <div class="form-group">
      <label class="form-label">Notes</label>
      <textarea class="form-textarea" rows="3" [(ngModel)]="meetingNote" placeholder="Meeting notes (optional)..."></textarea>
    </div>
  </div>

  <div class="modal-footer">
    <button class="btn btn-outline" (click)="activeModal.dismiss()">Cancel</button>
    <button class="btn btn-primary" [disabled]="!isValid" (click)="onSubmit()">
      <i class="fas fa-calendar-plus"></i> Create Meeting
    </button>
  </div>
</div>
