<form [formGroup]="edocform">

    <div class="row compact-form">
        <div class="col-12">
            <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
                <div class="col-md-4 pb-2">
                    <h4 class="page-title mb-0">Edoc</h4>
                    <!-- <button type="button" class="btn-close" aria-label="Close"></button> -->
                </div>
                <div class="col-md-8 pb-2">

                    <div
                        class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                        <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                            (click)="closeTemplate()">
                            <i class="fas fa-chevron-left me-1"></i>
                            Close
                        </button>

                        <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80"
                            (click)="resetForm()">
                            <i class="fas fa-sync-alt me-1"></i>
                            Reset
                        </button>
                        <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                            (click)="onSubmit()">
                            <i class="fas fa-save me-1"></i>
                            Save
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row m-1">
            <div class="col-md-6 pe-md-1 ps-0">
                <div class="card h-100 mb-0">
                    <div class="card-body">
                        <div class="row">


                            <aside class="col-md-6">
                                <div class="custom-form-group">
                                    <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                        formControlName="AttachDocmentNo">
                                    <label for="text-input" class="input-label">Document No <span
                                            class="text-danger"></span></label>
                                    <div class="error-message"
                                        *ngIf="edocform.get('AttachDocmentNo')?.touched && edocform.get('AttachDocmentNo')?.hasError('required')">
                                        Required
                                    </div>
                                </div>
                            </aside>
                            <aside class="col-md-6">
                                <div class=" custom-form-group custom-form-group-select-date">
                                    <div class="input-group ">
                                        <input class="form-control" placeholder="dd-mm-yyyy" name="dp" ngbDatepicker
                                            #d1="ngbDatepicker" (click)="d1.toggle()" formControlName="DocumentDate"
                                            [minDate]="minDate" (keydown.arrowDown)="d1.open()" container="body" />
                                        <button class="btn bi bi-calendar3 " (click)="d1.toggle()" type="button">
                                            <i-feather name="calendar" class="feather-sm"></i-feather></button>
                                    </div>
                                    <label for="" class="input-label"> Date <span class="text-danger"></span>
                                    </label>
                                </div>
                            </aside>


                            <!-- <aside class="col-md-12">
                                <div class="custom-form-group mt-0">
                                    <input type="file" id="file-input" multiple class="custom-input-field sm"
                                        (change)="onFileSelect($event)"
                                        accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.jpg,.jpeg,.png">
                                    <div class="error-message" *ngIf="!selectedFiles && edocform.touched">
                                        File is required
                                    </div>
                                    <div class="file-info" *ngIf="selectedFiles && selectedFiles.length > 0">
                                        <small>{{ selectedFiles.length }} file(s) selected</small>
                                    </div>
                                </div>
                            </aside> -->

                            <aside class="col-md-12">
                                <div class="custom-form-group mt-0">
                                    <input type="file" id="file-input" multiple class="custom-input-field sm"
                                        (change)="onFileSelect($event)"
                                        accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.jpg,.jpeg,.png">


                                    <!-- Error message -->
                                    <div class="error-message"
                                        *ngIf="!selectedFiles && !existingFileName && edocform.touched">
                                        File is required
                                    </div>

                                    <!-- Show newly selected files -->
                                    <div class="file-info" *ngIf="selectedFiles && selectedFiles.length > 0">
                                        <small class="text-success">
                                            <i-feather name="check-circle" class="feather-sm"></i-feather>
                                            {{ selectedFiles.length }} file(s) selected
                                        </small>
                                        <ul class="mb-0 mt-1" style="list-style: none; padding-left: 0;">
                                            <li *ngFor="let file of selectedFiles" style="font-size: 12px;">
                                                📎 {{ file.name }} ({{ formatFileSize(file.size) }})
                                            </li>
                                        </ul>
                                    </div>

                                    <!-- Show existing file from API -->
                                    <div class="file-info existing-file" *ngIf="existingFileName && !selectedFiles">
                                        <small class="text-primary">
                                            <i-feather name="file" class="feather-sm"></i-feather>
                                            Current file: <strong>{{ existingFileName }}</strong>
                                        </small>
                                        <button type="button" class="btn btn-sm btn-link text-danger p-0 ms-2"
                                            (click)="clearExistingFile()" title="Remove and upload new file">
                                            <i-feather name="x" class="feather-sm"></i-feather>
                                        </button>
                                    </div>
                                </div>
                            </aside>
                            <aside class="col-md-8">
                                <div class="custom-form-group">
                                    <input type="text" id="text-input" placeholder="" class="custom-input-field sm"
                                        formControlName="FileName">
                                    <label for="text-input" class="input-label">Flle Name <span
                                            class="text-danger"></span></label>
                                    <div class="error-message"
                                        *ngIf="edocform.get('FileName')?.touched && edocform.get('FileName')?.hasError('required')">
                                        Required
                                    </div>
                                </div>
                            </aside>
                            <aside class="col-md-4">
                                <div class="custom-form-group custom-form-group-select"
                                    [class.filled]="!!edocform.get('Documenttype')?.value">
                                    <ng-select formControlName="Documenttype" [items]="modeOfType" bindLabel="name"
                                        bindValue="name">

                                    </ng-select>
                                    <label for="" class="input-label">Type <span class="text-danger"></span></label>
                                    <div class="error-message"
                                        *ngIf="edocform.get('Documenttype')?.touched && edocform.get('Documenttype')?.hasError('required')">
                                        Required
                                    </div>
                                </div>
                            </aside>
                            <aside class="col-md-6">
                                <div class="custom-form-group custom-form-group-select-date">
                                    <div class="input-group">
                                        <input class="form-control" placeholder="dd-mm-yyyy" name="dp" ngbDatepicker
                                            #d2="ngbDatepicker" (click)="d2.toggle()" formControlName="ReceivedDate"
                                            [minDate]="minDate" (keydown.arrowDown)="d2.open()" container="body" />
                                        <button class="btn bi bi-calendar3" (click)="d2.toggle()" type="button">
                                            <i-feather name="calendar" class="feather-sm"></i-feather>
                                        </button>
                                    </div>
                                    <label for="" class="input-label">Received Date <span
                                            class="text-danger"></span></label>
                                </div>
                            </aside>


                            <aside class="col-md-6">
                                <div class="custom-form-group custom-form-group-select-date">
                                    <div class="input-group ">
                                        <input class="form-control" placeholder="dd-mm-yyyy" name="dp" ngbDatepicker
                                            #d3="ngbDatepicker" (click)="d3.toggle()" formControlName="SentDate"
                                            [minDate]="minDate" (keydown.arrowDown)="d3.open()" container="body" />
                                        <button class="btn bi bi-calendar3 " (click)="d3.toggle()" type="button">
                                            <i-feather name="calendar" class="feather-sm"></i-feather></button>
                                    </div>
                                    <label for="" class="input-label"> Sent Date <span class="text-danger"></span>
                                    </label>
                                </div>
                            </aside>


                            <aside class="col-md-6">
                                <div class="custom-form-group mt-md-1">
                                    <textarea id="textarea-input" class="custom-input-field sm" placeholder="" rows="1"
                                        formControlName="EdocRemarks"></textarea>
                                    <label for="text-input" class="input-label">Remarks</label>
                                </div>
                            </aside>

                            <aside class="col-md-6">
                                <div class="custom-form-group custom-form-group-select mt-md-1">
                                    <ng-select formControlName="EdocStatus" [items]="modeOfStatus" bindLabel="name"
                                        bindValue="id">
                                    </ng-select>
                                    <label for="" class="input-label">Status <span class="text-danger"></span></label>
                                    <div class="error-message"
                                        *ngIf="edocform.get('EdocStatus')?.touched && edocform.get('EdocStatus')?.hasError('required')">
                                        Required
                                    </div>
                                </div>
                            </aside>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mt-md-0 mt-1 ps-md-1">
                <div class="card h-100 mb-0">
                    <div class="card-body">
                        <div class="row">
                            <aside class="col-md-6">
                                <div class="custom-form-group">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input"
                                            [checked]="edocform.get('FollowupRequired')?.value === 'Y'"
                                            (change)="toggleYN('FollowupRequired', $event)"
                                            formControlName="FollowupRequired">
                                        <label class="form-check-label">
                                            Followup Required
                                        </label>
                                    </div>
                                </div>
                            </aside>

                            <aside class="col-md-6">
                                <div class="custom-form-group custom-form-group-select-date"
                                    *ngIf="edocform.get('FollowupRequired')?.value">
                                    <div class="input-group ">
                                        <input class="form-control" placeholder="dd-mm-yyyy" name="dp" ngbDatepicker
                                            #d4="ngbDatepicker" (click)="d4.toggle()" formControlName="FollowupDate"
                                            [minDate]="minDate" (keydown.arrowDown)="d4.open()" container="body" />
                                        <button class="btn bi bi-calendar3 " (click)="d4.toggle()" type="button">
                                            <i-feather name="calendar" class="feather-sm"></i-feather></button>
                                    </div>
                                    <label for="" class="input-label">Followup Date <span class="text-danger"></span>
                                    </label>
                                </div>
                            </aside>


                            <aside class="col-md-6" *ngIf="edocform.get('FollowupRequired')?.value">
                                <div class="custom-form-group">

                                    <ng-select formControlName="FollowupAction" [items]="modeOfAction" bindLabel="name"
                                        bindValue="name">
                                    </ng-select>
                                    <label for="text-input" class="input-label">Followup Action <span
                                            class="text-danger"></span></label>
                                    <div class="error-message"
                                        *ngIf="edocform.get('FollowupAction')?.touched && edocform.get('FollowupAction')?.hasError('required')">
                                        Required
                                    </div>
                                </div>
                            </aside>
                            <aside class="col-md-6" *ngIf="edocform.get('FollowupRequired')?.value">
                                <div class="custom-form-group mt-md-1">
                                    <textarea id="textarea-input" class="custom-input-field sm" placeholder="" rows="1"
                                        formControlName="FollowupRemarks"></textarea>
                                    <label for="text-input" class="input-label">Remarks</label>
                                </div>
                            </aside>
                            <aside class="col-md-6" *ngIf="edocform.get('FollowupRequired')?.value">
                                <div class="custom-form-group mt-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input"
                                            [checked]="edocform.get('Public')?.value === 'Y'"
                                            (change)="toggleYN('Public', $event)" />
                                        <label class="form-check-label">Public</label>
                                    </div>
                                </div>
                            </aside>

                            <aside class="col-md-6" *ngIf="edocform.get('FollowupRequired')?.value">
                                <div class="custom-form-group mt-md-2">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input"
                                            [checked]="edocform.get('sentEmail')?.value === 'Y'"
                                            (change)="toggleYN('sentEmail', $event)" />
                                        <label class="form-check-label">Sent Email</label>
                                    </div>
                                </div>
                            </aside>

                            <aside class="col-md-6" *ngIf="edocform.get('FollowupRequired')?.value">
                                <div class="custom-form-group custom-form-group-select mt-md-1"
                                    [class.filled]="!!edocform.get('FollowupStatus')?.value">
                                    <ng-select formControlName="FollowupStatus" [items]="modeOfStatus" bindLabel="name"
                                        bindValue="id">
                                    </ng-select>
                                    <label for="" class="input-label">Status <span class="text-danger"></span></label>
                                    <div class="error-message"
                                        *ngIf="edocform.get('FollowupStatus')?.touched && edocform.get('FollowupStatus')?.hasError('required')">
                                        Required
                                    </div>
                                </div>
                            </aside>

                        </div>
                    </div>
                </div>
            </div>
        </div>




    </div>
</form>


<!-- Single Div File Preview -->
<div class="col-12">
  <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">

    <!-- File Preview -->
    <div class="file-preview mt-3" style="border:1px solid #ddd; padding:10px;">
      <h5>Preview:</h5>

      <!-- If firstFile exists, preview it -->
      <ngx-doc-viewer 
        *ngIf="firstFile" 
        [url]="firstFileUrl" 
        viewer="google" 
        style="width:100%; height:600px;">
      </ngx-doc-viewer>

      <!-- Otherwise, show dummy PDF -->
      <ngx-doc-viewer 
        *ngIf="!firstFile" 
        [url]="dummyFileUrl" 
        viewer="google" 
        style="width:100%; height:600px;">
      </ngx-doc-viewer>
    </div>

  </div>
</div>
