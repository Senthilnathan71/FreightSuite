<ngx-spinner
  bdColor="rgba(0,0,0,0.8)"
  size="medium"
  color="#fff"
  type="ball-scale-ripple"
  [fullScreen]="true">
  <p style="color: white;" class="m-0">Loading...</p>
</ngx-spinner>
<div class="row compact-form">
  <div class="col-12 px-0">
    <!-- Header -->
    <div class="row bg-white mb-1 align-items-center pt-1 rounded shadow-sm mx-0">
      <div class="col-md-4 d-flex pb-1">
        <div class="d-flex align-items-center gap-2">
          <div class="brand-icon">
            <i class="fas fa-users-cog"></i>
          </div>
          <h5 class="page-title mb-0 text-info">
            {{ isEditMode ? 'Edit' : 'Add' }} Role Menu
          </h5>
        </div>
      </div>
      <div class="col-md-8 pb-1">
        <div class="d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
          <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" (click)="navigateBack()">
            <i class="fas fa-chevron-left me-1"></i>
            Back
          </button>
          <button type="button" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" (click)="resetForm()">
            <i class="fas fa-sync-alt me-1"></i>
            Reset
          </button>
          <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" 
            (click)="onSubmit()" 
            [disabled]="roleMenuForm.invalid || isLoading">
            <i class="fas fa-save me-1"></i>
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Form -->
    <form [formGroup]="roleMenuForm" class="px-0">
      <div class="col-md-12">
        <!-- Header Fields Card -->
        <div class="card mb-1">
          <div class="card-body">
            <div class="row">
              <!-- Role Name -->
              <aside class="col-md-3">
                <div class="custom-form-group custom-form-group-select" 
                  [class.filled]="!!roleMenuForm.get('RoleMasterSid')?.value">
                  <ng-select 
                    class="ng-select" 
                    [items]="roleList" 
                    bindLabel="UserRoleName" 
                    bindValue="RoleMasterSid"
                    placeholder="" 
                    formControlName="RoleMasterSid"
                    [disabled]="isLoading"
                  >
                  </ng-select>
                  <label for="role-select" class="input-label">
                    Role Name <span class="text-danger">*</span>
                  </label>
                  <div class="error-message" 
                    *ngIf="roleMenuForm.get('RoleMasterSid')?.touched && roleMenuForm.get('RoleMasterSid')?.invalid">
                    <span *ngIf="roleMenuForm.get('RoleMasterSid')?.hasError('required')">
                      Role is required
                    </span>
                  </div>
                </div>
              </aside>

              <!-- Modules -->
              <aside class="col-md-3">
                <div class="custom-form-group custom-form-group-select"
                  [class.filled]="!!roleMenuForm.get('Modules')?.value?.length">
                  <!-- <ng-select 
                    class="ng-select" 
                    [items]="moduleList" 
                    bindLabel="ModuleName"
                    bindValue="ModuleMasterSid" 
                    [multiple]="true"
                    (change)="onModuleChange($event)" 
                    placeholder=""
                    formControlName="Modules"
                    [disabled]="isLoading"
                  >
                  </ng-select> -->
                    <multi-select 
                        [control]="roleMenuForm.get('Modules')" 
                        [items]="moduleList" 
                        bindLabel="ModuleName" 
                        bindValue="ModuleMasterSid"
                        placeholder=""
                        (valueChange)="onModuleChange($event)"
                    >
                    </multi-select>
                  <label for="module-select" class="input-label">
                    Module <span class="text-danger">*</span>
                  </label>
                  <div class="error-message" 
                    *ngIf="roleMenuForm.get('Modules')?.touched && roleMenuForm.get('Modules')?.invalid">
                    <span *ngIf="roleMenuForm.get('Modules')?.hasError('required')">
                      At least one module is required
                    </span>
                  </div>
                </div>
              </aside>

              <!-- Remarks -->
              <aside class="col-md-3">
                <div class="custom-form-group"
                  [class.filled]="!!roleMenuForm.get('Remarks')?.value">
                  <input 
                    type="text" 
                    class="custom-input-field sm" 
                    id="remarks-input"
                    formControlName="Remarks"
                    placeholder=""
                    [disabled]="isLoading"
                  >
                  <label for="remarks-input" class="input-label">Remarks</label>
                </div>
              </aside>

              <!-- Status -->
              <aside class="col-md-3">
                <div class="custom-form-group custom-form-group-select"
                  [class.filled]="!!roleMenuForm.get('status')?.value">
                  <ng-select 
                    *ngIf="isEditMode"
                    [items]="modeOfStatus" 
                    bindLabel="name" 
                    bindValue="name" 
                    placeholder=""
                    class="ng-select" 
                    formControlName="status"
                    [disabled]="isLoading"
                  >
                  </ng-select>
                  <input 
                    *ngIf="!isEditMode"
                    type="text" 
                    class="custom-input-field sm" 
                    id="status-input"
                    formControlName="status" 
                    readonly
                  >
                  <label for="status-select" class="input-label">Status</label>
                </div>
              </aside>
            </div>
          </div>
        </div>

        <!-- Permissions Table -->
        <div class="col-12 px-0" *ngIf="dynamicMenuList.length > 0">
          <div class="card">
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-hover align-middle table-sm table-bordered">
                  <thead class="bg-info">
                    <tr>
                      <th class="bg-transparent text-light">Module Name</th>
                      <th class="bg-transparent text-light">Menu Name</th>
                      <th class="bg-transparent text-light">Display Name</th>
                      <th class="bg-transparent text-light text-center" style="width: 80px;">Add</th>
                      <th class="bg-transparent text-light text-center" style="width: 80px;">Modify</th>
                      <th class="bg-transparent text-light text-center" style="width: 80px;">View</th>
                      <th class="bg-transparent text-light text-center" style="width: 80px;">Delete</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let menu of dynamicMenuList; let i = index">
                      <!-- Module Name -->
                      <td>{{ menu.ModuleName }}</td>
                      
                      <!-- Menu Name -->
                      <td>{{ menu.MenuName }}</td>
                      
                      <!-- Display Name (Editable) -->
                      <td>
                        <input 
                          type="text" 
                          class="form-control form-control-sm" 
                          [(ngModel)]="menu.DisplayName"
                          [ngModelOptions]="{ standalone: true }"
                          [disabled]="isLoading"
                        />
                      </td>

                      <!-- Add Permission -->
                      <td class="text-center">
                        <input 
                          type="checkbox" 
                          class="form-check-input cursor-pointer"
                          [(ngModel)]="menu.InsertRole"
                          [ngModelOptions]="{ standalone: true }"
                          [disabled]="menu.disableInsert || isLoading"
                        />
                      </td>

                      <!-- Modify Permission -->
                      <td class="text-center">
                        <input 
                          type="checkbox" 
                          class="form-check-input cursor-pointer"
                          [(ngModel)]="menu.UpdateRole"
                          [ngModelOptions]="{ standalone: true }"
                          [disabled]="menu.disableUpdate || isLoading"
                        />
                      </td>

                      <!-- View Permission -->
                      <td class="text-center">
                        <input 
                          type="checkbox" 
                          class="form-check-input cursor-pointer"
                          [(ngModel)]="menu.ViewRole"
                          [ngModelOptions]="{ standalone: true }"
                          [disabled]="menu.disableView || isLoading"
                        />
                      </td>

                      <!-- Delete Permission -->
                      <td class="text-center">
                        <input 
                          type="checkbox" 
                          class="form-check-input cursor-pointer"
                          [(ngModel)]="menu.DeleteRole"
                          [ngModelOptions]="{ standalone: true }"
                          [disabled]="menu.disableDelete || isLoading"
                        />
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div class="col-12 px-0" *ngIf="dynamicMenuList.length === 0 && !isLoading">
          <div class="card">
            <div class="card-body text-center py-5">
              <i class="fas fa-list text-muted" style="font-size: 3rem;"></i>
              <h5 class="text-muted mt-3">No menus available</h5>
              <p class="text-muted">Please select one or more modules to view their menus</p>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
