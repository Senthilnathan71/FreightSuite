<div class="row">
  <div class="col-12">
    <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm mx-0">
      <div class="col-md-4 pb-2">
        <h4 class="page-title mb-0">Email</h4>
      </div>
      <div class="col-md-8 pb-2">
        <div class="row d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
          <button type="button" (click)="closeModal()" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
            <i class="fas fa-chevron-left me-1"></i> Back
          </button>
          <button type="button" (click)="resetForm()" class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80">
            <i class="fas fa-sync-alt me-1"></i> Reset
          </button>
          <button type="button" (click)="saveForm()" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80" [disabled]="emailSending">
            <i class="fas fa-save me-1"></i> Send
          </button>
        </div>
      </div>
    </div>
    <div class="card" [formGroup]="emailForm">
      <div class="card-body">
        <div class="row">
          <div class="d-flex gap-4 align-items-center px-2 mb-2">
            <div class="col-md-5">
              <div class="input-group">
                <input type="text" formControlName="EmailTo" placeholder="To" class="form-control">
                <span class="input-group-text"><i class="fas fa-arrow-right" style="transform: rotate(45deg);"></i></span>
              </div>
            </div>
            <div class="col-md-5">
              <div class="input-group">
                <input type="text" formControlName="EmailCC" placeholder="Cc" class="form-control">
                <span class="input-group-text"><i class="fas fa-arrow-right" style="transform: rotate(45deg);"></i></span>
              </div>
            </div>
            <div class="col-2">
              <button class="btn btn-info btn-sm">
                <i class="fas fa-chevron-down"></i>
              </button>
            </div>
          </div>
          <aside class="col-md-12 mb-3">
            <div class="input-group">
              <input type="text" formControlName="Subject" class="form-control" placeholder="Subject">
            </div>
          </aside>
          <aside class="col-12">
            <textarea name="body" id="body" placeholder="Type Something"
              style="min-height: 300px; overflow-y: auto; width: 100%; resize: none"
              class="rounded" formControlName="Mailbody"></textarea>
          </aside>
        <div class="col-12 mt-2">
            <input type="file" class="d-none" multiple #fileInput (change)="onFileChange($event)">
            <button type="button" (click)="fileInput.click()" class="btn btn-sm btn-outline-secondary">
              <i class="fas fa-paperclip"></i> Attachment
            </button>
            <div *ngIf="selectedFiles.length > 0" class="mt-2">
              <ul class="row ps-0">
                @for(file of selectedFiles;track $index){
                  <div class="col-md-5 border border-info rounded m-2">
                    <li class="list-group-item d-flex justify-content-between align-items-center p-1">
                      <h6 class="pt-1">{{file.name}}</h6>
                      <button type="button" class="btn btn-info text-white btn-sm float-end" (click)="removeFile(file)">X</button>
                    </li>
                  </div>
                }
              </ul>
            </div>
          </div>
      </div>
    </div>
  </div>
</div>
