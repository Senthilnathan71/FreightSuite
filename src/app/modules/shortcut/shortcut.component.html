<ng-template #content let-modal>

    <div class="modal-header bg-info text-white d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <h4 class="modal-title mb-0">Shortcuts</h4>
        </div>
        <div class="d-flex align-items-center gap-3">
            <i class="fas fa-edit" style="cursor: pointer;" (click)="openEditModal(modal)"></i>
            <i-feather name="plus-circle" class="feather-sm" style="cursor: pointer;"
                (click)="openAddNew(modal)"></i-feather>
            <button type="button" class="btn-close btn-close-white" aria-label="Close"
                (click)="modal.dismiss()"></button>
        </div>
    </div>

    <div class="modal-body p-0">
        <div class="col-md-12 p-0">
            <div class="card h-100 mb-0">
                <div class="card-body p-0">

                    <div class="row g-0">
                        <ng-container *ngFor="let row of chunkedShortcuts">
                            <div class="col-6 border-end border-bottom p-5 text-center" *ngFor="let shortcut of row">
                                <div (click)="navigateTo(shortcut)" class="d-flex justify-content-center align-items-center mb-2 mx-auto"
                                    style="width: 50px; height: 50px; background-color: #f0f0f0; border-radius: 50%; cursor: pointer;">
                                    <i class="fas fa-link text-dark" style="font-size: 20px;"></i>
                                </div>
                                <h4 class="fw-semibold text-primary">{{ shortcut.label }}</h4>
                                <p class="text-muted">{{ shortcut.description }}</p>
                            </div>
                        </ng-container>
                    </div>


                </div>
            </div>
        </div>

    </div>

</ng-template>





<ng-template #addNewModal let-modal>
    <form [formGroup]="shortcutForm" (ngSubmit)="onSubmit()">

        <div class="modal-header bg-info text-white">
            <h5 class="modal-title">Shortcuts - <b>Add new</b></h5>
            <button type="button" class="btn-close btn-close-white" aria-label="Close"
                (click)="modal.dismiss()"></button>
        </div>
        <div class="modal-body">
            <div class="mb-3">
                <label class="form-label">Label <span class="text-danger fw-semibold">*</span></label>
                <input formControlName="label" type="text" class="form-control" />
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <input formControlName="description" type="text" class="form-control" />
            </div>
            <div class="mb-3">
                <label class="form-label">Link <span class="text-danger fw-semibold">*</span></label>
                <input formControlName="link" type="text" class="form-control" value="/dashboard" />
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" formControlName="useRouter" checked />
                <label class="form-check-label">Use router for the link</label>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" type="submit" [disabled]="shortcutForm.invalid">Add</button>
        </div>
    </form>
</ng-template>



<ng-template #editModal let-modal>
  <div class="modal-header bg-info text-white d-flex justify-content-between align-items-center">
    <h4 class="modal-title mb-0">Shortcuts - Editing</h4>
    <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body p-0">
    <div class="col-md-12 p-0">
      <div class="card h-100 mb-0">
        <div class="card-body p-0">
          <div class="row g-0">
            <ng-container *ngFor="let row of chunkedShortcutsEdit">
              <div
                class="col-6 border-end border-bottom p-5 text-center"
                *ngFor="let shortcut of row"
                (click)="editShortcut(shortcut, modal)"
                style="cursor: pointer;"
              >
                <div
                  class="d-flex justify-content-center align-items-center mb-2 mx-auto"
                  style="width: 50px; height: 50px; background-color: #f0f0f0; border-radius: 50%;">
                  <i class="fas fa-edit text-dark" style="font-size: 20px;"></i>
                </div>
                <h4 class="fw-semibold text-primary">{{ shortcut.label }}</h4>
                <p class="text-muted">{{ shortcut.description }}</p>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
