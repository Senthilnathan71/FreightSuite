<div class="report-card-container">

  <!-- Spinner while reports list OR permissions are still loading -->
  <ngx-spinner
    [name]="spinnerName"
    bdColor="rgba(0,0,0,0.8)"
    size="medium"
    color="#fff"
    type="ball-scale-ripple"
    [fullScreen]="true"
  >
    <p style="color: white" class="m-0">Loading...</p>
  </ngx-spinner>

  <!-- Empty State -->
  <div *ngIf="!isLoading && reports.length === 0" class="empty-state text-center py-5">
    <i class="mdi mdi-file-chart display-1 text-muted"></i>
    <h5 class="mt-3 text-muted">No Reports Available</h5>
    <p class="text-muted">There are no reports configured for your company.</p>
  </div>

  <!-- Report Cards Grid -->
  <div *ngIf="!isLoading && reports.length > 0" class="row">
    <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6 col-12" *ngFor="let report of reports" >
      <div class="card report-card mb-2"
        [class.report-card-disabled]="!isReportEnabled(report)"
        (click)="onSelectReport(report)"
        [attr.data-report-type]="report.ReportType">
        <div class="card-body d-flex flex-column">
          <!-- Icon Circle with Gradient -->
          <div class="text-center">
            <div class="report-icon-circle" [attr.data-type]="report.ReportType">
              <i [class]="isReportRestricted(report) ? 'mdi mdi-lock' : getReportIcon(report.ReportType)"></i>
            </div>
          </div>

          <!-- Report Title -->
           <h6 class="text-center mb-0 fw-bold">{{ report.ReportDisplayName }}</h6>

          <!-- Report Type & Format Badges -->
          <div class="d-flex justify-content-center gap-1 mb-0">
            <span class="" [attr.data-format]="report.ReportFormat" style="font-size: 12px; font-weight: bold;">
              {{ report.ReportFormat === "BOTH" ? "PDF / XL" : report.ReportFormat }}
            </span>
          </div>

          <!-- Report Details -->
          <div class="report-details text-center mb-0">
            <small class="text-muted">
              <i class="mdi mdi-format-list-bulleted"></i>
              {{ report.ReportMasterDetail?.length || 0 }} Parameters
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
