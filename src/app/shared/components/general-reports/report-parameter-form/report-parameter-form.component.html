<div class="report-parameter-form compact-form">
  <form [formGroup]="parameterForm" (ngSubmit)="onSubmit()">
    <div class="row">

      <!-- Dynamic Parameter Fields -->
      <div
        *ngFor="let param of parameters"
        [ngClass]="{
          'col-md-6': parameters.length > 4,
          'col-md-4': parameters.length <= 4,
          'col-12': parameters.length === 1
        }"
      >

        <div 
          class="custom-form-group" 
          [class.custom-form-group-select]="
          param.ParameterFieldType === 'DROPDOWN' || 
          param.ParameterFieldType === 'DROPDOWN M' ||
          param.ParameterFieldType === 'DATE' " 
          [class.filled]="!!parameterForm.get(param.ParameterName)?.value"
        >

          <!-- CHECKBOX -->
          <div class="form-check mt-3" *ngIf="param.ParameterFieldType === 'CHECKBOX'">
            <input 
              type="checkbox" 
              class="focus-ring form-check-input"
              [id]="param.ParameterName" 
              [formControlName]="param.ParameterName" 
            />
            <label 
              [for]="param.ParameterName" class="form-check-label" 
              >
              {{ getParameterLabel(param.ParameterName) }}
              <span 
                *ngIf="isFieldRequired(param.ParameterName)"
                class="text-danger"
              >*</span>
            </label>
          </div>

          <!-- DATE (NgbDatepicker) -->
          <div *ngIf="param.ParameterFieldType === 'DATE'" class="position-relative">
            <input
              ngbDatepicker
              class="form-control sm"
              [id]="param.ParameterName"
              [formControlName]="param.ParameterName"
              [minDate]="getMinDate(param.ParameterName)"
              [maxDate]="getMaxDate(param.ParameterName)"
              [class.is-invalid]="hasError(param.ParameterName)"
              #dp="ngbDatepicker"
              (click)="dp.toggle()"
            />

            <!-- Calendar icon -->
            <i
              class="mdi mdi-calendar-month-outline calendar-icon"
              (click)="dp.toggle()"
              style="
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                font-size: 18px;
                color: #6c757d;
              "
            ></i>
          </div>

          <!-- NUMBER -->
          <input
            *ngIf="param.ParameterFieldType === 'NUMBER'"
            type="number"
            class="form-control sm"
            [id]="param.ParameterName"
            [formControlName]="param.ParameterName"
            placeholder="Enter {{ getParameterLabel(param.ParameterName) }}"
            [class.is-invalid]="hasError(param.ParameterName)"
          />

          <!-- TEXT -->
          <input
            *ngIf="param.ParameterFieldType === 'TEXT'"
            type="text"
            class="form-control sm"
            [id]="param.ParameterName"
            placeholder=""
            [formControlName]="param.ParameterName"
            [class.is-invalid]="hasError(param.ParameterName)"
          />

          <!-- SINGLE SELECT DROPDOWN -->
          <ng-select
            *ngIf="param.ParameterFieldType === 'DROPDOWN'"
            class="ng-select"
            [items]="getDropdownOptions(param.ParameterName)"
            bindLabel="label"
            bindValue="value"
            [formControlName]="param.ParameterName"
            [clearable]="!isFieldRequired(param.ParameterName)"
            [loading]="isDropdownLoading(param.ParameterName)"
          >

            <ng-template ng-notfound-tmp>
              <div class="text-center py-2">
                <small class="text-muted">No options available</small>
              </div>
            </ng-template>
          </ng-select>

          <!-- MULTI SELECT -->
          <ng-select
            *ngIf="param.ParameterFieldType === 'DROPDOWN M'"
            class="sm"
            [items]="getDropdownOptions(param.ParameterName)"
            [multiple]="true"
            bindLabel="label"
            bindValue="value"
            [formControlName]="param.ParameterName"
            [class.is-invalid]="hasError(param.ParameterName)"
          >

            <ng-template ng-notfound-tmp>
              <div class="text-center py-2">
                <small class="text-muted">No options available</small>
              </div>
            </ng-template>
          </ng-select>

          <!-- YEAR SELECTOR -->
          <ng-select
            *ngIf="param.ParameterFieldType === 'YEAR'"
            class="sm"
            [items]="getDropdownOptions(param.ParameterName)"
            bindLabel="label"
            bindValue="value"
            [formControlName]="param.ParameterName"
            [placeholder]="'Select ' + getParameterLabel(param.ParameterName)"
            [clearable]="!isFieldRequired(param.ParameterName)"
            [class.is-invalid]="hasError(param.ParameterName)"
          ></ng-select>

          <!-- LABEL -->
          <label [for]="param.ParameterName" class="input-label" *ngIf="param.ParameterFieldType !== 'CHECKBOX'">
            {{ getParameterLabel(param.ParameterName) }}
            <span *ngIf="isFieldRequired(param.ParameterName)" class="text-danger">*</span>
          </label>

          <!-- ERROR MESSAGE -->
          <div *ngIf="hasError(param.ParameterName)" class="invalid-feedback d-block">
            {{ getErrorMessage(param.ParameterName) }}
          </div>

          <!-- Loading indicator under dropdown
          <small
            *ngIf="param.ParameterFieldType === 'DROPDOWN' && isDropdownLoading(param.ParameterName)"
            class="form-text text-info"
          >
            <i class="mdi mdi-loading mdi-spin"></i> Loading options...
          </small> -->

        </div>
      </div>
    </div>

    <!-- FORM ACTIONS -->
    <div class="form-actions mt-4 pt-3">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <small class="text-muted">
            <i class="mdi mdi-information-outline"></i>
            <span class="text-danger">*</span> Required fields
          </small>
        </div>
        <div>
          <button
            type="button"
            class="btn btn-secondary mr-2"
            (click)="resetForm()"
            [disabled]="loading"
          >
            <i class="mdi mdi-refresh"></i> Reset
          </button>

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="!isFormValid() || loading"
          >
            <span *ngIf="!loading">
              <i class="mdi mdi-chart-bar"></i> Generate Report
            </span>
            <span *ngIf="loading">
              <span class="spinner-border spinner-border-sm mr-2"></span>
              Generating...
            </span>
          </button>
        </div>
      </div>
    </div>
  </form>

  <!-- NO PARAMETERS -->
  <div *ngIf="parameters.length === 0" class="no-parameters text-center py-4">
    <i class="mdi mdi-format-list-checkbox display-4 text-muted"></i>
    <p class="mt-3 text-muted">No parameters required for this report</p>

    <button
      type="button"
      class="btn btn-primary"
      (click)="onGenerate.emit({})"
      [disabled]="loading"
    >
      <i class="mdi mdi-chart-bar"></i> Generate Report
    </button>
  </div>
</div>
