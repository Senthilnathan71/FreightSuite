<div style="width:100%; padding:10px 20px; box-sizing:border-box;">

  <!-- HEADER ROW -->
  <div style="
      display:flex;
      width:100%;
      align-items:center;
      page-break-inside:avoid;
  ">

    <!-- LEFT SLOT -->
    <div style="flex:1; text-align:left;">
      <ng-container *ngIf="logoPosition === 'left'">
        <img [src]="(logoService.reportLogo$ | async)" style="width:100px; height:100px;" />
      </ng-container>

      <ng-container *ngIf="companyPosition === 'left'">
        <ng-container *ngTemplateOutlet="companyDetails; context:{ alignment: companyAlignment }">
        </ng-container>
      </ng-container>
    </div>

    <!-- CENTER SLOT -->
    <div style="flex:1; text-align:center;">
      <ng-container *ngIf="logoPosition === 'center'">
        <img [src]="(logoService.reportLogo$ | async)" style="width:auto; height:100px;" />
      </ng-container>

      <ng-container *ngIf="companyPosition === 'center'">
        <ng-container *ngTemplateOutlet="companyDetails; context:{ alignment:companyAlignment }">
        </ng-container>
      </ng-container>
    </div>

    <!-- RIGHT SLOT -->
    <div style="flex:1; text-align:right;">
      <ng-container *ngIf="logoPosition === 'right'">
        <img [src]="(logoService.reportLogo$ | async)" style="width:100px; height:100px;" />
      </ng-container>

      <ng-container *ngIf="companyPosition === 'right'">
        <ng-container *ngTemplateOutlet="companyDetails; context:{ alignment:companyAlignment }">
        </ng-container>
      </ng-container>
    </div>

  </div>
</div>

<!-- COMPANY DETAILS TEMPLATE -->
<ng-template #companyDetails let-alignment="alignment">
  <div [style.text-align]="alignment" style="
      line-height:1.3;
      white-space:nowrap;
    ">
    <div style="font-size:20px; font-weight:900; text-transform:uppercase;">
      {{ currentCompany?.companyName || 'XXXX COMPANY NAME' }}
    </div>

    <div style="font-size:16px; font-weight:700;">
      {{ currentBranch?.branchName || 'XXXX BRANCH NAME' }}
    </div>

    <div style="font-size:13px;">
      {{ currentBranch?.addressLine1 || '' }}
    </div>

    <div style="font-size:13px;">
      {{ currentBranch?.addressLine2 || '' }}
      <ng-container *ngIf="currentBranch?.cityMaster?.cityName">
        , {{ currentBranch.cityMaster.cityName }}
      </ng-container>
      <ng-container *ngIf="currentBranch?.postalCode">
        , {{ currentBranch.postalCode }}
      </ng-container>
      <ng-container *ngIf="currentBranch?.phoneNumber">
        , {{ currentBranch.phoneNumber }}
      </ng-container>
    </div>
  </div>
</ng-template>
