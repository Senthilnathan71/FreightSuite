<div class="col-12">
    <div class="bg-white mb-1 rounded shadow-sm">

        <!-- Row 1: Title | Search | Actions -->
        <div class="row align-items-center pt-1 justify-content-between px-2">

            <!-- Title Section -->
            <div class="col-md pb-1">
                <div class="d-flex align-items-center gap-2">
                    <h5 class="page-title mb-0 text-info">{{ title }}</h5>
                    <app-favorite-star *ngIf="showFavorite" [screenName]="title" class="mt-1 me-1">
                    </app-favorite-star>
                </div>
            </div>

            <!-- Search Section -->
            <div class="col-md pb-1" *ngIf="showSearch">
                <form class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0"
                      (ngSubmit)="onSearch()" (submit)="$event.preventDefault()">
                    <div class="d-flex gap-2 col-12 px-0 align-items-stretch align-items-md-center">
                        <div class="form-outline flex-grow-1 position-relative">
                            <input name="filterValue" type="text" class="form-control pe-5"
                                [placeholder]="searchPlaceholder" [(ngModel)]="searchValue" aria-label="Search input"
                                (keyup.enter)="onSearch(); $event.preventDefault()">
                            <button type="button" *ngIf="searchValue"
                                class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-3 p-1 text-secondary"
                                (click)="onClearSearch()" tabindex="0" aria-label="Clear search" data-bs-toggle="tooltip"
                                data-bs-placement="top" data-bs-title="Clear search"
                                onfocus="this.classList.replace('text-secondary','text-danger')"
                                onblur="this.classList.replace('text-danger','text-secondary')">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="mt-md-0 mt-1">
                            <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                                (click)="onSearch()">
                                <i class="fas fa-search me-1"></i> {{ searchButtonText }}
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Actions Section -->
            <div class="col-md-auto pb-1" *ngIf="actions.length > 0">
                <div
                    class="d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-1 gap-md-2 mx-0">
                    <ng-container *ngFor="let action of actions">
                        <!-- Dropdown Button (if action has children) -->
                        <div *ngIf="action.children && action.children.length > 0 && action.condition !== false"
                             ngbDropdown container="body" class="d-inline-block">
                            <button type="button"
                                    class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
                                    [id]="'dropdown-' + action.action"
                                    [disabled]="action.disabled"
                                    ngbDropdownToggle>
                                <i [class]="action.icon + ' me-1'"></i> {{ action.label }}
                            </button>
                            <div ngbDropdownMenu [attr.aria-labelledby]="'dropdown-' + action.action" class="shadow">
                                <button *ngFor="let child of action.children"
                                        class="dropdown-item text-dark"
                                        ngbDropdownItem
                                        [disabled]="child.disabled"
                                        (click)="onActionClick(child.action)">
                                    <i [class]="child.icon + ' me-2'"></i> {{ child.label }}
                                </button>
                            </div>
                            <!-- Info Icon with Tooltip -->
                            <i *ngIf="action.tooltip"
                               class="fas fa-info-circle text-info ms-1"
                               style="cursor: help;"
                               [ngbTooltip]="action.tooltip"
                               placement="bottom"></i>
                        </div>

                        <!-- Regular Button (if action has no children) -->
                        <button *ngIf="!action.children && action.condition !== false"
                                type="button"
                                [class]="'btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80 ' + (action.cssClass || '')"
                                [disabled]="action.disabled"
                                (click)="onActionClick(action.action)">
                            <i [class]="action.icon + ' me-1'"></i> {{ action.label }}
                            <!-- Info Icon with Tooltip for regular button -->
                            <i *ngIf="action.tooltip"
                               class="fas fa-info-circle text-white-50 ms-1"
                               style="cursor: help; font-size: 0.85em;"
                               [ngbTooltip]="action.tooltip"
                               placement="bottom"
                               (click)="$event.stopPropagation()"></i>
                        </button>
                    </ng-container>
                </div>
            </div>

        </div>

        <!-- Row 2: Filter controls (always visible when config exists) -->
        <div class="d-flex flex-wrap align-items-end gap-2 px-2 py-2 border-top advanced-filter-row"
             *ngIf="hasAnyFilterConfig">

            <!-- Date Type -->
            <div *ngIf="dateTypeConfig?.enabled" class="custom-form-group custom-form-group-select dofi-min-w-100"
            [class.filled]="!!selectedDateType">

                <ng-select
                    [items]="dateTypeConfig!.options"
                    bindLabel="label"
                    bindValue="value"
                    class="ng-select"
                    [(ngModel)]="selectedDateType"
                    (change)="onDateTypeChange()"
                    placeholder=""
                    appendTo="body">
                </ng-select>
                <label class="input-label">Date Type</label>
            </div>

            <!-- Date Range Preset -->
            <div *ngIf="dateRangeConfig?.enabled" class="custom-form-group custom-form-group-select dofi-min-w-160"
            [class.filled]="!!selectedPreset">
                <ng-select
                    class="ng-select"
                    [(ngModel)]="selectedPreset"
                    (change)="onDateRangePresetChange()"
                    placeholder=""
                    appendTo="body">
                    <ng-option [value]="'all'">All Data</ng-option>
                    <ng-option [value]="'last30'">Last 30 Days</ng-option>
                    <ng-option [value]="'thisMonth'">This Month</ng-option>
                    <ng-option [value]="'lastMonth'">Last Month</ng-option>
                    <ng-option [value]="'last2Months'">Last 2 Months</ng-option>
                    <ng-option [value]="'last3Months'">Last 3 Months</ng-option>
                    <ng-option [value]="'custom'">Custom Range</ng-option>
                </ng-select>
                <label class="input-label">Date Range</label>
            </div>

            <!-- Custom From Date -->
            <div class="custom-form-group custom-form-group-select-date mt-md-1 "
            [class.filled]="!!customFromDate"
            *ngIf="dateRangeConfig?.enabled && isCustomRange">
                <label class="input-label">From</label>
                <div class="input-group">
                    <input class="form-control" placeholder="dd-MMM-yyyy" name="customFromDate"
                           [(ngModel)]="customFromDate" ngbDatepicker #dpFrom="ngbDatepicker"
                           (click)="dpFrom.toggle()" (ngModelChange)="onCustomDateChanged()" readonly>
                    <button class="btn bi bi-calendar3 px-0" type="button" (click)="dpFrom.toggle()">
                        <i-feather name="calendar" class="feather-sm"></i-feather>
                    </button>
                </div>
            </div>

            <!-- Custom To Date -->
            <div class="custom-form-group custom-form-group-select-date mt-md-1 "
            [class.filled]="!!customToDate"
            *ngIf="dateRangeConfig?.enabled && isCustomRange">
                <label class="input-label">To</label>
                <div class="input-group">
                    <input class="form-control" placeholder="dd-MMM-yyyy" name="customToDate"
                           [(ngModel)]="customToDate" ngbDatepicker #dpTo="ngbDatepicker"
                           (click)="dpTo.toggle()" (ngModelChange)="onCustomDateChanged()" readonly>
                    <button class="btn bi bi-calendar3 px-0" type="button" (click)="dpTo.toggle()">
                        <i-feather name="calendar" class="feather-sm"></i-feather>
                    </button>
                </div>
            </div>

            <!-- Customer -->
            <div *ngIf="partyFilterConfig?.enabled" class="custom-form-group custom-form-group-select dofi-min-w-100"
            [class.filled]="!!selectedParty">
                <ng-select
                    [items]="partySearchResults"
                    bindLabel="CustomerName"
                    class="ng-select"
                    [(ngModel)]="selectedParty"
                    (change)="onPartySelected($event)"
                    [loading]="partyLoading"
                    [clearable]="true"
                    placeholder=""
                    appendTo="body">
                </ng-select>
                <label class="input-label">{{ partyFilterConfig?.partyTypes?.[0]?.label || 'Customer' }}</label>
            </div>

            <!-- Department -->
            <div *ngIf="departmentFilterConfig?.enabled" class="custom-form-group custom-form-group-select dofi-min-w-100"
            [class.filled]="!!selectedDepartment">
                <ng-select
                    [items]="departmentFilterConfig!.options"
                    [bindLabel]="departmentFilterConfig!.bindLabel"
                    [bindValue]="departmentFilterConfig!.bindValue"
                    class="ng-select"
                    [(ngModel)]="selectedDepartment"
                    (change)="onDepartmentFilterChange()"
                    [clearable]="true"
                    placeholder=""
                    appendTo="body">
                </ng-select>
                <label class="input-label">{{ departmentFilterConfig?.label }}</label>
            </div>

            <!-- POL -->
            <div *ngIf="polFilterConfig?.enabled" class="custom-form-group custom-form-group-select dofi-min-w-150"
            [class.filled]="!!selectedPOL">
                <ng-select
                    [items]="polFilterConfig!.options"
                    [bindLabel]="polFilterConfig!.bindLabel"
                    [bindValue]="polFilterConfig!.bindValue"
                    class="ng-select"
                    [(ngModel)]="selectedPOL"
                    (change)="onPolFilterChange()"
                    [clearable]="true"
                    placeholder=""
                    appendTo="body">
                </ng-select>
                <label class="input-label">{{ polFilterConfig?.label }}</label>
            </div>

            <!-- POD -->
            <div *ngIf="podFilterConfig?.enabled" class="custom-form-group custom-form-group-select dofi-min-w-150"
            [class.filled]="!!selectedPOD">
                <ng-select
                    [items]="podFilterConfig!.options"
                    [bindLabel]="podFilterConfig!.bindLabel"
                    [bindValue]="podFilterConfig!.bindValue"
                    class="ng-select"
                    [(ngModel)]="selectedPOD"
                    (change)="onPodFilterChange()"
                    [clearable]="true"
                    placeholder=""
                    appendTo="body">
                </ng-select>
                <label class="input-label">{{ podFilterConfig?.label }}</label>
            </div>

            <!-- Clear Filters -->
            <div class="action-group">
                <button  class="btn btn-light-secondary btn-sm dofi-min-w-80 dofi-max-w-80" (click)="clearAdvancedFilters()">
                    <i class="fas fa-sync-alt  me-1"></i> Clear
                </button>
            </div>
        </div>

    </div>
</div>
