<div class="pagination-wrapper">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 p-2">
    <!-- Total Records and Page Size Selector -->
    <div class="d-flex align-items-center gap-3">
      <div class="text-muted small">
        {{getRecordRangeText()}}
      </div>
      <div class="d-flex align-items-center gap-2">
        <label class="text-muted small mb-0" for="PageCount">Per page:</label>
        <select class="form-select form-select-sm" style="width: auto;"
                [(ngModel)]="config.pageSize" (change)="onPageSizeChange(config.pageSize)" id="PageCount">
          <option *ngFor="let size of config.pageSizeOptions" [value]="size">{{size}}</option>
        </select>
      </div>
    </div>

    <!-- Custom Pagination -->
    <nav aria-label="Page navigation" *ngIf="paginationInfo && paginationInfo.totalPages > 1">
      <ul class="pagination pagination-sm mb-0">
        <!-- First Page -->
        <li class="page-item" [class.disabled]="!paginationInfo.hasPreviousPage">
          <button class="page-link" (click)="goToFirstPage()" [disabled]="!paginationInfo.hasPreviousPage">
            <i class="fas fa-angle-double-left"></i>
          </button>
        </li>

        <!-- Previous Page -->
        <li class="page-item" [class.disabled]="!paginationInfo.hasPreviousPage">
          <button class="page-link" (click)="previousPage()" [disabled]="!paginationInfo.hasPreviousPage">
            <i class="fas fa-angle-left"></i>
          </button>
        </li>

        <!-- First Ellipsis -->
        <li class="page-item disabled" *ngIf="shouldShowFirstEllipsis()">
          <span class="page-link">...</span>
        </li>

        <!-- Visible Page Numbers -->
        <li class="page-item"
            *ngFor="let pageNum of visiblePages"
            [class.active]="pageNum === config.page">
          <button class="page-link" (click)="goToPage(pageNum)">{{pageNum}}</button>
        </li>

        <!-- Last Ellipsis -->
        <li class="page-item disabled" *ngIf="shouldShowLastEllipsis()">
          <span class="page-link">...</span>
        </li>

        <!-- Next Page -->
        <li class="page-item" [class.disabled]="!paginationInfo.hasNextPage">
          <button class="page-link" (click)="nextPage()" [disabled]="!paginationInfo.hasNextPage">
            <i class="fas fa-angle-right"></i>
          </button>
        </li>

        <!-- Last Page -->
        <li class="page-item" [class.disabled]="!paginationInfo.hasNextPage">
          <button class="page-link" (click)="goToLastPage()" [disabled]="!paginationInfo.hasNextPage">
            <i class="fas fa-angle-double-right"></i>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</div>
