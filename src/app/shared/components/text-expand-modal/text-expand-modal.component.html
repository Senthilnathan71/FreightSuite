<div class="modal-header" [class.compact]="compact">
  <div class="title-wrap">
    <span class="title-icon">
      <i class="fas fa-copy"></i>
    </span>
    <h5 class="modal-title">{{ title }}</h5>
  </div>
  <button type="button" class="btn-close close-btn" aria-label="Close" (click)="close()"></button>
</div>
<div class="modal-body" [class.compact]="compact">
  <div class="editor-shell">
    <textarea
      #ta
      class="form-control text-expand-textarea"
      [value]="text"
      (keydown.enter)="onEnter($event)"
      [attr.maxlength]="maxLength"
      [placeholder]="placeholder"
      readonly
      [rows]="rows"
      [class.compact]="compact"
    ></textarea>
    <div class="char-count" [class.limit]="maxLength && length >= maxLength">
      {{ length }}<ng-container *ngIf="maxLength"> / {{ maxLength }}</ng-container>
    </div>
  </div>
</div>
