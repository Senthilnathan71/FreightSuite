<footer [style.position]="position" [style.bottom]="position === 'absolute' ? '2mm' : null" [style.left]="position === 'absolute' ? '0' : null" [style.right]="position === 'absolute' ? '0' : null" style="text-align:center; font-size:10pt; padding:0.5rem;">
    <div style="display:flex; justify-content:space-between; font-size:14px;">
        <div><span style="font-weight:700;">Printed By :</span> {{ userData.userName }}</div>
        <span *ngIf="showFooterNote">This document is computer-generated and does not require a signature.</span>
        <div><span style="font-weight:700">Printed On : </span>{{ currentDate | formatDate }}</div>
    </div>
   </footer>
