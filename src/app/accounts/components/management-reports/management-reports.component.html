<div class="accounts-reports-container">
  <div class="page-header">
    <div class="row align-items-center">
      <div class="col">
        <h4 class="page-title mb-0">
          <i class="mdi mdi-chart-bar"></i> Management Reports
        </h4>
        <p class="text-muted mb-0">Select a report to view and export financial data</p>
      </div>
      <div class="col-auto" *ngIf="selectedReport">
        <button class="btn btn-secondary btn-sm" (click)="onReportSelected(selectedReport!)">
          <i class="mdi mdi-arrow-left"></i> Back to Reports
        </button>
      </div>
    </div>
  </div>

  <div class="reports-section" *ngIf="!selectedReport">
    <div class="card">
      <div class="card-body py-1">
        <app-report-card-list
          [reports]="reports"
          [loading]="loadingReports"
          (reportSelected)="onReportSelected($event)"
        ></app-report-card-list>
      </div>
    </div>
  </div>

  <div class="report-details-section" *ngIf="selectedReport">
    <div class="mb-1">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <h5 class="mb-0">
            <i class="mdi mdi-file-chart"></i> {{ selectedReport.ReportDisplayName }}
          </h5>
        </div>
        <div>
          <span class="badge bg-secondary">{{ selectedReport.ReportFormat  === "BOTH" ? "PDF / XL" :  selectedReport.ReportFormat }}</span>
        </div>
      </div>
    </div>

    <div class="card mb-1">
      <div class="card-header">
        <h6 class="mb-0">
          <i class="mdi mdi-filter"></i> Report Parameters
        </h6>
      </div>
      <div class="card-body py-1">
        <app-report-parameter-form
          [parameters]="selectedReport.ReportMasterDetail"
          [loading]="generatingReport"
          [module]="'accounts'"
          [companyId]="companyId"
          (onGenerate)="onGenerateReport($event)"
        ></app-report-parameter-form>
      </div>
    </div>

    <div class="card" *ngIf="generatingReport">
      <div class="card-body text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="sr-only">Loading...</span>
        </div>
        <p class="text-muted mt-3">Generating report, please wait...</p>
      </div>
    </div>
  </div>
</div>
