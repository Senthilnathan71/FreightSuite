<ng-select
  [items]="filteredItems"
  [multiple]="true"
  [(ngModel)]="internalValue"
  (ngModelChange)="onModelChange($event)"
  [closeOnSelect]="false"
  [bindLabel]="bindLabel"
  [bindValue]="bindValue"
  [virtualScroll]="true"
  [placeholder]="placeholder"
  [searchable]="searchable"
  (blur)="onTouched()"
  (open)="onOpen()"
  (close)="resetFilter()"
>
  <ng-template ng-header-tmp>
    <div class="px-2 py-2">
      <div class="form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="selectAll"
          [checked]="control?.value?.length === filteredItems.length"
          (change)="toggleSelectAll()"
          (keydown.enter)="toggleSelectAll()"
          tabindex="0"
        >
        <label class="form-check-label" for="selectAll" tabindex="-1">
          {{control?.value?.length === filteredItems.length ? 'Unselect All' : 'Select All'}}
        </label>
      </div>
    </div>
    <div class="px-2 py-1" style="border-top: 1px lightgray solid;" *ngIf="searchable">
      <div class="position-relative">
        <input
          type="text"
          class="form-control pe-5 border-0"
          placeholder="Search"
          [(ngModel)]="filterValue"
          (input)="onSearchInput($event)"
          (keydown)="$event.stopPropagation()"
          tabindex="0"
          #searchInput
        />
        <button
          *ngIf="filterValue"
          type="button"
          class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 p-0 text-secondary"
          (keydown.enter)="clearFilterValue() ; $event.stopPropagation()"
          (click)="clearFilterValue() ; $event.stopPropagation()"
          (keydown.Tab)="$event.stopPropagation()"
          tabindex="0"
          aria-label="Clear search"
          ngbTooltip="Clear search"
          (focus)="isClearFocused = true"
          (blur)="isClearFocused = false"
          [ngClass]="{'text-danger': isClearFocused, 'text-secondary': !isClearFocused}"
        >
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
  </ng-template>
  <ng-template ng-option-tmp let-item="item" let-item$="item$" let-selected="selected" let-marked="marked">
    <div class="form-check">
      <input
        type="checkbox"
        class="form-check-input"
        [checked]="isSelected(item[bindValue])"
        (click)="$event.stopPropagation(); toggleItem(item[bindValue])"
      >
      <label class="form-check-label">{{ item[bindLabel] }}</label>
    </div>
  </ng-template>
  <ng-template ng-multi-label-tmp let-items="items" let-clear="clear">
    <div class="ng-value" *ngFor="let item of items.slice(0, displayCount)">
      <span class="ng-value-label bg-info text-white">{{ item[bindLabel] }}</span>
      <span class="ng-value-icon bg-info text-white" (click)="removeItem(item, $event)">×</span>
    </div>
    <div class="ng-value" *ngIf="items.length > displayCount">
      <span class="ng-value-label bg-info text-white">+{{ items.length - displayCount }} more</span>
    </div>
  </ng-template>
</ng-select>
