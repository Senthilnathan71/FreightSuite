<dofi-searchable-dropdown
  [items]="dialCodeOptions"
  [control]="control"
  [placeholder]="placeholder"
  [displayFields]="lookupConfig.displayFields"
  [displayLabels]="lookupConfig.displayLabels"
  [labelFields]="lookupConfig.labelFields"
  bindLabel="countryName"
  bindValue="dialCode"
  [clearable]="false">
</dofi-searchable-dropdown>
