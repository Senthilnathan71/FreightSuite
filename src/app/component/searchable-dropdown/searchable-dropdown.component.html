



<div class="searchable-dropdown">
  <ng-select 
    #ngSelect 
    class="ngSize" 
    appendTo="body"
    [items]="items" 
    [formControl]="internalControl" 
    [searchable]="true" 
    [clearable]="true"
    [placeholder]="placeholder" 
    [bindLabel]="bindLabel" 
    [bindValue]="bindValue" 
    [loading]="isLoading"
    [searchFn]="searchFn" 
    (open)="onOpen()" 
    (change)="onSelectionChange($event)" 
    (scrollToEnd)="onScrollToEnd()" 
    (keydown.enter)="onOpen()"
    >
    <!-- Label Template -->
    <ng-template ng-label-tmp let-item="item">
      {{ getLabel(item) }}
    </ng-template>

    <!-- Header Template -->
    <ng-template ng-header-tmp>
      <div class="dropdown-header row">
        <div *ngFor="let label of displayLabels; let i = index" [id]="'header'+i" [ngClass]="getColumnStyle(i)" class="text-truncate"  style="min-width: none;">
          {{ label }}
        </div>
      </div>
    </ng-template>

    <!-- Option Template -->
    <ng-template ng-option-tmp let-item="item">
      <div class="dropdown-row row">
        <div *ngFor="let field of displayFields; let i = index" class="text-truncate" [ngClass]="getColumnStyle(i)" style="min-width: none;"
          [ngbTooltip]="item[field]">
          {{ item[field] }}
        </div>
      </div>
    </ng-template>

    <!-- Loading Template -->
    <ng-template ng-loading-tmp>
      <div class="loading-spinner">Loading...</div>
    </ng-template>
  </ng-select>
</div>
