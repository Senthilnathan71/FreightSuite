<div class="searchable-dropdown">
  <ng-select 
    [items]="items"
    [formControl]="internalControl"
    [searchable]="true"
    [clearable]="true"
    [placeholder]="placeholder"
    [bindLabel]="bindLabel"
    [bindValue]="bindValue"
    [loading]="isLoading"
    [searchFn]="searchFn"
    (open)="onOpen()"
    (change)="onSelectionChange($event)"
    container="body"
    appendTo="body"
  >
    <!-- Label Template (selected item) -->
    <ng-template ng-label-tmp let-item="item">
      {{ getLabel(item) }}
    </ng-template>

    <!-- Table Header -->
   <!-- Table Header -->
<ng-template ng-header-tmp>
  <div class="table-wrapper">
    <table class="dropdown-table">
      <thead>
        <tr>
          <th *ngFor="let label of displayLabels" class="px-2">{{ label }}</th>
        </tr>
      </thead>
    </table>
  </div>
</ng-template>

<!-- Table Rows -->
<ng-template ng-option-tmp let-item="item">
  <div class="table-wrapper">
    <table class="dropdown-table">
      <tbody>
        <tr>
          <td *ngFor="let field of displayFields" class="px-2">{{ item[field] }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-template>


    <!-- Loading Template -->
    <ng-template ng-loading-tmp>
      <div class="loading-spinner">Loading...</div>
    </ng-template>
  </ng-select>
</div>
