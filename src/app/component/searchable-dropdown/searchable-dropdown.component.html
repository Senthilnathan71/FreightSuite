<div class="searchable-dropdown-wrapper">
  <!-- Input Field (Trigger) -->
  <div class="dropdown-trigger" [class.disabled]="disabled || internalControl.disabled">
    <input 
      type="text" 
      class="form-control" 
      [value]="getDisplayText()"
      [placeholder]="placeholder"
      [disabled]="disabled || internalControl.disabled"
      readonly
      (click)="openModal(searchModal)"
    />
    <div class="dropdown-actions">
      <button 
        *ngIf="selectedItem && !disabled && !internalControl.disabled" 
        type="button" 
        class="btn-clear"
        (click)="clearSelection(); $event.stopPropagation()">
        ×
      </button>
      <button 
        type="button" 
        class="btn-dropdown"
        [disabled]="disabled || internalControl.disabled"
        (click)="openModal(searchModal)">
        ▼
      </button>
    </div>
  </div>
</div>

<!-- Modal Template -->
<ng-template #searchModal let-modal>
  <div class="modal-header">
    <h6 class="modal-title mb-0">{{ placeholder || 'Select an option' }}</h6>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>
  
  <div class="modal-body">
    <!-- Search Input -->
    <div class="search-box mb-2">
      <input 
        type="text" 
        class="form-control form-control-sm" 
        [formControl]="searchControl"
        placeholder="Search..."
        autofocus
      />
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="text-center py-3">
      <div class="spinner-border spinner-border-sm text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Table -->
    <div *ngIf="!isLoading" class="table-container">
      <table class="table table-sm table-hover table-bordered mb-0">
        <thead class="table-light sticky-header">
          <tr>
            <th *ngFor="let label of displayLabels; let i = index" [ngStyle]="getColumnStyle(i)">
              {{ label }}
            </th>
          </tr>
        </thead>
        <tbody>
          <tr 
            *ngFor="let item of filteredItems"
            [class.table-active]="selectedItem && item[bindValue] === selectedItem[bindValue]"
            (click)="selectItem(item)"
            class="selectable-row">
            <td 
              *ngFor="let field of displayFields; let i = index" 
              [ngStyle]="getColumnStyle(i)"
              [title]="item[field]">
              {{ item[field] }}
            </td>
          </tr>
          <tr *ngIf="filteredItems.length === 0">
            <td [attr.colspan]="displayFields.length" class="text-center text-muted py-3">
              No items found
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <div class="modal-footer py-2">
    <button type="button" class="btn btn-sm btn-secondary" (click)="modal.dismiss()">Cancel</button>
  </div>
</ng-template>
