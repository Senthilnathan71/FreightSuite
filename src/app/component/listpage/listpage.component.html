<div class="col-12">
  <div class="row bg-white mb-2 align-items-center pt-2 rounded shadow-sm">
    <div class="col-md-4 pb-2">
      <h4 class="page-title mb-0">{{ title }}</h4>
    </div>

    <div class="col-md-8 pb-2">
      <form
  class="d-flex flex-wrap align-items-center justify-content-start justify-content-md-end gap-2 mx-0 w-100">
  
  <app-favorite-star [screenName]="title" class="mt-1 me-1"></app-favorite-star>

  <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
    (click)="onCreateClick.emit()">
    <i class="fas fa-plus me-1"></i> Create
  </button>

  <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
    (click)="onReportClick.emit()" [disabled]="!searchPerformed">
    <i class="fas fa-file-alt me-1"></i> Report
  </button>

  <button type="button" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80"
    (click)="emitReset()" [disabled]="!searchPerformed">
    <i class="fas fa-sync-alt me-1"></i> Reset
  </button>
</form>

    </div>

    <div class="col-md-12 border-top">
      <div class="row mx-0 py-2">
        <div class="col-md-8 mx-auto px-0">
          <form
            class="row d-flex flex-wrap align-items-center justify-content-center gap-1 gap-md-2 mx-0"
            (ngSubmit)="onSearchClick.emit({ type: searchType, value: filterValue })"
          >
            <div class="form-outline col-12 col-md px-0">
              <select [(ngModel)]="searchType" name="searchType" class="form-select">
                <option *ngFor="let option of searchOptions" [value]="option.value">
                  {{ option.label }}
                </option>
              </select>
            </div>

            <div class="d-flex gap-2 col-12 col-md px-0 align-items-center">
              <div class="form-outline flex-grow-1 position-relative">
                <input [(ngModel)]="filterValue" name="filterValue" type="text" class="form-control"
                  placeholder="Enter filter value">
                <i class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
              </div>

              <button type="submit" class="btn btn-info btn-sm dofi-min-w-80 dofi-max-w-80">
                <i class="fas fa-search me-1"></i> Search
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
